<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Live Data Entry</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        button:hover { background: #219653; }
        .status-msg { text-align: center; margin-top: 15px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📊 Live Shop Floor Data Entry</h2>
        <form id="dataEntryForm" onsubmit="submitForm(event)">
            
            <div class="form-group">
                <label>Date & Time</label>
                <input type="datetime-local" id="manualDateTime" required>
            </div>

            <div class="form-group">
                <label>Asset / Barcode #</label>
                <input type="text" id="barcode" placeholder="e.g. 14185" required>
            </div>

            <div class="form-group">
                <label>Operator Name</label>
                <input type="text" id="operatorName" placeholder="Enter name" required>
            </div>

            <div class="form-group">
                <label>Shift</label>
                <select id="shift" required>
                    <option value="">-- Choose Shift --</option>
                    <option value="Morning">Morning</option>
                    <option value="Evening">Evening</option>
                    <option value="Night">Night</option>
                </select>
            </div>

            <div class="form-group">
                <label>Entry Type</label>
                <select id="entryType" onchange="toggleFields()" required>
                    <option value="">-- Choose Entry Type --</option>
                    <option value="Production">Production / Performance</option>
                    <option value="Availability">Availability / Maintenance</option>
                    <option value="Quality">Quality / Scrap</option>
                </select>
            </div>

            <!-- Dynamic Fields Container -->
            <div id="dynamicFields"></div>

            <button type="submit" id="submitBtn">Submit Entry</button>
            <div class="status-msg" id="statusMsg"></div>
        </form>
    </div>

    <script>
        // 🔴 YAHAN APNA APPS SCRIPT KA LIVE WEB APP URL PASTE KAREIN (/exec wala) 🔴
        const API_URL = "https://script.google.com/macros/s/AKfycbzREGDC03uDNfgswSy49bMwGtlzok9fiT2Ro1w78JwfmPTp93hhmFnaSRz0pmE3mXJrXA/exec";

        window.onload = function() {
            // Set current local date time by default
            let now = new Date();
            let tzOffset = now.getTimezoneOffset() * 60000;
            let localISOTime = (new Date(now - tzOffset)).toISOString().slice(0, 16);
            document.getElementById("manualDateTime").value = localISOTime;
        };

        function toggleFields() {
            let type = document.getElementById("entryType").value;
            let container = document.getElementById("dynamicFields");
            container.innerHTML = "";

            if (type === "Production") {
                container.innerHTML = `
                    <div class="form-group"><label>Planned Time (Min)</label><input type="number" id="shiftTime" value="480" required></div>
                    <div class="form-group"><label>Ideal CT (Min)</label><input type="number" step="any" id="target" placeholder="e.g. 7" required></div>
                    <div class="form-group"><label>Total Count (Actual)</label><input type="number" id="actual" placeholder="Total produced parts" required></div>
                `;
            } else if (type === "Availability") {
                container.innerHTML = `
                    <div class="form-group"><label>Maintenance Reason</label><input type="text" id="maintReason" placeholder="e.g. Mechanical motor issue" required></div>
                    <div class="form-group"><label>Downtime (Minutes)</label><input type="number" id="downtime" placeholder="e.g. 30" required></div>
                    <div class="form-group"><label>Technician Name</label><input type="text" id="techName" placeholder="Tech name"></div>
                `;
            } else if (type === "Quality") {
                container.innerHTML = `
                    <div class="form-group"><label>Good Parts Count</label><input type="number" id="goodParts" placeholder="Passed parts" required></div>
                    <div class="form-group"><label>Scrap / Reject Count</label><input type="number" id="rejectParts" placeholder="Rejected parts" required></div>
                    <div class="form-group"><label>Reject Reason</label><input type="text" id="rejectReason" placeholder="Reason for rejection"></div>
                `;
            }
        }

        function submitForm(event) {
            event.preventDefault();
            let btn = document.getElementById("submitBtn");
            let msg = document.getElementById("statusMsg");
            
            btn.disabled = true;
            btn.innerText = "Submitting...";
            msg.style.color = "#2980b9";
            msg.innerText = "Sending data to Google Sheet...";

            let payload = {
                manualDateTime: document.getElementById("manualDateTime").value,
                barcode: document.getElementById("barcode").value,
                operatorName: document.getElementById("operatorName").value,
                shift: document.getElementById("shift").value,
                entryType: document.getElementById("entryType").value,
                shiftTime: document.getElementById("shiftTime") ? document.getElementById("shiftTime").value : "",
                target: document.getElementById("target") ? document.getElementById("target").value : "",
                actual: document.getElementById("actual") ? document.getElementById("actual").value : "",
                maintReason: document.getElementById("maintReason") ? document.getElementById("maintReason").value : "",
                downtime: document.getElementById("downtime") ? document.getElementById("downtime").value : "",
                techName: document.getElementById("techName") ? document.getElementById("techName").value : "",
                goodParts: document.getElementById("goodParts") ? document.getElementById("goodParts").value : "",
                rejectParts: document.getElementById("rejectParts") ? document.getElementById("rejectParts").value : "",
                rejectReason: document.getElementById("rejectReason") ? document.getElementById("rejectReason").value : ""
            };

            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerText = "Submit Entry";
                if(data.status === "success") {
                    msg.style.color = "#27ae60";
                    msg.innerText = "✅ Entry saved successfully to Google Sheet!";
                    document.getElementById("dataEntryForm").reset();
                    window.onload(); // Reset datetime
                    document.getElementById("dynamicFields").innerHTML = "";
                } else {
                    msg.style.color = "#e74c3c";
                    msg.innerText = "❌ Error: " + (data.message || "Unknown error");
                }
            })
            .catch(err => {
                btn.disabled = false;
                btn.innerText = "Submit Entry";
                msg.style.color = "#e74c3c";
                msg.innerText = "❌ Network Error: " + err.message;
            });
        }
    </script>
</body>
</html>
