<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OEE & OLE Live Data Entry</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes panBackground {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            padding: 15px; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url('https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            animation: panBackground 40s infinite alternate linear;
        }

        .container { 
            width: 100%;
            max-width: 480px; 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 25px 20px; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            border: 1px solid rgba(255, 255, 255, 0.5);
            max-height: 95vh;
            overflow-y: auto;
        }

        h2 { text-align: center; color: #1a252f; margin-top: 0; margin-bottom: 20px; font-size: 24px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 20px; padding: 0 10px; position: relative; }
        .step-dot { width: 30px; height: 30px; border-radius: 50%; background-color: #e0e6ed; color: #7f8c8d; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; position: relative; z-index: 2; transition: 0.4s ease; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .step-dot.active { background-color: #2980b9; color: white; transform: scale(1.15); box-shadow: 0 0 12px rgba(41,128,185,0.6); }
        .step-dot.completed { background-color: #27ae60; color: white; }
        .step-line { flex: 1; height: 4px; background-color: #e0e6ed; margin-top: 13px; z-index: 1; margin-left: -5px; margin-right: -5px; transition: 0.4s ease; }
        .step-line.completed { background-color: #27ae60; }
        .step-labels { display: flex; justify-content: space-between; font-size: 11px; color: #34495e; font-weight: 600; margin-top: -15px; margin-bottom: 20px; padding: 0 5px; text-transform: uppercase; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #2c3e50; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input, select { 
            width: 100%; 
            padding: 14px; 
            box-sizing: border-box; 
            border: 1px solid #cbd5e1; 
            border-radius: 10px; 
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            background-color: rgba(255,255,255,0.9);
            color: #1e293b;
            transition: 0.3s;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }
        input:focus, select:focus { outline: none; border-color: #3498db; box-shadow: 0 0 0 3px rgba(52,152,219,0.2); }
        
        select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2334495e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 18px;
            padding-right: 40px;
        }

        input[readonly], select:disabled, input:disabled { background-color: #f1f5f9; border-color: #cbd5e1; color: #64748b; font-weight: 600; cursor: not-allowed; }
        
        .ole-label { color: #27ae60 !important; }
        .ole-input { border-color: #27ae60 !important; background-color: #eafaf1 !important; }
        .ole-input:focus { box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.2) !important; }

        .segmented-control { display: flex; background: #e2e8f0; border-radius: 10px; overflow: hidden; padding: 4px; gap: 4px; flex-wrap: wrap;}
        .segmented-control input[type="radio"] { display: none; }
        .segmented-control label { flex: 1; min-width: 80px; text-align: center; padding: 10px 5px; cursor: pointer; transition: 0.3s ease; font-size: 12px; font-weight: 600; color: #475569; border-radius: 8px; }
        .segmented-control input[type="radio"]:checked + label { background: #3498db; color: white; box-shadow: 0 2px 8px rgba(52,152,219,0.4); transform: scale(1.02); }

        .step-content { display: none; animation: slideUp 0.4s ease forwards; opacity: 0; transform: translateY(15px); }
        .step-content.active { display: block; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        
        .info-box { background: rgba(255,255,255,0.6); padding: 18px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.8); margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .status-badge { float: right; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; background: #e74c3c; color: white; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
        
        .nav-buttons { display: flex; justify-content: space-between; gap: 12px; margin-top: 25px; }
        button { flex: 1; padding: 15px; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:active { transform: translateY(2px); box-shadow: none; }
        .btn-prev { background: #7f8c8d; } 
        .btn-prev:hover { background: #6c7a7d; }
        .btn-next { background: #2980b9; } 
        .btn-next:hover { background: #2471a3; }
        .btn-submit { background: #27ae60; }
        .btn-submit:hover { background: #219150; }
        .hidden { display: none !important; }
        .loading-text { font-size: 14px; font-weight: bold; margin-bottom: 15px; text-align: center; color: #d35400; background: rgba(255,255,255,0.8); padding: 10px; border-radius: 8px;}
        
        .downtime-row { display: flex; gap: 12px; }
        .downtime-row .form-group { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Live Data (OEE & OLE)</h2>
        
        <div class="step-indicator">
            <div class="step-dot active" id="dot1">1</div><div class="step-line" id="line1"></div>
            <div class="step-dot" id="dot2">2</div><div class="step-line" id="line2"></div>
            <div class="step-dot" id="dot3">3</div><div class="step-line" id="line3"></div>
            <div class="step-dot" id="dot4">4</div>
        </div>
        <div class="step-labels"><span>Setup</span><span>Avail</span><span>Perf</span><span>Qual</span></div>

        <div id="loadingStatus" class="loading-text">🔄 Syncing with Master System...</div>

        <form id="oeeForm">
            <!-- Step 1: Basic Setup -->
            <div class="step-content active" id="step1">
                <div class="info-box">
                    <div class="form-group"><label>Date & Time</label><input type="datetime-local" id="entryDateTime" required></div>
                    
                    <div class="downtime-row">
                        <div class="form-group"><label style="color: #2980b9;">Department</label><select id="deptSelect" onchange="onDeptChange()"><option value="">-- Choose Dept --</option></select></div>
                        <div class="form-group"><label style="color: #2980b9;">Production Line</label><select id="lineSelect" onchange="onLineChange()"><option value="">-- Select Line --</option></select></div>
                    </div>
                    
                    <div class="form-group">
                        <label style="color: #2980b9;">Select Asset (Machine)</label>
                        <select id="machineSelect" onchange="onMachineSelect()"><option value="">-- Select Machine --</option></select>
                    </div>
                    
                    <div class="form-group"><label>Barcode #</label><input type="text" id="barcode" placeholder="Auto-filled" readonly></div>
                    
                    <div class="form-group">
                        <label style="color: #8e44ad;">Product to Run</label>
                        <select id="productSelect" onchange="onProductSelect()" required><option value="">-- Select Product --</option></select>
                    </div>
                </div>
                
                <div class="downtime-row">
                    <div class="form-group"><label>Operator Name</label><input type="text" id="operatorName" placeholder="Enter name" required></div>
                    <div class="form-group"><label>Shift</label><select id="shift" required><option value="">Select Shift</option><option value="Morning">Morning</option><option value="Evening">Evening</option><option value="Night">Night</option></select></div>
                </div>

                <div class="info-box" style="border-color:#27ae60; background:rgba(46, 204, 113, 0.05);">
                    <div class="downtime-row">
                        <div class="form-group">
                            <label class="ole-label">Labor Time (Mins)</label>
                            <input type="number" id="scheduledLaborTime" class="ole-input" placeholder="e.g. 480" required>
                        </div>
                        <div class="form-group">
                            <label class="ole-label">Actual Manpower</label>
                            <input type="number" id="actualManpower" class="ole-input" placeholder="e.g. 2" required>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 2: Availability -->
            <div class="step-content" id="step2">
                <div class="info-box" id="boxStep2">
                    <span id="availStatus" class="status-badge">Pending</span>
                    <h3 style="margin-top:0; color:#2c3e50; font-weight:700;">Availability</h3>
                    <p style="font-size:11px; color:#e74c3c; font-weight:600; margin-top:-5px;">* Enter 0 if no time lost.</p>
                    
                    <div class="form-group"><label>Planned Time (Mins)</label><input type="number" id="availPlannedTime" value="480" readonly></div>
                    
                    <div class="downtime-row">
                        <div class="form-group"><label>Setup Time</label><input type="number" id="setupTime" placeholder="e.g. 15" oninput="calcAvail()"></div>
                        <div class="form-group"><label>Maint. Time</label><input type="number" id="maintTime" placeholder="e.g. 20" oninput="calcAvail()"></div>
                    </div>

                    <div class="downtime-row">
                        <div class="form-group"><label>Total Downtime</label><input type="number" id="downtime" placeholder="0" readonly></div>
                        <div class="form-group"><label style="color:#2980b9;">Run Time (Mins)</label><input type="number" id="availRunTime" value="480" readonly></div>
                    </div>

                    <div id="maintReasonDiv">
                        <hr style="border: 0; border-top: 1px dashed #cbd5e1; margin: 15px 0;">
                        <div class="form-group">
                            <label style="color:#e74c3c;">Fault Category</label>
                            <div class="segmented-control">
                                <input type="radio" id="faultMech" name="faultType" value="Mechanical" checked>
                                <label for="faultMech">⚙️ Mech</label>
                                <input type="radio" id="faultElec" name="faultType" value="Electrical">
                                <label for="faultElec">⚡ Elec</label>
                                <input type="radio" id="faultBoth" name="faultType" value="Both (M+E)">
                                <label for="faultBoth">🛠️ Both</label>
                            </div>
                        </div>

                        <div class="form-group">
                            <label style="color:#e74c3c;">Fault Details / Remarks</label>
                            <select id="maintReasonSelect" onchange="handleOther('maintReason')"><option value="">-- Select Reason --</option></select>
                            <input type="text" id="maintReasonOther" class="hidden" placeholder="Type specific remarks..." style="margin-top:10px;">
                        </div>
                    </div>
                    
                    <hr style="border: 0; border-top: 1px dashed #27ae60; margin: 15px 0;">
                    <div class="downtime-row">
                        <div class="form-group">
                            <label class="ole-label">Labor Loss Time</label>
                            <input type="number" id="laborLossTime" class="ole-input" placeholder="e.g. 30" value="0">
                        </div>
                        <div class="form-group">
                            <label class="ole-label">Labor Loss Reason</label>
                            <select id="laborLossReason" class="ole-input">
                                <option value="">Select Reason...</option>
                                <option value="Absenteeism">Absenteeism / Late</option>
                                <option value="Extended Break">Extended Break</option>
                                <option value="No Operator">No Operator Available</option>
                                <option value="Meeting">Meeting / Training</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 3: Performance -->
            <div class="step-content" id="step3">
                <div class="info-box" id="boxStep3">
                    <span id="perfStatus" class="status-badge">Pending</span>
                    <h3 style="margin-top:0; color:#2c3e50; font-weight:700;">Performance</h3>
                    <div class="form-group"><label id="lblShiftTime">Available Time (Mins)</label><input type="number" id="shiftTime" value="480" readonly></div>
                    
                    <div class="downtime-row">
                        <div class="form-group"><label>Ideal CT (Mins)</label><input type="number" step="0.01" id="target" readonly></div>
                        <div class="form-group"><label>Shift Target</label><input type="number" id="stdProd" readonly></div>
                    </div>

                    <hr style="border: 0; border-top: 1px dashed #cbd5e1; margin: 20px 0;">
                    <div class="form-group"><label style="color:#2980b9;">Total Parts Produced</label><input type="number" id="actual" placeholder="Enter total parts" style="font-size:20px; font-weight:bold; color:#2980b9;"></div>
                    
                    <div class="form-group" id="lossReasonDiv">
                        <label style="color:#e74c3c;">Performance Loss Reason</label>
                        <select id="lossReasonSelect" onchange="handleOther('lossReason')">
                            <option value="">-- Select Reason --</option>
                        </select>
                        <input type="text" id="lossReasonOther" class="hidden" placeholder="Type specific reason here..." style="margin-top:10px;">
                    </div>
                </div>
            </div>

            <!-- Step 4: Quality -->
            <div class="step-content" id="step4">
                <div class="info-box" id="boxStep4">
                    <span id="qualStatus" class="status-badge">Pending</span>
                    <h3 style="margin-top:0; color:#2c3e50; font-weight:700;">Quality</h3>
                    
                    <div class="form-group"><label>Good Count</label><input type="number" id="goodParts" placeholder="Enter OK parts" oninput="calculateScrap()" style="font-size:20px; font-weight:bold; color:#27ae60;"></div>
                    <div class="form-group"><label>Scrap Count (Auto)</label><input type="number" id="rejectParts" readonly placeholder="0" style="color:#e74c3c; font-weight:bold;"></div>
                    
                    <div class="form-group" id="rejectReasonDiv">
                        <label>Reject Reason</label>
                        <select id="rejectReasonSelect" onchange="handleOther('rejectReason')"><option value="">-- Select Reason --</option></select>
                        <input type="text" id="rejectReasonOther" class="hidden" placeholder="Type specific reason here..." style="margin-top:10px;">
                    </div>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="nav-buttons">
                <button type="button" id="btnPrev" class="btn-prev hidden" onclick="goPrev()">Back</button>
                <button type="button" id="btnNext" class="btn-next" onclick="goNext()">Next</button>
                <button type="button" id="btnSubmit" class="btn-submit hidden" onclick="submitData()">Save Data</button>
            </div>
        </form>
    </div>

    <script>
        // Deployment URL Update Karein
        const API_URL = "https://script.google.com/macros/s/AKfycbzREGDC03uDNfgswSy49bMwGtlzok9fiT2Ro1w78JwfmPTp93hhmFnaSRz0pmE3mXJrXA/exec"; 
        
        let allRegisteredMachines = []; 
        let allLogs = [];
        let currentStep = 1;

        function getSafeVal(obj, possibleKeys) {
            let lowerKeys = possibleKeys.map(k => k.toLowerCase().replace(/\s/g, ''));
            for(let key in obj) { 
                if(lowerKeys.includes(key.toLowerCase().replace(/\s/g, ''))) return obj[key]; 
            }
            return "";
        }

        window.onload = function() {
            let now = new Date(); 
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('entryDateTime').value = now.toISOString().slice(0,16);
            fetchData();
        };

        function fetchData() {
            let cachedM = localStorage.getItem("mes_machines"); 
            let cachedL = localStorage.getItem("mes_logs");
            
            if (cachedM && cachedL) {
                allRegisteredMachines = JSON.parse(cachedM); 
                allLogs = JSON.parse(cachedL);
                document.getElementById('loadingStatus').style.display = 'none';
                populateDeptDropdown();
            }

            fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                allRegisteredMachines = data.machines || []; 
                allLogs = data.logs || [];
                localStorage.setItem("mes_machines", JSON.stringify(allRegisteredMachines)); 
                localStorage.setItem("mes_logs", JSON.stringify(allLogs)); 
                document.getElementById('loadingStatus').style.display = 'none';
                populateDeptDropdown();
            })
            .catch(e => {
                console.error(e);
                document.getElementById('loadingStatus').innerText = "⚠️ Offline mode / Failed sync"; 
            });
        }

        function populateDeptDropdown() {
            const select = document.getElementById("deptSelect");
            select.innerHTML = '<option value="">-- Choose Dept --</option>';
            let depts = [...new Set(allRegisteredMachines.map(m => getSafeVal(m, ["Department", "Dept"])))].filter(Boolean);
            depts.forEach(d => select.innerHTML += `<option value="${d}">${d}</option>`);
        }

        function onDeptChange() {
            const dept = document.getElementById("deptSelect").value;
            const lineSel = document.getElementById("lineSelect");
            lineSel.innerHTML = '<option value="">-- Select Line --</option>';
            document.getElementById("machineSelect").innerHTML = '<option value="">-- Select Machine --</option>';
            document.getElementById("productSelect").innerHTML = '<option value="">-- Select Product --</option>';
            if(!dept) return;
            
            let lines = [...new Set(allRegisteredMachines.filter(m => getSafeVal(m, ["Department", "Dept"]) === dept).map(m => getSafeVal(m, ["LineName", "Line"])))].filter(Boolean);
            lines.forEach(l => lineSel.innerHTML += `<option value="${l}">${l}</option>`);
        }

        function onLineChange() {
            const line = document.getElementById("lineSelect").value;
            const machSel = document.getElementById("machineSelect");
            machSel.innerHTML = '<option value="">-- Select Machine --</option>';
            document.getElementById("productSelect").innerHTML = '<option value="">-- Select Product --</option>';
            if (!line) return;
            
            let lineMachines = allRegisteredMachines.filter(m => getSafeVal(m, ["LineName", "Line"]) === line);
            let uniqueAssets = new Set();
            lineMachines.forEach((m) => {
                let name = getSafeVal(m, ["MachineName", "Machine"]);
                let asset = getSafeVal(m, ["AssetNumber", "Barcode", "Asset#"]);
                if(asset && !uniqueAssets.has(asset)) {
                    uniqueAssets.add(asset);
                    machSel.innerHTML += `<option value="${asset}">${name} (${asset})</option>`;
                }
            });
        }

        function onMachineSelect() {
            const asset = document.getElementById("machineSelect").value;
            const prodSel = document.getElementById("productSelect");
            prodSel.innerHTML = '<option value="">-- Select Product --</option>';
            document.getElementById("barcode").value = asset;
            if (!asset) return;

            let machineData = allRegisteredMachines.filter(m => String(getSafeVal(m, ["AssetNumber", "Barcode", "Asset#"])) === asset);
            
            machineData.forEach(m => {
                let pName = getSafeVal(m, ["ProductName", "Product"]);
                if(pName) {
                    let opt = document.createElement("option");
                    opt.value = pName; 
                    opt.innerText = pName;
                    opt.dataset.ct = getSafeVal(m, ["IdealCT", "Target"]);
                    opt.dataset.std = getSafeVal(m, ["StdProduction", "TargetQty"]);
                    prodSel.appendChild(opt);
                }
            });
        }

        function onProductSelect() {
            const prodSel = document.getElementById("productSelect");
            const opt = prodSel.options[prodSel.selectedIndex];
            if(opt && opt.value) {
                document.getElementById("target").value = opt.dataset.ct || 0; 
                document.getElementById("stdProd").value = opt.dataset.std || 0; 
            }
        }

        function calcAvail() {
            let setup = parseFloat(document.getElementById("setupTime").value) || 0;
            let maint = parseFloat(document.getElementById("maintTime").value) || 0;
            let totalDowntime = setup + maint;
            let planned = parseFloat(document.getElementById("availPlannedTime").value) || 480;
            
            document.getElementById("downtime").value = totalDowntime;
            document.getElementById("availRunTime").value = Math.max(0, planned - totalDowntime);
            document.getElementById("shiftTime").value = Math.max(0, planned - totalDowntime);
        }

        function calculateScrap() {
            let actual = parseFloat(document.getElementById("actual").value) || 0;
            let good = parseFloat(document.getElementById("goodParts").value) || 0;
            let scrap = Math.max(0, actual - good);
            document.getElementById("rejectParts").value = scrap;
        }

        function handleOther(type) {
            let val = document.getElementById(type + "Select").value;
            let oth = document.getElementById(type + "Other");
            if (val === "Other") oth.classList.remove("hidden");
            else { oth.classList.add("hidden"); oth.value = ""; }
        }

        function updateUI() {
            for(let i = 1; i <= 4; i++) {
                document.getElementById('step' + i).classList.remove('active');
                if(i <= currentStep) document.getElementById('dot' + i).classList.add('active'); 
                else document.getElementById('dot' + i).classList.remove('active');
                
                if(i < currentStep && document.getElementById('line' + i)) {
                    document.getElementById('line' + i).classList.add('completed');
                } else if(document.getElementById('line' + i)) {
                    document.getElementById('line' + i).classList.remove('completed');
                }
            }
            
            document.getElementById('step' + currentStep).classList.add('active');
            document.getElementById('btnPrev').classList.toggle('hidden', currentStep === 1);
            
            if(currentStep === 4) { 
                document.getElementById('btnNext').classList.add('hidden'); 
                document.getElementById('btnSubmit').classList.remove('hidden'); 
            } else {
                document.getElementById('btnNext').classList.remove('hidden'); 
                document.getElementById('btnSubmit').classList.add('hidden'); 
            }
        }

        function goNext() {
            if(currentStep < 4) {
                currentStep++;
                updateUI();
            }
        }

        function goPrev() {
            if(currentStep > 1) {
                currentStep--;
                updateUI();
            }
        }

        function submitData() {
            let btn = document.getElementById("btnSubmit");
            if(btn) { btn.innerText = "Saving Data..."; btn.disabled = true; }

            // Extract selected/custom values
            let maintSel = document.getElementById("maintReasonSelect").value;
            let maintVal = (maintSel === "Other") ? document.getElementById("maintReasonOther").value : maintSel;

            let lossSel = document.getElementById("lossReasonSelect").value;
            let lossVal = (lossSel === "Other") ? document.getElementById("lossReasonOther").value : lossSel;

            let rejSel = document.getElementById("rejectReasonSelect").value;
            let rejVal = (rejSel === "Other") ? document.getElementById("rejectReasonOther").value : rejSel;

            let payload = {
                "Timestamp": new Date().toISOString(),
                "Date": document.getElementById("entryDateTime").value,
                "Shift": document.getElementById("shift").value,
                "Barcode#": document.getElementById("barcode").value,
                "EntryType": "Live Log Entry",
                "Maint.Reason": maintVal,
                "Downtime(Min)": document.getElementById("downtime").value || 0,
                "LaborLossTime": document.getElementById("laborLossTime").value || 0,
                "ScheduledLaborTime": document.getElementById("scheduledLaborTime").value || 0,
                "ActualManpower": document.getElementById("actualManpower").value || 0,
                "Low Production Reason": lossVal,
                "IdealCT(Min)": document.getElementById("target").value || 0,
                "PlannedTime(Min)": document.getElementById("availPlannedTime").value || 480,
                "TotalCount": document.getElementById("actual").value || 0,
                "RejectReason": rejVal,
                "GoodCount": document.getElementById("goodParts").value || 0,
                "ScrapCount": document.getElementById("rejectParts").value || 0
            };

            fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8' 
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                alert("✅ Data Successfully Saved!");
                if(btn) { btn.innerText = "Save Data"; btn.disabled = false; }
                document.getElementById("oeeForm").reset();
                currentStep = 1;
                updateUI();
            })
            .catch((error) => {
                console.error("Error saving data:", error);
                alert("⚠️ Data Save ho gaya hai (no-cors mode) ya network check karein.");
                if(btn) { btn.innerText = "Save Data"; btn.disabled = false; }
            });
        }
    </script>
</body>
</html>
