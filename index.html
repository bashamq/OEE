<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OEE Data Entry</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; padding: 20px; margin: 0; }
        .container { max-width: 450px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #34495e; font-size: 14px; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        input[readonly] { background-color: #e8f8f5; border-color: #1abc9c; color: #16a085; font-weight: bold; cursor: not-allowed; }
        .hidden { display: none; }
        .section-box { background: #f8f9fa; padding: 15px; border-radius: 6px; border: 1px solid #dee2e6; margin-bottom: 15px; }
        .selection-box { background-color: #f4f6f7; border: 1px solid #d5dbdb; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;}
        button:hover { background: #219150; }
        .loading-text { font-size: 13px; font-weight: bold; margin-bottom: 10px; text-align: center; color: #f39c12; }
    </style>
</head>
<body>
    <div class="container">
        <h2>OEE Data Entry Form</h2>
        <form id="oeeForm">
            <div class="form-group"><label>Date & Time</label><input type="datetime-local" id="entryDateTime" required></div>
            
            <div id="loadingStatus" class="loading-text">Loading registered machines & logs...</div>

            <div class="selection-box">
                <div class="form-group">
                    <label style="color: #2980b9;">1. Select Line / Department</label>
                    <select id="lineSelect" onchange="onLineChange()">
                        <option value="">-- Choose Production Line --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label style="color: #2980b9;">2. Select Machine (Name & Operation)</label>
                    <select id="machineSelect" onchange="onMachineSelect()">
                        <option value="">-- Select Line First --</option>
                    </select>
                </div>
            </div>

            <div class="form-group"><label>Barcode # (Asset Number)</label><input type="text" id="barcode" required placeholder="Auto-filled or Scan QR" readonly></div>
            <div class="form-group"><label>Operator Name</label><input type="text" id="operatorName" required></div>
            <div class="form-group">
                <label>Shift</label>
                <select id="shift" required>
                    <option value="">Select Shift</option>
                    <option value="Morning">Morning</option>
                    <option value="Evening">Evening</option>
                    <option value="Night">Night</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Entry Type (Follow Sequence)</label>
                <select id="entryType" required onchange="toggleSections()">
                    <option value="">Select Type...</option>
                    <option value="Maintenance">1. Maintenance</option>
                    <option value="Production">2. Production</option>
                    <option value="Quality">3. Quality</option>
                </select>
            </div>

            <!-- Maintenance Section -->
            <div id="maintenanceSection" class="section-box hidden">
                <p style="font-size:12px; color:#e74c3c; font-weight:bold; margin-top:0;">* Required first. Enter 0 if no downtime.</p>
                <div class="form-group"><label>Total Downtime (Mins)</label><input type="number" id="downtime" placeholder="Enter 0 if machine ran fine"></div>
                <div class="form-group"><label>Maintenance Reason</label><input type="text" id="maintReason" placeholder="e.g. Motor Heat, or 'No Issue'"></div>
                <div class="form-group"><label>Technician Name</label><input type="text" id="techName" placeholder="Leave blank if no issue"></div>
            </div>

            <!-- Production Section -->
            <div id="productionSection" class="section-box hidden">
                <div class="form-group">
                    <label id="lblShiftTime">Available Time (Mins)</label>
                    <input type="number" id="shiftTime" value="480" readonly>
                </div>
                <div class="form-group"><label>Ideal CT (Min/part)</label><input type="number" step="0.01" id="target" readonly></div>
                <div class="form-group"><label>Standard Production (Shift Target)</label><input type="number" id="stdProd" readonly></div>
                <hr style="border: 0; border-top: 1px solid #ccc; margin: 20px 0;">
                <div class="form-group"><label style="color:#2980b9;">Total Count (Parts Produced)</label><input type="number" id="actual" placeholder="Enter parts produced today"></div>
                <div class="form-group hidden" id="lossReasonDiv"><label style="color:#e74c3c;">Performance Loss Reason (Why less?)</label><input type="text" id="lossReason" placeholder="e.g. Tool change, low speed"></div>
            </div>

            <!-- Quality Section -->
            <div id="qualitySection" class="section-box hidden">
                <p id="qualProdTarget" style="font-size:12px; color:#16a085; font-weight:bold; margin-top:0;"></p>
                <div class="form-group"><label>Good Count</label><input type="number" id="goodParts" placeholder="Enter good parts"></div>
                <div class="form-group"><label>Scrap Count (Auto calculated)</label><input type="number" id="rejectParts" readonly placeholder="0"></div>
                <div class="form-group"><label>Reject Reason</label><input type="text" id="rejectReason" placeholder="e.g. Porosity, Undersize"></div>
            </div>

            <button type="submit" id="submitBtn">Submit Data</button>
        </form>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyRkmh4_ofJjAftObCfnX9gmhqCa4xcsvSp143BXCUdQujfy4gaFkBMlEhsVrwa61HugQ/exec";
        let allRegisteredMachines = [];
        let allLogs = [];
        let currentTotalProduced = 0; 

        function getSafeVal(obj, possibleKeys) {
            let lowerKeys = possibleKeys.map(k => k.toLowerCase().replace(/\s/g, ''));
            for(let key in obj) {
                if(lowerKeys.includes(key.toLowerCase().replace(/\s/g, ''))) return obj[key];
            }
            return "";
        }

        window.onload = function() {
            let now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('entryDateTime').value = now.toISOString().slice(0,16);
            fetchData(false);
        };

        function fetchData(isSilent) {
            if (!isSilent) {
                let cachedM = localStorage.getItem("mes_machines");
                let cachedL = localStorage.getItem("mes_logs");
                if (cachedM && cachedL) {
                    allRegisteredMachines = JSON.parse(cachedM);
                    allLogs = JSON.parse(cachedL);
                    document.getElementById('loadingStatus').style.display = 'none';
                    populateLineDropdown();
                    processQRScan();
                }
            }

            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    allRegisteredMachines = data.machines || [];
                    allLogs = data.logs || [];
                    localStorage.setItem("mes_machines", JSON.stringify(allRegisteredMachines)); 
                    localStorage.setItem("mes_logs", JSON.stringify(allLogs)); 
                    
                    if (!isSilent && !localStorage.getItem("mes_machines")) {
                        document.getElementById('loadingStatus').style.display = 'none';
                        populateLineDropdown();
                        processQRScan();
                    }
                }).catch(err => {
                    if(!isSilent && !localStorage.getItem("mes_machines")) {
                        document.getElementById('loadingStatus').innerText = "⚠️ Error loading data.";
                    }
                });
        }

        function processQRScan() {
            const urlParams = new URLSearchParams(window.location.search);
            const assetFromQR = urlParams.get('asset');
            if(assetFromQR) autoSelectFromQR(assetFromQR);
        }

        function populateLineDropdown() {
            const lineSelect = document.getElementById("lineSelect");
            lineSelect.innerHTML = '<option value="">-- Choose Production Line --</option>';
            let uniqueLines = [...new Set(allRegisteredMachines.map(m => getSafeVal(m, ["LineName", "Line", "Department"])))].filter(Boolean);
            uniqueLines.forEach(line => {
                let opt = document.createElement("option");
                opt.value = line; opt.innerText = line;
                lineSelect.appendChild(opt);
            });
        }

        function onLineChange() {
            const selectedLine = document.getElementById("lineSelect").value;
            const machSelect = document.getElementById("machineSelect");
            machSelect.innerHTML = '<option value="">-- Select Machine --</option>';
            document.getElementById("barcode").value = ""; document.getElementById("target").value = ""; document.getElementById("stdProd").value = "";
            if (!selectedLine) return;

            let lineMachines = allRegisteredMachines.filter(m => getSafeVal(m, ["LineName", "Line", "Department"]) === selectedLine);
            lineMachines.forEach((m) => {
                let name = getSafeVal(m, ["MachineName", "Machine"]);
                let op = getSafeVal(m, ["Operation", "Op", "OperationName"]);
                let asset = getSafeVal(m, ["AssetNumber", "Asset#", "Barcode"]);
                let opt = document.createElement("option");
                opt.value = asset; 
                opt.innerText = `${name} | Op: ${op} (${asset})`;
                opt.dataset.ct = getSafeVal(m, ["IdealCT", "IdealCT(Min)", "Target"]);
                opt.dataset.std = getSafeVal(m, ["StdProduction", "StandardProduction", "TargetQty"]);
                machSelect.appendChild(opt);
            });
        }

        function onMachineSelect() {
            const machSelect = document.getElementById("machineSelect");
            const selectedOpt = machSelect.options[machSelect.selectedIndex];
            if (selectedOpt && selectedOpt.value) {
                document.getElementById("barcode").value = selectedOpt.value; 
                document.getElementById("target").value = selectedOpt.dataset.ct || 0; 
                document.getElementById("stdProd").value = selectedOpt.dataset.std || 0; 
                
                // Reset Shift Time & Label just in case
                document.getElementById("shiftTime").value = 480;
                document.getElementById("lblShiftTime").innerHTML = `Available Time (Mins)`;

                // Re-trigger validations if entry type is already selected
                let eType = document.getElementById("entryType").value;
                if(eType === "Production") checkMaintenanceForProduction();
                if(eType === "Quality") checkProductionForQuality();

                checkTarget();
            }
        }

        function autoSelectFromQR(asset) {
            let m = allRegisteredMachines.find(x => String(getSafeVal(x, ["AssetNumber", "Asset#", "Barcode"])) === String(asset));
            if (m) {
                document.getElementById("lineSelect").value = getSafeVal(m, ["LineName", "Line", "Department"]);
                onLineChange();
                document.getElementById("machineSelect").value = asset;
                onMachineSelect();
            }
        }

        function toggleSections() {
            const type = document.getElementById("entryType").value;
            document.getElementById("productionSection").classList.add("hidden");
            document.getElementById("maintenanceSection").classList.add("hidden");
            document.getElementById("qualitySection").classList.add("hidden");
            
            if(type === "Maintenance") {
                document.getElementById("maintenanceSection").classList.remove("hidden");
            }
            if(type === "Production") {
                checkMaintenanceForProduction();
            }
            if(type === "Quality") {
                checkProductionForQuality();
            }
        }

        // --- PRODUCTION INTERLOCK WITH DYNAMIC TARGET & DOWNTIME DEDUCTION ---
        function checkMaintenanceForProduction() {
            const barcode = document.getElementById("barcode").value;
            const shift = document.getElementById("shift").value;

            if (!barcode || !shift) {
                alert("⚠️ Please select Machine and Shift first before entering Production.");
                document.getElementById("entryType").value = "";
                return;
            }

            let todayStr = new Date().toDateString(); 
            
            let maintLog = allLogs.slice().reverse().find(log => {
                let logDate = new Date(getSafeVal(log, ["Timestamp", "Date"])).toDateString();
                return (logDate === todayStr) && 
                       (String(getSafeVal(log, ["Barcode#", "Barcode", "AssetNumber"])) === String(barcode)) && 
                       (String(getSafeVal(log, ["Shift"])) === String(shift)) && 
                       (String(getSafeVal(log, ["EntryType", "Type"])) === "Maintenance");
            });

            if (!maintLog) {
                alert("⚠️ Error: Maintenance entry NOT FOUND for this Machine and Shift today!\nPlease submit a Maintenance entry first (Enter 0 downtime if machine is okay).");
                document.getElementById("entryType").value = "";
            } else {
                // Downtime Extract and Minus Logic
                let downtime = Number(getSafeVal(maintLog, ["Downtime(Min)", "Downtime"])) || 0;
                let availableTime = 480 - downtime;
                
                document.getElementById("shiftTime").value = availableTime;
                
                if(downtime > 0) {
                    document.getElementById("lblShiftTime").innerHTML = `Available Time (Mins) <span style="color:#e74c3c; font-size:12px;">(-${downtime}m Maint)</span>`;
                } else {
                    document.getElementById("lblShiftTime").innerHTML = `Available Time (Mins)`;
                }

                // Dynamic Shift Target Calculation based on Available Time
                let idealCT = parseFloat(document.getElementById("target").value) || 0;
                if (idealCT > 0) {
                    let newTarget = Math.floor(availableTime / idealCT);
                    document.getElementById("stdProd").value = newTarget;
                }

                document.getElementById("productionSection").classList.remove("hidden");
                checkTarget();
            }
        }

        // --- QUALITY INTERLOCK LOGIC (Check for Production First) ---
        function checkProductionForQuality() {
            const barcode = document.getElementById("barcode").value;
            const shift = document.getElementById("shift").value;

            if (!barcode || !shift) {
                alert("⚠️ Please select Machine and Shift first before entering Quality.");
                document.getElementById("entryType").value = "";
                return;
            }

            let todayStr = new Date().toDateString(); 
            
            let prodLog = allLogs.slice().reverse().find(log => {
                let logDate = new Date(getSafeVal(log, ["Timestamp", "Date"])).toDateString();
                return (logDate === todayStr) && 
                       (String(getSafeVal(log, ["Barcode#", "Barcode", "AssetNumber"])) === String(barcode)) && 
                       (String(getSafeVal(log, ["Shift"])) === String(shift)) && 
                       (String(getSafeVal(log, ["EntryType", "Type"])) === "Production");
            });

            if (!prodLog) {
                alert("⚠️ Error: Production entry NOT FOUND for this Machine and Shift today!\nPlease submit Production data first.");
                document.getElementById("entryType").value = "";
                currentTotalProduced = 0;
            } else {
                currentTotalProduced = Number(getSafeVal(prodLog, ["TotalCount", "Actual", "TotalProduced"])) || 0;
                document.getElementById("qualProdTarget").innerText = `Total Parts Produced in Shift: ${currentTotalProduced}`;
                document.getElementById("goodParts").placeholder = `Max allowed: ${currentTotalProduced}`;
                document.getElementById("goodParts").value = "";
                document.getElementById("rejectParts").value = "";
                document.getElementById("qualitySection").classList.remove("hidden");
            }
        }

        document.getElementById("goodParts").addEventListener("input", calculateScrap);
        
        function calculateScrap() {
            if(document.getElementById("entryType").value !== "Quality") return;
            
            let good = parseInt(document.getElementById("goodParts").value) || 0;
            if (good > currentTotalProduced) {
                alert(`⚠️ Good parts cannot be greater than Total Produced (${currentTotalProduced})!`);
                document.getElementById("goodParts").value = currentTotalProduced;
                good = currentTotalProduced;
            }
            let scrap = currentTotalProduced - good;
            document.getElementById("rejectParts").value = scrap;
        }

        document.getElementById("actual").addEventListener("input", checkTarget);
        function checkTarget() {
            let actual = parseFloat(document.getElementById("actual").value) || 0;
            let stdProd = parseFloat(document.getElementById("stdProd").value) || 0;
            if(actual > 0 && actual < stdProd) document.getElementById("lossReasonDiv").classList.remove("hidden");
            else document.getElementById("lossReasonDiv").classList.add("hidden");
        }

        document.getElementById("oeeForm").addEventListener("submit", function(e) {
            e.preventDefault(); 
            
            const entryType = document.getElementById("entryType").value;
            
            if (!document.getElementById("barcode").value) {
                alert("⚠️ Error: Please select a Line and Machine first!");
                return;
            }

            if (entryType === "Production") {
                const actual = document.getElementById("actual").value;
                const stdProd = parseFloat(document.getElementById("stdProd").value) || 0;
                const lossReason = document.getElementById("lossReason").value;
                
                if (actual === "") { alert("⚠️ Error: Please enter Total Count."); return; }
                if (parseFloat(actual) < stdProd && lossReason.trim() === "") {
                    alert("⚠️ Error: Target missed! Please enter a Performance Loss Reason."); return;
                }
            } else if (entryType === "Maintenance") {
                if (document.getElementById("downtime").value === "") { alert("⚠️ Error: Please enter Total Downtime (Enter 0 if none)."); return; }
            } else if (entryType === "Quality") {
                const goodParts = document.getElementById("goodParts").value;
                const rejectParts = document.getElementById("rejectParts").value;
                const rejectReason = document.getElementById("rejectReason").value;
                
                if (goodParts === "") { alert("⚠️ Error: Please enter Good Count."); return; }
                if (parseFloat(rejectParts) > 0 && rejectReason.trim() === "") {
                    alert("⚠️ Error: Scrap parts detected! Please enter a Reject Reason."); return;
                }
            }

            const btn = document.getElementById("submitBtn");
            btn.innerText = "Submitting..."; btn.disabled = true;
            
            const data = {
                formType: "dataEntry",
                manualDateTime: document.getElementById("entryDateTime").value,
                barcode: document.getElementById("barcode").value,
                operatorName: document.getElementById("operatorName").value,
                shift: document.getElementById("shift").value,
                entryType: document.getElementById("entryType").value,
                shiftTime: document.getElementById("shiftTime").value,
                target: document.getElementById("target").value, 
                actual: document.getElementById("actual").value,
                lossReason: document.getElementById("lossReason").value,
                maintReason: document.getElementById("maintReason").value,
                downtime: document.getElementById("downtime").value,
                techName: document.getElementById("techName").value,
                goodParts: document.getElementById("goodParts").value,
                rejectParts: document.getElementById("rejectParts").value,
                rejectReason: document.getElementById("rejectReason").value,
                lineName: document.getElementById("lineSelect").value
            };

            fetch(API_URL, { method: "POST", body: JSON.stringify(data) })
            .then(res => res.json()) 
            .then(res => {
                alert("Data Saved Successfully!");
                document.getElementById("oeeForm").reset(); 
                let now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('entryDateTime').value = now.toISOString().slice(0,16);
                toggleSections();
                btn.innerText = "Submit Data"; btn.disabled = false;
                fetchData(true); 
            }).catch(err => { alert("Error saving data"); btn.innerText = "Submit Data"; btn.disabled = false; });
        });
    </script>
</body>
</html>
