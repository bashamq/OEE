<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OEE Data Entry</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; padding: 20px; margin: 0; }
        .container { max-width: 450px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #34495e; font-size: 14px; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        
        input[readonly] { background-color: #e8f8f5; border-color: #1abc9c; color: #16a085; font-weight: bold; cursor: not-allowed; }
        
        .hidden { display: none; }
        .section-box { background: #f8f9fa; padding: 15px; border-radius: 6px; border: 1px solid #dee2e6; margin-bottom: 15px; }
        
        /* Dropdown Highlight Style */
        .selection-box { background-color: #f4f6f7; border: 1px solid #d5dbdb; padding: 12px; border-radius: 8px; margin-bottom: 15px; }
        
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;}
        button:hover { background: #219150; }
        .loading-text { font-size: 13px; font-weight: bold; margin-bottom: 10px; text-align: center; color: #f39c12; }
    </style>
</head>
<body>
    <div class="container">
        <h2>OEE Data Entry Form</h2>
        <form id="oeeForm">
            <div class="form-group"><label>Date & Time</label><input type="datetime-local" id="entryDateTime" required></div>
            
            <div id="loadingStatus" class="loading-text">Loading registered machines...</div>

            <!-- NAYE DROPDOWNS: Line & Machine Selection -->
            <div class="selection-box">
                <div class="form-group">
                    <label style="color: #2980b9;">1. Select Line / Department</label>
                    <select id="lineSelect" onchange="onLineChange()">
                        <option value="">-- Choose Production Line --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label style="color: #2980b9;">2. Select Machine (Name & Operation)</label>
                    <select id="machineSelect" onchange="onMachineSelect()">
                        <option value="">-- Select Line First --</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Barcode # (Asset Number)</label>
                <input type="text" id="barcode" required placeholder="Auto-filled or Scan QR" readonly>
            </div>

            <div class="form-group"><label>Operator Name</label><input type="text" id="operatorName" required></div>
            <div class="form-group">
                <label>Shift</label>
                <select id="shift" required>
                    <option value="">Select Shift</option><option value="Morning">Morning</option><option value="Evening">Evening</option><option value="Night">Night</option>
                </select>
            </div>
            <div class="form-group">
                <label>Entry Type</label>
                <select id="entryType" required onchange="toggleSections()">
                    <option value="">Select Type...</option><option value="Production">Production</option><option value="Maintenance">Maintenance</option><option value="Quality">Quality</option>
                </select>
            </div>

            <!-- Production Section -->
            <div id="productionSection" class="section-box hidden">
                <div class="form-group"><label>Planned Time (Mins)</label><input type="number" id="shiftTime" value="480" readonly></div>
                <div class="form-group"><label>Ideal CT (Min/part)</label><input type="number" step="0.01" id="target" readonly></div>
                <div class="form-group"><label>Standard Production (Shift Target)</label><input type="number" id="stdProd" readonly></div>
                
                <hr style="border: 0; border-top: 1px solid #ccc; margin: 20px 0;">
                
                <div class="form-group"><label style="color:#2980b9;">Total Count (Parts Produced)</label><input type="number" id="actual" placeholder="Enter parts produced today"></div>
                <div class="form-group hidden" id="lossReasonDiv"><label style="color:#e74c3c;">Performance Loss Reason (Why less?)</label><input type="text" id="lossReason" placeholder="e.g. Tool change, low speed"></div>
            </div>

            <!-- Maintenance Section -->
            <div id="maintenanceSection" class="section-box hidden">
                <div class="form-group"><label>Total Downtime (Mins)</label><input type="number" id="downtime"></div>
                <div class="form-group"><label>Maintenance Reason</label><input type="text" id="maintReason"></div>
                <div class="form-group"><label>Technician Name</label><input type="text" id="techName"></div>
            </div>

            <!-- Quality Section -->
            <div id="qualitySection" class="section-box hidden">
                <div class="form-group"><label>Good Count</label><input type="number" id="goodParts"></div>
                <div class="form-group"><label>Scrap Count</label><input type="number" id="rejectParts"></div>
                <div class="form-group"><label>Reject Reason</label><input type="text" id="rejectReason"></div>
            </div>

            <button type="submit" id="submitBtn">Submit Data</button>
        </form>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyRkmh4_ofJjAftObCfnX9gmhqCa4xcsvSp143BXCUdQujfy4gaFkBMlEhsVrwa61HugQ/exec";
        
        let allRegisteredMachines = [];

        // Safe getter helper
        function getSafeVal(obj, possibleKeys) {
            let lowerKeys = possibleKeys.map(k => k.toLowerCase().replace(/\s/g, ''));
            for(let key in obj) {
                if(lowerKeys.includes(key.toLowerCase().replace(/\s/g, ''))) {
                    return obj[key];
                }
            }
            return "";
        }

        window.onload = function() {
            let now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('entryDateTime').value = now.toISOString().slice(0,16);

            // Fetch Registered Machines from Backend
            fetchRegisteredMachines();
        };

        function fetchRegisteredMachines() {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    allRegisteredMachines = data.machines || [];
                    document.getElementById('loadingStatus').style.display = 'none';
                    populateLineDropdown();

                    // Check if page opened via QR Code scan (URL contains ?asset=...)
                    const urlParams = new URLSearchParams(window.location.search);
                    const assetFromQR = urlParams.get('asset');
                    if(assetFromQR) {
                        autoSelectFromQR(assetFromQR);
                    }
                })
                .catch(err => {
                    document.getElementById('loadingStatus').innerText = "⚠️ Error loading machines list.";
                    document.getElementById('loadingStatus').style.color = "red";
                });
        }

        // 1. Populate Lines Dropdown
        function populateLineDropdown() {
            const lineSelect = document.getElementById("lineSelect");
            lineSelect.innerHTML = '<option value="">-- Choose Production Line --</option>';

            let uniqueLines = [...new Set(allRegisteredMachines.map(m => getSafeVal(m, ["LineName", "Line", "Department"])))].filter(Boolean);

            uniqueLines.forEach(line => {
                let opt = document.createElement("option");
                opt.value = line;
                opt.innerText = line;
                lineSelect.appendChild(opt);
            });
        }

        // 2. When Line is Selected -> Populate Machines
        function onLineChange() {
            const selectedLine = document.getElementById("lineSelect").value;
            const machSelect = document.getElementById("machineSelect");
            
            machSelect.innerHTML = '<option value="">-- Select Machine --</option>';
            document.getElementById("barcode").value = "";
            document.getElementById("target").value = "";
            document.getElementById("stdProd").value = "";

            if (!selectedLine) return;

            let lineMachines = allRegisteredMachines.filter(m => getSafeVal(m, ["LineName", "Line", "Department"]) === selectedLine);

            lineMachines.forEach((m, index) => {
                let name = getSafeVal(m, ["MachineName", "Machine"]);
                let op = getSafeVal(m, ["Operation", "Op", "OperationName"]);
                let asset = getSafeVal(m, ["AssetNumber", "Asset#", "Barcode"]);

                let opt = document.createElement("option");
                opt.value = asset; // Store Asset number in option value
                opt.innerText = `${name} | Op: ${op} (${asset})`;
                // Store machine object in dataset for fast access
                opt.dataset.ct = getSafeVal(m, ["IdealCT", "IdealCT(Min)", "Target"]);
                opt.dataset.std = getSafeVal(m, ["StdProduction", "StandardProduction", "TargetQty"]);
                
                machSelect.appendChild(opt);
            });
        }

        // 3. When Machine is Selected -> Auto-fill Barcode & CT
        function onMachineSelect() {
            const machSelect = document.getElementById("machineSelect");
            const selectedOpt = machSelect.options[machSelect.selectedIndex];

            if (selectedOpt && selectedOpt.value) {
                document.getElementById("barcode").value = selectedOpt.value; // Asset Number
                document.getElementById("target").value = selectedOpt.dataset.ct || 0; // Ideal CT
                document.getElementById("stdProd").value = selectedOpt.dataset.std || 0; // Std Production
                checkTarget();
            } else {
                document.getElementById("barcode").value = "";
                document.getElementById("target").value = "";
                document.getElementById("stdProd").value = "";
            }
        }

        // If Scanned via QR Code
        function autoSelectFromQR(asset) {
            let m = allRegisteredMachines.find(x => String(getSafeVal(x, ["AssetNumber", "Asset#", "Barcode"])) === String(asset));
            if (m) {
                let line = getSafeVal(m, ["LineName", "Line", "Department"]);
                document.getElementById("lineSelect").value = line;
                onLineChange();
                document.getElementById("machineSelect").value = asset;
                onMachineSelect();
            } else {
                document.getElementById("barcode").value = asset;
            }
        }

        function toggleSections() {
            const type = document.getElementById("entryType").value;
            document.getElementById("productionSection").classList.add("hidden");
            document.getElementById("maintenanceSection").classList.add("hidden");
            document.getElementById("qualitySection").classList.add("hidden");
            if(type === "Production") document.getElementById("productionSection").classList.remove("hidden");
            if(type === "Maintenance") document.getElementById("maintenanceSection").classList.remove("hidden");
            if(type === "Quality") document.getElementById("qualitySection").classList.remove("hidden");
        }

        document.getElementById("actual").addEventListener("input", checkTarget);

        function checkTarget() {
            let actual = parseFloat(document.getElementById("actual").value) || 0;
            let stdProd = parseFloat(document.getElementById("stdProd").value) || 0;
            
            if(actual > 0 && actual < stdProd) {
                document.getElementById("lossReasonDiv").classList.remove("hidden");
            } else {
                document.getElementById("lossReasonDiv").classList.add("hidden");
            }
        }

        document.getElementById("oeeForm").addEventListener("submit", function(e) {
            e.preventDefault(); 
            const btn = document.getElementById("submitBtn");
            btn.innerText = "Submitting..."; btn.disabled = true;
            
            const data = {
                formType: "dataEntry",
                manualDateTime: document.getElementById("entryDateTime").value,
                barcode: document.getElementById("barcode").value,
                operatorName: document.getElementById("operatorName").value,
                shift: document.getElementById("shift").value,
                entryType: document.getElementById("entryType").value,
                shiftTime: document.getElementById("shiftTime").value,
                target: document.getElementById("target").value, 
                actual: document.getElementById("actual").value,
                lossReason: document.getElementById("lossReason").value,
                maintReason: document.getElementById("maintReason").value,
                downtime: document.getElementById("downtime").value,
                techName: document.getElementById("techName").value,
                goodParts: document.getElementById("goodParts").value,
                rejectParts: document.getElementById("rejectParts").value,
                rejectReason: document.getElementById("rejectReason").value,
                lineName: document.getElementById("lineSelect").value
            };

            fetch(API_URL, {
                method: "POST", body: JSON.stringify(data)
            })
            .then(res => res.json()) 
            .then(res => {
                alert("Data Saved Successfully!");
                document.getElementById("oeeForm").reset(); 
                
                let now = new Date();
                now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                document.getElementById('entryDateTime').value = now.toISOString().slice(0,16);

                toggleSections();
                btn.innerText = "Submit Data"; btn.disabled = false;
            })
            .catch(err => { alert("Error saving data"); btn.innerText = "Submit Data"; btn.disabled = false; });
        });
    </script>
</body>
</html>
