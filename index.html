<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OEE Data Entry</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; padding: 20px; margin: 0; }
        .container { max-width: 450px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #34495e; font-size: 14px; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        input[readonly] { background-color: #f8f9fa; cursor: not-allowed; }
        .hidden { display: none; }
        .section-box { background: #f8f9fa; padding: 15px; border-radius: 6px; border: 1px solid #dee2e6; margin-bottom: 15px; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer;}
        button:hover { background: #219150; }
    </style>
</head>
<body>
    <div class="container">
        <h2>OEE Data Entry Form</h2>
        <form id="oeeForm">
            <div class="form-group"><label>Date & Time</label><input type="datetime-local" id="entryDateTime" required></div>
            <div class="form-group"><label>Barcode # (Asset Number)</label><input type="text" id="barcode" required placeholder="Enter Barcode / Scan QR"></div>
            <div class="form-group"><label>Operator Name</label><input type="text" id="operatorName" required></div>
            <div class="form-group">
                <label>Shift</label>
                <select id="shift" required>
                    <option value="">Select Shift</option><option value="Morning">Morning</option><option value="Evening">Evening</option><option value="Night">Night</option>
                </select>
            </div>
            <div class="form-group">
                <label>Entry Type</label>
                <select id="entryType" required onchange="toggleSections()">
                    <option value="">Select Type...</option><option value="Production">Production</option><option value="Maintenance">Maintenance</option><option value="Quality">Quality</option>
                </select>
            </div>

            <div id="productionSection" class="section-box hidden">
                <div class="form-group"><label>Planned Time (Mins)</label><input type="number" id="shiftTime"></div>
                <div class="form-group"><label>Ideal CT (Min/part)</label><input type="number" step="0.01" id="target"></div>
                <div class="form-group"><label>Total Count</label><input type="number" id="actual"></div>
                <div class="form-group hidden" id="lossReasonDiv"><label style="color:#e74c3c;">Performance Loss Reason</label><input type="text" id="lossReason"></div>
            </div>

            <div id="maintenanceSection" class="section-box hidden">
                <div class="form-group"><label>Total Downtime (Mins)</label><input type="number" id="downtime"></div>
                <div class="form-group"><label>Maintenance Reason</label><input type="text" id="maintReason"></div>
                <div class="form-group"><label>Technician Name</label><input type="text" id="techName"></div>
            </div>

            <div id="qualitySection" class="section-box hidden">
                <div class="form-group"><label>Good Count</label><input type="number" id="goodParts"></div>
                <div class="form-group"><label>Scrap Count</label><input type="number" id="rejectParts"></div>
                <div class="form-group"><label>Reject Reason</label><input type="text" id="rejectReason"></div>
            </div>

            <button type="submit" id="submitBtn">Submit Data</button>
        </form>
    </div>

    <script>
        window.onload = function() {
            let now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('entryDateTime').value = now.toISOString().slice(0,16);

            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('asset')) {
                document.getElementById('barcode').value = urlParams.get('asset');
                document.getElementById('barcode').readOnly = true; 
            }
        };

        function toggleSections() {
            const type = document.getElementById("entryType").value;
            document.getElementById("productionSection").classList.add("hidden");
            document.getElementById("maintenanceSection").classList.add("hidden");
            document.getElementById("qualitySection").classList.add("hidden");
            if(type === "Production") document.getElementById("productionSection").classList.remove("hidden");
            if(type === "Maintenance") document.getElementById("maintenanceSection").classList.remove("hidden");
            if(type === "Quality") document.getElementById("qualitySection").classList.remove("hidden");
        }

        document.getElementById("actual").addEventListener("input", checkTarget);
        document.getElementById("target").addEventListener("input", checkTarget);
        document.getElementById("shiftTime").addEventListener("input", checkTarget);

        function checkTarget() {
            let pTime = parseFloat(document.getElementById("shiftTime").value)||0;
            let iCT = parseFloat(document.getElementById("target").value)||0;
            let count = parseFloat(document.getElementById("actual").value)||0;
            if(pTime>0 && iCT>0 && count>0 && ((iCT*count) < pTime)) {
                document.getElementById("lossReasonDiv").classList.remove("hidden");
            } else {
                document.getElementById("lossReasonDiv").classList.add("hidden");
            }
        }

        document.getElementById("oeeForm").addEventListener("submit", function(e) {
            e.preventDefault(); 
            const btn = document.getElementById("submitBtn");
            btn.innerText = "Submitting..."; btn.disabled = true;
            
            const data = {
                formType: "dataEntry",
                manualDateTime: document.getElementById("entryDateTime").value,
                barcode: document.getElementById("barcode").value,
                operatorName: document.getElementById("operatorName").value,
                shift: document.getElementById("shift").value,
                entryType: document.getElementById("entryType").value,
                shiftTime: document.getElementById("shiftTime").value,
                target: document.getElementById("target").value,
                actual: document.getElementById("actual").value,
                lossReason: document.getElementById("lossReason").value,
                maintReason: document.getElementById("maintReason").value,
                downtime: document.getElementById("downtime").value,
                techName: document.getElementById("techName").value,
                goodParts: document.getElementById("goodParts").value,
                rejectParts: document.getElementById("rejectParts").value,
                rejectReason: document.getElementById("rejectReason").value
            };

            fetch("https://script.google.com/macros/s/AKfycbyRkmh4_ofJjAftObCfnX9gmhqCa4xcsvSp143BXCUdQujfy4gaFkBMlEhsVrwa61HugQ/exec", {
                method: "POST", body: JSON.stringify(data)
            })
            .then(res => res.json()) 
            .then(res => {
                alert("Data Saved!");
                let savedBc = document.getElementById("barcode").value;
                document.getElementById("oeeForm").reset(); 
                document.getElementById("barcode").value = savedBc;
                toggleSections();
                btn.innerText = "Submit Data"; btn.disabled = false;
            })
            .catch(err => { alert("Error saving data"); btn.innerText = "Submit Data"; btn.disabled = false; });
        });
    </script>
</body>
</html>
