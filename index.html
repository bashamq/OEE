<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OEE Data Entry Wizard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; padding: 15px; margin: 0; }
        .container { max-width: 450px; margin: 0 auto; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 15px; font-size: 22px; }
        .step-indicator { display: flex; justify-content: space-between; margin-bottom: 20px; padding: 0 10px; }
        .step-dot { width: 25px; height: 25px; border-radius: 50%; background-color: #bdc3c7; color: white; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; position: relative; z-index: 2; transition: 0.3s; }
        .step-dot.active { background-color: #3498db; transform: scale(1.1); box-shadow: 0 0 8px rgba(52,152,219,0.5); }
        .step-dot.completed { background-color: #27ae60; }
        .step-line { flex: 1; height: 3px; background-color: #bdc3c7; margin-top: 11px; z-index: 1; margin-left: -5px; margin-right: -5px; transition: 0.3s; }
        .step-line.completed { background-color: #27ae60; }
        .step-labels { display: flex; justify-content: space-between; font-size: 11px; color: #7f8c8d; font-weight: 600; margin-top: -15px; margin-bottom: 20px; padding: 0 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #34495e; font-size: 14px; }
        input, select { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; transition: 0.3s; }
        input[readonly], select:disabled, input:disabled { background-color: #e8f8f5; border-color: #1abc9c; color: #16a085; font-weight: bold; cursor: not-allowed; }
        .step-content { display: none; animation: fadeIn 0.4s; }
        .step-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .info-box { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6; margin-bottom: 15px; }
        .completed-box { background-color: #d5f5e3; border-color: #2ecc71; }
        .status-badge { float: right; font-size: 11px; background: #e74c3c; color: white; padding: 3px 8px; border-radius: 12px; }
        .completed-box .status-badge { background: #27ae60; }
        .nav-buttons { display: flex; justify-content: space-between; gap: 10px; margin-top: 25px; }
        button { flex: 1; padding: 14px; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-prev { background: #95a5a6; } .btn-next { background: #3498db; } .btn-submit { background: #27ae60; }
        .hidden { display: none !important; }
        .loading-text { font-size: 13px; font-weight: bold; margin-bottom: 15px; text-align: center; color: #f39c12; }
        .downtime-row { display: flex; gap: 10px; }
        .downtime-row .form-group { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h2>OEE Data Entry</h2>
        
        <div class="step-indicator">
            <div class="step-dot active" id="dot1">1</div><div class="step-line" id="line1"></div>
            <div class="step-dot" id="dot2">2</div><div class="step-line" id="line2"></div>
            <div class="step-dot" id="dot3">3</div><div class="step-line" id="line3"></div>
            <div class="step-dot" id="dot4">4</div>
        </div>
        <div class="step-labels"><span>Setup</span><span>Avail</span><span>Perf</span><span>Qual</span></div>

        <div id="loadingStatus" class="loading-text">Loading registered machines & logs...</div>

        <form id="oeeForm">
            <!-- ================= STEP 1: SETUP ================= -->
            <div class="step-content active" id="step1">
                <div class="info-box">
                    <div class="form-group"><label>Date & Time</label><input type="datetime-local" id="entryDateTime" required onchange="checkBackendDataForToday()"></div>
                    
                    <div class="form-group"><label style="color: #2980b9;">Select Department</label><select id="deptSelect" onchange="onDeptChange()"><option value="">-- Choose Dept --</option></select></div>
                    <div class="form-group"><label style="color: #2980b9;">Select Line</label><select id="lineSelect" onchange="onLineChange()"><option value="">-- Select Line --</option></select></div>
                    <div class="form-group"><label style="color: #2980b9;">Select Asset (Machine)</label><select id="machineSelect" onchange="onMachineSelect()"><option value="">-- Select Machine --</option></select></div>
                    
                    <div class="form-group"><label>Barcode # (Asset Number)</label><input type="text" id="barcode" placeholder="Auto-filled" readonly></div>
                    
                    <div class="form-group"><label style="color: #8e44ad;">Select Product to Run</label><select id="productSelect" onchange="onProductSelect()" required><option value="">-- Select Product --</option></select></div>
                </div>
                <div class="form-group"><label>Operator Name</label><input type="text" id="operatorName" required></div>
                <div class="form-group"><label>Shift</label><select id="shift" required onchange="checkBackendDataForToday()"><option value="">Select Shift</option><option value="Morning">Morning</option><option value="Evening">Evening</option><option value="Night">Night</option></select></div>
            </div>

            <!-- ================= STEP 2: AVAILABILITY ================= -->
            <div class="step-content" id="step2">
                <div class="info-box" id="boxStep2">
                    <span id="availStatus" class="status-badge">Pending</span>
                    <h3 style="margin-top:0; color:#2c3e50;">Availability</h3>
                    <p style="font-size:12px; color:#e74c3c; font-weight:bold;">* Required first. Enter 0 if no time lost.</p>
                    
                    <div class="form-group"><label>Planned Time (Mins)</label><input type="number" id="availPlannedTime" value="480" readonly></div>
                    
                    <div class="downtime-row">
                        <div class="form-group"><label>Setup / Changeover</label><input type="number" id="setupTime" placeholder="e.g. 15" oninput="calcAvail()"></div>
                        <div class="form-group"><label>Maintenance Time</label><input type="number" id="maintTime" placeholder="e.g. 20" oninput="calcAvail()"></div>
                    </div>

                    <div class="form-group"><label>Total Downtime (Mins)</label><input type="number" id="downtime" placeholder="0" readonly></div>
                    <div class="form-group"><label style="color:#2980b9;">Run Time (Mins)</label><input type="number" id="availRunTime" value="480" readonly></div>
                    
                    <div id="maintReasonDiv" class="hidden">
                        <hr style="border: 0; border-top: 1px solid #ccc; margin: 15px 0;">
                        <div class="form-group">
                            <label style="color:#e74c3c;">Maintenance Reason (Required)</label>
                            <select id="maintReasonSelect" onchange="handleOther('maintReason')"><option value="">-- Select Reason --</option></select>
                            <input type="text" id="maintReasonOther" class="hidden" placeholder="Type specific reason here..." style="margin-top:8px;">
                        </div>
                        <div class="form-group"><label>Technician Name</label><input type="text" id="techName" placeholder="Who repaired it?"></div>
                    </div>
                </div>
            </div>

            <!-- ================= STEP 3: PERFORMANCE ================= -->
            <div class="step-content" id="step3">
                <div class="info-box" id="boxStep3">
                    <span id="perfStatus" class="status-badge">Pending</span>
                    <h3 style="margin-top:0; color:#2c3e50;">Performance</h3>
                    <div class="form-group"><label id="lblShiftTime">Available Time (Mins)</label><input type="number" id="shiftTime" value="480" readonly></div>
                    <div class="form-group"><label>Ideal CT (Min/part)</label><input type="number" step="0.01" id="target" readonly></div>
                    <div class="form-group"><label>Standard Production (Shift Target)</label><input type="number" id="stdProd" readonly></div>
                    <hr style="border: 0; border-top: 1px solid #ccc; margin: 15px 0;">
                    <div class="form-group"><label style="color:#2980b9;">Total Count (Parts Produced)</label><input type="number" id="actual" placeholder="Enter total parts today" disabled oninput="updateInterlocks()"></div>
                    <div class="form-group hidden" id="lossReasonDiv">
                        <label style="color:#e74c3c;">Performance Loss Reason</label>
                        <select id="lossReasonSelect" onchange="handleOther('lossReason')" disabled><option value="">-- Select Reason --</option><option value="Other">Other (Type manually)</option></select>
                        <input type="text" id="lossReasonOther" class="hidden" placeholder="Type specific reason here..." style="margin-top:8px;">
                    </div>
                </div>
            </div>

            <!-- ================= STEP 4: QUALITY ================= -->
            <div class="step-content" id="step4">
                <div class="info-box" id="boxStep4">
                    <span id="qualStatus" class="status-badge">Pending</span>
                    <h3 style="margin-top:0; color:#2c3e50;">Quality</h3>
                    <p id="qualProdTarget" style="font-size:12px; color:#16a085; font-weight:bold; margin-top:0;"></p>
                    <div class="form-group"><label>Good Count</label><input type="number" id="goodParts" placeholder="Enter good parts" disabled oninput="calculateScrap()"></div>
                    <div class="form-group"><label>Scrap Count (Auto calculated)</label><input type="number" id="rejectParts" readonly placeholder="0"></div>
                    <div class="form-group" id="rejectReasonDiv">
                        <label>Reject Reason</label>
                        <select id="rejectReasonSelect" onchange="handleOther('rejectReason')" disabled><option value="">-- Select Reason --</option><option value="Other">Other (Type manually)</option></select>
                        <input type="text" id="rejectReasonOther" class="hidden" placeholder="Type specific reason here..." style="margin-top:8px;">
                    </div>
                </div>
            </div>

            <div class="nav-buttons">
                <button type="button" id="btnPrev" class="btn-prev hidden" onclick="goPrev()">Back</button>
                <button type="button" id="btnNext" class="btn-next" onclick="goNext()">Next</button>
                <button type="button" id="btnSubmit" class="btn-submit hidden" onclick="submitData()">Submit Data</button>
            </div>
        </form>
    </div>

    <script>
        // 🔴 YAHAN APNA NAYA WEB APP URL LAAZMI DAALEIN! 🔴
        const API_URL = "https://script.google.com/macros/s/AKfycbyRkmh4_ofJjAftObCfnX9gmhqCa4xcsvSp143BXCUdQujfy4gaFkBMlEhsVrwa61HugQ/exec";
        
        let allRegisteredMachines = []; let allLogs = [];
        let state = { availSaved: false, perfSaved: false, qualSaved: false };
        let currentStep = 1; let currentTotalProduced = 0;

        function getSafeVal(obj, possibleKeys) {
            let lowerKeys = possibleKeys.map(k => k.toLowerCase().replace(/\s/g, ''));
            for(let key in obj) { if(lowerKeys.includes(key.toLowerCase().replace(/\s/g, ''))) return obj[key]; }
            return "";
        }

        window.onload = function() {
            let now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('entryDateTime').value = now.toISOString().slice(0,16);
            fetchData();
        };

        function fetchData(isSilent = false) {
            let cachedM = localStorage.getItem("mes_machines"); let cachedL = localStorage.getItem("mes_logs");
            if (!isSilent && cachedM && cachedL) {
                allRegisteredMachines = JSON.parse(cachedM); allLogs = JSON.parse(cachedL);
                document.getElementById('loadingStatus').style.display = 'none';
                populateDeptDropdown(); processQRScan();
            }

            fetch(API_URL).then(res => res.json()).then(data => {
                allRegisteredMachines = data.machines || []; allLogs = data.logs || [];
                localStorage.setItem("mes_machines", JSON.stringify(allRegisteredMachines)); 
                localStorage.setItem("mes_logs", JSON.stringify(allLogs)); 
                if (!isSilent && !cachedM) {
                    document.getElementById('loadingStatus').style.display = 'none';
                    populateDeptDropdown(); processQRScan();
                }
                if (isSilent) checkBackendDataForToday();
            }).catch(e => {
                if(!isSilent && !cachedM) document.getElementById('loadingStatus').innerText = "⚠️ Error loading data. Please check API URL."; 
            });
        }

        function processQRScan() {
            const assetFromQR = new URLSearchParams(window.location.search).get('asset');
            if(assetFromQR) {
                let m = allRegisteredMachines.find(x => String(getSafeVal(x, ["AssetNumber", "Asset#", "Barcode"])).trim() === String(assetFromQR).trim());
                if (m) {
                    document.getElementById("deptSelect").value = getSafeVal(m, ["Department", "Dept"]);
                    onDeptChange();
                    document.getElementById("lineSelect").value = getSafeVal(m, ["LineName", "Line"]);
                    onLineChange();
                    document.getElementById("machineSelect").value = assetFromQR;
                    onMachineSelect();
                }
            }
        }

        function populateDeptDropdown() {
            const select = document.getElementById("deptSelect");
            let depts = [...new Set(allRegisteredMachines.map(m => getSafeVal(m, ["Department", "Dept"])))].filter(Boolean);
            depts.forEach(d => select.innerHTML += `<option value="${d}">${d}</option>`);
        }

        function onDeptChange() {
            const dept = document.getElementById("deptSelect").value;
            const lineSel = document.getElementById("lineSelect");
            lineSel.innerHTML = '<option value="">-- Select Line --</option>';
            document.getElementById("machineSelect").innerHTML = '<option value="">-- Select Machine --</option>';
            document.getElementById("productSelect").innerHTML = '<option value="">-- Select Product --</option>';
            if(!dept) return;
            let lines = [...new Set(allRegisteredMachines.filter(m => getSafeVal(m, ["Department", "Dept"]) === dept).map(m => getSafeVal(m, ["LineName", "Line"])))].filter(Boolean);
            lines.forEach(l => lineSel.innerHTML += `<option value="${l}">${l}</option>`);
        }

        function onLineChange() {
            const line = document.getElementById("lineSelect").value;
            const machSel = document.getElementById("machineSelect");
            machSel.innerHTML = '<option value="">-- Select Asset --</option>';
            document.getElementById("productSelect").innerHTML = '<option value="">-- Select Product --</option>';
            if (!line) return;
            
            let lineMachines = allRegisteredMachines.filter(m => getSafeVal(m, ["LineName", "Line"]) === line);
            let uniqueAssets = new Set();
            lineMachines.filter(m => getSafeVal(m, ["AssetNumber"]) !== "").forEach((m) => {
                let name = getSafeVal(m, ["MachineName", "Machine"]);
                let asset = getSafeVal(m, ["AssetNumber", "Barcode"]);
                if(!uniqueAssets.has(asset)) {
                    uniqueAssets.add(asset);
                    machSel.innerHTML += `<option value="${asset}">${name} (${asset})</option>`;
                }
            });
        }

        function onMachineSelect() {
            const asset = document.getElementById("machineSelect").value;
            const prodSel = document.getElementById("productSelect");
            prodSel.innerHTML = '<option value="">-- Select Product --</option>';
            document.getElementById("barcode").value = asset;
            if (!asset) return;

            let machineData = allRegisteredMachines.filter(m => String(getSafeVal(m, ["AssetNumber", "Barcode"])) === asset);
            let lineMachines = allRegisteredMachines.filter(m => getSafeVal(m, ["LineName", "Line"]) === document.getElementById("lineSelect").value);
            
            let am=[], ap=[], aq=[];
            lineMachines.forEach(m => {
                let mr=getSafeVal(m, ["MaintReasons"]); if(mr) am.push(...mr.split(',').map(s=>s.trim()));
                let pr=getSafeVal(m, ["ProdReasons"]); if(pr) ap.push(...pr.split(',').map(s=>s.trim()));
                let qr=getSafeVal(m, ["QualReasons"]); if(qr) aq.push(...qr.split(',').map(s=>s.trim()));
            });
            populateDropdownList('maintReasonSelect', [...new Set(am)].filter(Boolean).join(','), "Select Reason");
            populateDropdownList('lossReasonSelect', [...new Set(ap)].filter(Boolean).join(','), "Select Reason");
            populateDropdownList('rejectReasonSelect', [...new Set(aq)].filter(Boolean).join(','), "Select Reason");

            machineData.forEach(m => {
                let pName = getSafeVal(m, ["ProductName", "Product"]);
                if(pName) {
                    let opt = document.createElement("option");
                    opt.value = pName; opt.innerText = pName;
                    opt.dataset.ct = getSafeVal(m, ["IdealCT", "Target"]);
                    opt.dataset.std = getSafeVal(m, ["StdProduction", "TargetQty"]);
                    prodSel.appendChild(opt);
                }
            });
            checkBackendDataForToday(); 
        }

        function onProductSelect() {
            const prodSel = document.getElementById("productSelect");
            const opt = prodSel.options[prodSel.selectedIndex];
            if(opt && opt.value) {
                document.getElementById("target").value = opt.dataset.ct || 0; 
                document.getElementById("stdProd").value = opt.dataset.std || 0; 
                updateInterlocks();
            }
        }

        function populateDropdownList(id, commaStr, defaultText) {
            const sel = document.getElementById(id);
            sel.innerHTML = `<option value="">-- ${defaultText} --</option>`;
            if (id === 'maintReasonSelect') sel.innerHTML = `<option value="No Issue">No Issue</option>`; 
            if (commaStr) commaStr.split(',').forEach(r => { if (r.trim()) sel.innerHTML += `<option value="${r.trim()}">${r.trim()}</option>`; });
            sel.innerHTML += `<option value="Other">Other (Type manually)</option>`;
        }

        function handleOther(type) {
            let val = document.getElementById(type + "Select").value;
            let oth = document.getElementById(type + "Other");
            if (val === "Other") oth.classList.remove("hidden");
            else { oth.classList.add("hidden"); oth.value = ""; }
        }

        function setReasonDropdown(selectId, otherInputId, savedValue, isCompleted) {
            let selectElem = document.getElementById(selectId);
            let otherInput = document.getElementById(otherInputId);
            if (!savedValue) {
                if(selectId === 'maintReasonSelect') selectElem.value = "No Issue";
                otherInput.classList.add("hidden"); return;
            }
            if (Array.from(selectElem.options).some(opt => opt.value === savedValue)) {
                selectElem.value = savedValue; otherInput.classList.add("hidden");
            } else {
                selectElem.value = "Other"; otherInput.value = savedValue; otherInput.classList.remove("hidden");
            }
            if (isCompleted) otherInput.disabled = true;
        }

        function updateUI() {
            for(let i=1; i<=4; i++) {
                document.getElementById('step'+i).classList.remove('active');
                if(i <= currentStep) document.getElementById('dot'+i).classList.add('active'); else document.getElementById('dot'+i).classList.remove('active');
                if(i < currentStep) document.getElementById('line'+i).classList.add('completed'); else if(document.getElementById('line'+i)) document.getElementById('line'+i).classList.remove('completed');
            }
            document.getElementById('step'+currentStep).classList.add('active');
            document.getElementById('btnPrev').classList.toggle('hidden', currentStep === 1);
            if(currentStep === 4) { document.getElementById('btnNext').classList.add('hidden'); document.getElementById('btnSubmit').classList.remove('hidden'); } 
            else { document.getElementById('btnNext').classList.remove('hidden'); document.getElementById('btnSubmit').classList.toggle('hidden', currentStep === 1); }
        }

        function goNext() {
            if(currentStep === 1) {
                if(!document.getElementById('barcode').value || !document.getElementById('productSelect').value || !document.getElementById('shift').value) {
                    alert("⚠️ Please fill all fields to continue."); return;
                }
                checkBackendDataForToday(); 
            }
            else if(currentStep === 2) {
                if(!state.availSaved) {
                    let sVal = document.getElementById('setupTime').value;
                    let mVal = document.getElementById('maintTime').value;
                    if(sVal === "" && mVal === "") { alert("⚠️ Enter Setup or Maintenance Time (Enter 0 if ran fine)."); return; }
                    if((parseFloat(mVal) || 0) > 0 && getFinalReason('maintReason') === "") { alert("⚠️ Please select a Maintenance Reason."); return; }
                }
                updateInterlocks(); 
            }
            else if(currentStep === 3) {
                if(!state.perfSaved) {
                    if(document.getElementById('actual').value === "") { alert("⚠️ Please enter Total Count."); return; }
                    if(parseFloat(document.getElementById('actual').value) < parseFloat(document.getElementById('stdProd').value) && getFinalReason('lossReason').trim() === "") { alert("⚠️ Target missed! Enter Performance Loss Reason."); return; }
                }
                updateInterlocks(); 
            }
            if(currentStep < 4) { currentStep++; updateUI(); }
        }
        function goPrev() { if(currentStep > 1) { currentStep--; updateUI(); } }

        function checkBackendDataForToday() {
            const shift = document.getElementById("shift").value;
            const barcode = document.getElementById("barcode").value;
            const product = document.getElementById("productSelect").value;
            if(!shift || !barcode || !product) return;

            let selectedDateStr = new Date(document.getElementById("entryDateTime").value).toDateString();
            let reversedLogs = allLogs.filter(log => {
                let rawDate = getSafeVal(log, ["Timestamp", "Date"]); if(!rawDate) return false;
                return new Date(rawDate).toDateString() === selectedDateStr &&
                       String(getSafeVal(log, ["Barcode#", "Barcode", "AssetNumber"])).trim() === barcode.trim() &&
                       String(getSafeVal(log, ["Shift"])).trim().toLowerCase() === shift.trim().toLowerCase() &&
                       String(getSafeVal(log, ["ProductName", "Product"])).trim() === product.trim();
            }).slice().reverse();

            state = { availSaved: false, perfSaved: false, qualSaved: false };
            ["setupTime", "maintTime", "downtime", "maintReasonOther", "techName", "actual", "lossReasonOther", "goodParts", "rejectParts", "rejectReasonOther"].forEach(id => { document.getElementById(id).value = ""; document.getElementById(id).disabled = false; });
            ["maintReasonSelect", "lossReasonSelect", "rejectReasonSelect"].forEach(id => document.getElementById(id).disabled = false);
            
            let aLog = reversedLogs.find(l => {
                let t = String(getSafeVal(l, ["EntryType", "Type"])).trim().toLowerCase();
                return t === "availability" || t === "maintenance";
            });
            if(aLog) {
                state.availSaved = true; 
                document.getElementById('setupTime').value = getSafeVal(aLog, ["SetupTime"]) || 0;
                document.getElementById('maintTime').value = getSafeVal(aLog, ["MaintTime"]) || 0;
                document.getElementById('downtime').value = getSafeVal(aLog, ["Downtime(Min)", "Downtime"]) || 0;
                document.getElementById('techName').value = getSafeVal(aLog, ["TechName"]); 
                
                let mReason = getSafeVal(aLog, ["MaintReason", "Maint.Reason"]);
                if((parseFloat(document.getElementById('maintTime').value) || 0) > 0 || mReason) {
                    document.getElementById("maintReasonDiv").classList.remove("hidden");
                    setReasonDropdown("maintReasonSelect", "maintReasonOther", mReason, true);
                } else { document.getElementById("maintReasonDiv").classList.add("hidden"); }

                document.getElementById("boxStep2").classList.add("completed-box"); document.getElementById("availStatus").innerText = "Completed";
                ["setupTime", "maintTime", "maintReasonSelect", "techName", "maintReasonOther"].forEach(id => document.getElementById(id).disabled = true);
            } else { 
                document.getElementById("boxStep2").classList.remove("completed-box"); document.getElementById("availStatus").innerText = "Pending"; 
                document.getElementById("maintReasonDiv").classList.add("hidden");
            }

            let pLog = reversedLogs.find(l => {
                let t = String(getSafeVal(l, ["EntryType", "Type"])).trim().toLowerCase();
                return t === "performance" || t === "production";
            });
            if(pLog) {
                state.perfSaved = true; document.getElementById('actual').value = getSafeVal(pLog, ["TotalCount", "Actual", "TotalProduced"]);
                setReasonDropdown("lossReasonSelect", "lossReasonOther", getSafeVal(pLog, ["LossReason"]), true);
                document.getElementById("boxStep3").classList.add("completed-box"); document.getElementById("perfStatus").innerText = "Completed";
                ["actual", "lossReasonSelect", "lossReasonOther"].forEach(id => document.getElementById(id).disabled = true);
            } else { document.getElementById("boxStep3").classList.remove("completed-box"); document.getElementById("perfStatus").innerText = "Pending"; }

            let qLog = reversedLogs.find(l => String(getSafeVal(l, ["EntryType", "Type"])).trim().toLowerCase() === "quality");
            if(qLog) {
                state.qualSaved = true; document.getElementById('goodParts').value = getSafeVal(qLog, ["GoodCount", "GoodParts"]);
                document.getElementById('rejectParts').value = getSafeVal(qLog, ["ScrapCount", "RejectParts"]); setReasonDropdown("rejectReasonSelect", "rejectReasonOther", getSafeVal(qLog, ["RejectReason"]), true);
                document.getElementById("boxStep4").classList.add("completed-box"); document.getElementById("qualStatus").innerText = "Completed";
                ["goodParts", "rejectReasonSelect", "rejectReasonOther"].forEach(id => document.getElementById(id).disabled = true);
            } else { document.getElementById("boxStep4").classList.remove("completed-box"); document.getElementById("qualStatus").innerText = "Pending"; }
            updateInterlocks();
        }

        function calcAvail() {
            let setup = parseFloat(document.getElementById("setupTime").value) || 0;
            let maint = parseFloat(document.getElementById("maintTime").value) || 0;
            let total = setup + maint;
            
            document.getElementById("downtime").value = total;
            document.getElementById("availRunTime").value = Math.max(0, 480 - total);
            
            if (maint > 0) document.getElementById("maintReasonDiv").classList.remove("hidden");
            else {
                document.getElementById("maintReasonDiv").classList.add("hidden");
                document.getElementById("maintReasonSelect").value = "";
                document.getElementById("maintReasonOther").value = "";
            }
            updateInterlocks();
        }

        document.getElementById("actual").addEventListener("input", updateInterlocks);
        document.getElementById("goodParts").addEventListener("input", function() {
            let good = parseInt(this.value) || 0;
            if (good > currentTotalProduced) { alert(`⚠️ Max allowed: ${currentTotalProduced}`); this.value = currentTotalProduced; good = currentTotalProduced; }
            document.getElementById("rejectParts").value = currentTotalProduced - good;
        });

        function updateInterlocks() {
            let downtimeVal = document.getElementById("downtime").value;
            let downtime = downtimeVal === "" ? 0 : parseFloat(downtimeVal);
            
            if (downtimeVal !== "" || state.availSaved || document.getElementById("setupTime").value !== "" || document.getElementById("maintTime").value !== "") {
                let avail = 480 - downtime; document.getElementById("shiftTime").value = avail;
                document.getElementById("lblShiftTime").innerHTML = downtime > 0 ? `Available Time (Mins) <span style="color:#e74c3c; font-size:12px;">(-${downtime}m Downtime)</span>` : `Available Time (Mins)`;
                let idealCT = parseFloat(document.getElementById("target").value) || 0;
                if (idealCT > 0) document.getElementById("stdProd").value = Math.floor(avail / idealCT);
                if (!state.perfSaved) { document.getElementById("actual").disabled = false; document.getElementById("lossReasonSelect").disabled = false; }
            } else { ["actual", "lossReasonSelect"].forEach(id => document.getElementById(id).disabled = true); }

            let actual = parseFloat(document.getElementById("actual").value) || 0;
            document.getElementById("lossReasonDiv").classList.toggle("hidden", !(actual > 0 && actual < (parseFloat(document.getElementById("stdProd").value) || 0)));

            if (document.getElementById("actual").value !== "" || state.perfSaved) {
                currentTotalProduced = actual; document.getElementById("qualProdTarget").innerText = `Total Parts Produced: ${actual}`; document.getElementById("goodParts").placeholder = `Max allowed: ${actual}`;
                if (!state.qualSaved) { document.getElementById("goodParts").disabled = false; document.getElementById("rejectReasonSelect").disabled = false; }
            } else { ["goodParts", "rejectReasonSelect"].forEach(id => document.getElementById(id).disabled = true); }
        }

        function getFinalReason(id) { let val = document.getElementById(id + "Select").value; return val === "Other" ? document.getElementById(id + "Other").value : val; }

        function submitData() {
            if(currentStep === 2 && !state.availSaved && document.getElementById('setupTime').value === "" && document.getElementById('maintTime').value === "") { alert("⚠️ Enter Setup or Maintenance Time."); return; }
            if(currentStep === 3 && !state.perfSaved && document.getElementById('actual').value === "") { alert("⚠️ Enter Total Count."); return; }
            if(currentStep === 4 && !state.qualSaved && document.getElementById('goodParts').value === "") { alert("⚠️ Enter Good Count."); return; }

            const btn = document.getElementById("btnSubmit"); btn.innerText = "Saving..."; btn.disabled = true;
            let payloads = [];
            let commonData = {
                manualDateTime: document.getElementById("entryDateTime").value, department: document.getElementById("deptSelect").value, lineName: document.getElementById("lineSelect").value,
                productName: document.getElementById("productSelect").value, barcode: document.getElementById("barcode").value, operatorName: document.getElementById("operatorName").value,
                shift: document.getElementById("shift").value, shiftTime: document.getElementById("availPlannedTime").value, target: document.getElementById("target").value
            };

            if(!state.availSaved && (document.getElementById("setupTime").value !== "" || document.getElementById("maintTime").value !== "")) {
                payloads.push({ 
                    entryType: "Availability", 
                    setupTime: document.getElementById("setupTime").value,
                    maintTime: document.getElementById("maintTime").value,
                    downtime: document.getElementById("downtime").value, 
                    maintReason: getFinalReason("maintReason"), 
                    techName: document.getElementById("techName").value, 
                    ...commonData 
                });
            }
            if(!state.perfSaved && document.getElementById("actual").value !== "") {
                payloads.push({ entryType: "Performance", actual: document.getElementById("actual").value, lossReason: getFinalReason("lossReason"), ...commonData });
            }
            if(!state.qualSaved && document.getElementById("goodParts").value !== "") {
                payloads.push({ entryType: "Quality", goodParts: document.getElementById("goodParts").value, rejectParts: document.getElementById("rejectParts").value, rejectReason: getFinalReason("rejectReason"), ...commonData });
            }

            if(payloads.length === 0) { alert("All steps are saved."); btn.innerText = "Submit Data"; btn.disabled = false; return; }

            // 🔴 ADVANCED ERROR HANDLING LOGIC ADDED HERE 🔴
            (async () => {
                try { 
                    for (let p of payloads) {
                        let response = await fetch(API_URL, { 
                            method: "POST", 
                            headers: { "Content-Type": "text/plain;charset=utf-8" },
                            body: JSON.stringify(p) 
                        });
                        let result = await response.json();
                        if (result.status === "error") throw new Error(result.message);
                    }
                    alert("Data Saved Successfully!"); 
                    document.getElementById("oeeForm").reset();
                    let now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
                    document.getElementById('entryDateTime').value = now.toISOString().slice(0,16);
                    currentStep = 1; updateUI(); btn.innerText = "Submit Data"; btn.disabled = false; fetchData(true);
                } catch(e) { 
                    alert("⚠️ Error saving data!\nDetails: " + e.message + "\n\n(Kya aap ne Naya API_URL theek dala hai?)"); 
                    btn.innerText = "Submit Data"; 
                    btn.disabled = false; 
                }
            })();
        }
    </script>
</body>
</html>
