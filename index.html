<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC OEE Data Entry</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: #ffffff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }
        input:focus, select:focus {
            border-color: #007bff;
            outline: none;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }
        .hidden {
            display: none;
        }
        .section-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #dee2e6;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #218838;
        }
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>OEE Data Entry Form</h2>
        <form id="oeeForm">
            <!-- Common Fields -->
            <div class="form-group">
                <label>Barcode # (Machine ID)</label>
                <!-- Scanner ka option yahan baad mein camera API ke through attach kiya ja sakta hai -->
                <input type="text" id="barcode" required placeholder="Enter Barcode / Scan">
            </div>
            
            <div class="form-group">
                <label>Operator Name</label>
                <input type="text" id="operatorName" required placeholder="Enter Name">
            </div>

            <div class="form-group">
                <label>Shift</label>
                <select id="shift" required>
                    <option value="">Select Shift</option>
                    <option value="Morning">Morning</option>
                    <option value="Evening">Evening</option>
                    <option value="Night">Night</option>
                </select>
            </div>

            <div class="form-group">
                <label>Entry Type</label>
                <select id="entryType" required onchange="toggleSections()">
                    <option value="">Select Type...</option>
                    <option value="Production">Production</option>
                    <option value="Maintenance">Maintenance</option>
                    <option value="Quality">Quality</option>
                </select>
            </div>

            <!-- Production Section -->
            <div id="productionSection" class="section-box hidden">
                <div class="form-group">
                    <label>Runtime (Minutes)</label>
                    <input type="number" id="runtime" placeholder="e.g. 420">
                </div>
                <div class="form-group">
                    <label>Target Quantity</label>
                    <input type="number" id="target" placeholder="e.g. 500">
                </div>
                <div class="form-group">
                    <label>Actual Quantity</label>
                    <input type="number" id="actual" placeholder="e.g. 480">
                </div>
            </div>

            <!-- Maintenance Section -->
            <div id="maintenanceSection" class="section-box hidden">
                <div class="form-group">
                    <label>Maintenance Reason</label>
                    <select id="maintReason">
                        <option value="">Select Reason</option>
                        <option value="Mechanical Fault">Mechanical Fault</option>
                        <option value="Electrical Issue">Electrical Issue</option>
                        <option value="Tool/Insert Change">Tool/Insert Change</option>
                        <option value="Preventive Maintenance">Preventive Maintenance</option>
                        <option value="No Power / No Air">No Power / No Air</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Downtime (Minutes)</label>
                    <input type="number" id="downtime" placeholder="e.g. 45">
                </div>
                <div class="form-group">
                    <label>Technician Name</label>
                    <input type="text" id="techName" placeholder="Name of Technician">
                </div>
            </div>

            <!-- Quality Section -->
            <div id="qualitySection" class="section-box hidden">
                <div class="form-group">
                    <label>Good Parts</label>
                    <input type="number" id="goodParts" placeholder="e.g. 470">
                </div>
                <div class="form-group">
                    <label>Reject / Scrap Parts</label>
                    <input type="number" id="rejectParts" placeholder="e.g. 10">
                </div>
                <div class="form-group">
                    <label>Reject Reason</label>
                    <input type="text" id="rejectReason" placeholder="e.g. Undersize / Finish Issue">
                </div>
            </div>

            <button type="submit" id="submitBtn">Submit Data</button>
        </form>
    </div>

    <script>
        // Section hide/show karne ka function
        function toggleSections() {
            const type = document.getElementById("entryType").value;
            
            document.getElementById("productionSection").classList.add("hidden");
            document.getElementById("maintenanceSection").classList.add("hidden");
            document.getElementById("qualitySection").classList.add("hidden");
            
            if(type === "Production") {
                document.getElementById("productionSection").classList.remove("hidden");
            } else if(type === "Maintenance") {
                document.getElementById("maintenanceSection").classList.remove("hidden");
            } else if(type === "Quality") {
                document.getElementById("qualitySection").classList.remove("hidden");
            }
        }

        // Form submit hone ka function
        document.getElementById("oeeForm").addEventListener("submit", function(e) {
            e.preventDefault(); // Page refresh rokne ke liye
            
            const btn = document.getElementById("submitBtn");
            btn.innerText = "Submitting... Please wait";
            btn.disabled = true;
            
            // Sab fields ka data jama karna
            const data = {
                barcode: document.getElementById("barcode").value,
                operatorName: document.getElementById("operatorName").value,
                shift: document.getElementById("shift").value,
                entryType: document.getElementById("entryType").value,
                runtime: document.getElementById("runtime").value,
                target: document.getElementById("target").value,
                actual: document.getElementById("actual").value,
                maintReason: document.getElementById("maintReason").value,
                downtime: document.getElementById("downtime").value,
                techName: document.getElementById("techName").value,
                goodParts: document.getElementById("goodParts").value,
                rejectParts: document.getElementById("rejectParts").value,
                rejectReason: document.getElementById("rejectReason").value
            };

            // Google Apps Script ko data bhejna
            fetch("https://script.google.com/macros/s/AKfycbyRkmh4_ofJjAftObCfnX9gmhqCa4xcsvSp143BXCUdQujfy4gaFkBMlEhsVrwa61HugQ/exec", {
                method: "POST",
                body: JSON.stringify(data)
            })
            .then(response => response.text()) // Expecting JSON, using text to avoid parse errors temporarily
            .then(result => {
                alert("Data Successfully Saved to Google Sheets!");
                document.getElementById("oeeForm").reset(); // Form clear karna
                toggleSections(); // Sections wapis hide karna
                btn.innerText = "Submit Data";
                btn.disabled = false;
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Data save nahi ho saka. Internet connection check karein.");
                btn.innerText = "Submit Data";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
