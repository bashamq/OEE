<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OEE Data Entry</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e9ecef; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #34495e; font-size: 14px; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        input[readonly], select:disabled, input:disabled { background-color: #e8f8f5; border-color: #1abc9c; color: #16a085; font-weight: bold; cursor: not-allowed; }
        
        .hidden { display: none; }
        .section-box { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6; margin-bottom: 20px; position: relative;}
        .section-title { position: absolute; top: -12px; left: 15px; background: #34495e; color: white; padding: 2px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        
        /* Completed Section Style */
        .completed-box { background-color: #d5f5e3; border-color: #2ecc71; }
        .completed-box .section-title { background: #27ae60; }
        
        .selection-box { background-color: #f4f6f7; border: 1px solid #d5dbdb; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        button { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;}
        button:hover { background: #219150; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        .loading-text { font-size: 13px; font-weight: bold; margin-bottom: 10px; text-align: center; color: #f39c12; }
        .status-badge { float: right; font-size: 11px; background: #e74c3c; color: white; padding: 2px 6px; border-radius: 4px; }
        .completed-box .status-badge { background: #27ae60; }
    </style>
</head>
<body>
    <div class="container">
        <h2>OEE Data Entry Form</h2>
        <form id="oeeForm">
            
            <div class="form-group"><label>Date & Time</label><input type="datetime-local" id="entryDateTime" required onchange="checkExistingData()"></div>
            
            <div id="loadingStatus" class="loading-text">Loading registered machines & logs...</div>

            <div class="selection-box">
                <div class="form-group">
                    <label style="color: #2980b9;">1. Select Line / Department</label>
                    <select id="lineSelect" onchange="onLineChange()">
                        <option value="">-- Choose Production Line --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label style="color: #2980b9;">2. Select Machine (Name & Operation)</label>
                    <select id="machineSelect" onchange="checkExistingData()">
                        <option value="">-- Select Line First --</option>
                    </select>
                </div>
                <div class="form-group"><label>Barcode # (Asset Number)</label><input type="text" id="barcode" placeholder="Auto-filled" readonly></div>
            </div>

            <div class="form-group"><label>Operator Name</label><input type="text" id="operatorName" required></div>
            <div class="form-group">
                <label>Shift</label>
                <select id="shift" required onchange="checkExistingData()">
                    <option value="">Select Shift</option>
                    <option value="Morning">Morning</option>
                    <option value="Evening">Evening</option>
                    <option value="Night">Night</option>
                </select>
            </div>

            <!-- ALL 3 SECTIONS ON ONE PAGE -->

            <!-- STEP 1: MAINTENANCE -->
            <div id="maintenanceSection" class="section-box">
                <div class="section-title">Step 1: Maintenance</div>
                <span id="maintStatus" class="status-badge">Pending</span>
                <p style="font-size:12px; color:#7f8c8d; margin-top:10px;">Enter 0 if machine ran fine without breakdown.</p>
                
                <div class="form-group"><label>Planned Time (Mins)</label><input type="number" id="maintPlannedTime" value="480" readonly></div>
                <div class="form-group"><label>Total Downtime (Mins)</label><input type="number" id="downtime" placeholder="Enter Downtime" oninput="updateInterlocks()"></div>
                <div class="form-group"><label style="color:#2980b9;">Run Time (Mins)</label><input type="number" id="maintRunTime" value="480" readonly></div>
                
                <div class="form-group">
                    <label>Maintenance Reason</label>
                    <select id="maintReasonSelect" onchange="handleOther('maintReason')">
                        <option value="No Issue">No Issue</option>
                        <option value="Other">Other (Type manually)</option>
                    </select>
                    <input type="text" id="maintReasonOther" class="hidden" placeholder="Type specific reason here..." style="margin-top:8px;">
                </div>

                <div class="form-group"><label>Technician Name</label><input type="text" id="techName" placeholder="Leave blank if no issue"></div>
            </div>

            <!-- STEP 2: PRODUCTION -->
            <div id="productionSection" class="section-box">
                <div class="section-title">Step 2: Production</div>
                <span id="prodStatus" class="status-badge">Pending</span>
                <p style="font-size:12px; color:#7f8c8d; margin-top:10px;">Will unlock after Maintenance is filled.</p>

                <div class="form-group"><label id="lblShiftTime">Available Time (Mins)</label><input type="number" id="shiftTime" value="480" readonly></div>
                <div class="form-group"><label>Ideal CT (Min/part)</label><input type="number" step="0.01" id="target" readonly></div>
                <div class="form-group"><label>Standard Production (Shift Target)</label><input type="number" id="stdProd" readonly></div>
                
                <div class="form-group"><label style="color:#2980b9;">Total Count (Parts Produced)</label><input type="number" id="actual" placeholder="Enter parts produced today" disabled oninput="updateInterlocks()"></div>
                
                <div class="form-group hidden" id="lossReasonDiv">
                    <label style="color:#e74c3c;">Performance Loss Reason (Why less?)</label>
                    <select id="lossReasonSelect" onchange="handleOther('lossReason')" disabled>
                        <option value="">-- Select Reason --</option>
                        <option value="Other">Other (Type manually)</option>
                    </select>
                    <input type="text" id="lossReasonOther" class="hidden" placeholder="Type specific reason here..." style="margin-top:8px;">
                </div>
            </div>

            <!-- STEP 3: QUALITY -->
            <div id="qualitySection" class="section-box">
                <div class="section-title">Step 3: Quality</div>
                <span id="qualStatus" class="status-badge">Pending</span>
                <p style="font-size:12px; color:#7f8c8d; margin-top:10px;">Will unlock after Production is filled.</p>
                <p id="qualProdTarget" style="font-size:12px; color:#16a085; font-weight:bold; margin-top:0;"></p>
                
                <div class="form-group"><label>Good Count</label><input type="number" id="goodParts" placeholder="Enter good parts" disabled oninput="calculateScrap()"></div>
                <div class="form-group"><label>Scrap Count (Auto calculated)</label><input type="number" id="rejectParts" readonly placeholder="0"></div>
                
                <div class="form-group" id="rejectReasonDiv">
                    <label>Reject Reason</label>
                    <select id="rejectReasonSelect" onchange="handleOther('rejectReason')" disabled>
                        <option value="">-- Select Reason --</option>
                        <option value="Other">Other (Type manually)</option>
                    </select>
                    <input type="text" id="rejectReasonOther" class="hidden" placeholder="Type specific reason here..." style="margin-top:8px;">
                </div>
            </div>

            <button type="submit" id="submitBtn">Submit Data</button>
        </form>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyRkmh4_ofJjAftObCfnX9gmhqCa4xcsvSp143BXCUdQujfy4gaFkBMlEhsVrwa61HugQ/exec";
        let allRegisteredMachines = [];
        let allLogs = [];
        
        // Track saved states
        let state = { maintSaved: false, prodSaved: false, qualSaved: false };

        function getSafeVal(obj, possibleKeys) {
            let lowerKeys = possibleKeys.map(k => k.toLowerCase().replace(/\s/g, ''));
            for(let key in obj) {
                if(lowerKeys.includes(key.toLowerCase().replace(/\s/g, ''))) return obj[key];
            }
            return "";
        }

        window.onload = function() {
            let now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('entryDateTime').value = now.toISOString().slice(0,16);
            fetchData(false);
        };

        function fetchData(isSilent) {
            if (!isSilent) {
                let cachedM = localStorage.getItem("mes_machines");
                let cachedL = localStorage.getItem("mes_logs");
                if (cachedM && cachedL) {
                    allRegisteredMachines = JSON.parse(cachedM);
                    allLogs = JSON.parse(cachedL);
                    document.getElementById('loadingStatus').style.display = 'none';
                    populateLineDropdown();
                    processQRScan();
                }
            }

            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    allRegisteredMachines = data.machines || [];
                    allLogs = data.logs || [];
                    localStorage.setItem("mes_machines", JSON.stringify(allRegisteredMachines)); 
                    localStorage.setItem("mes_logs", JSON.stringify(allLogs)); 
                    
                    if (!isSilent && !localStorage.getItem("mes_machines")) {
                        document.getElementById('loadingStatus').style.display = 'none';
                        populateLineDropdown();
                        processQRScan();
                    }
                    if(isSilent) checkExistingData(); // Re-check after silent update
                }).catch(err => {
                    if(!isSilent && !localStorage.getItem("mes_machines")) {
                        document.getElementById('loadingStatus').innerText = "⚠️ Error loading data.";
                    }
                });
        }

        function processQRScan() {
            const urlParams = new URLSearchParams(window.location.search);
            const assetFromQR = urlParams.get('asset');
            if(assetFromQR) {
                let m = allRegisteredMachines.find(x => String(getSafeVal(x, ["AssetNumber", "Asset#", "Barcode"])) === String(assetFromQR));
                if (m) {
                    document.getElementById("lineSelect").value = getSafeVal(m, ["LineName", "Line", "Department"]);
                    onLineChange();
                    document.getElementById("machineSelect").value = assetFromQR;
                    checkExistingData();
                }
            }
        }

        function populateLineDropdown() {
            const lineSelect = document.getElementById("lineSelect");
            lineSelect.innerHTML = '<option value="">-- Choose Production Line --</option>';
            let uniqueLines = [...new Set(allRegisteredMachines.map(m => getSafeVal(m, ["LineName", "Line", "Department"])))].filter(Boolean);
            uniqueLines.forEach(line => {
                let opt = document.createElement("option");
                opt.value = line; opt.innerText = line;
                lineSelect.appendChild(opt);
            });
        }

        function onLineChange() {
            const selectedLine = document.getElementById("lineSelect").value;
            const machSelect = document.getElementById("machineSelect");
            machSelect.innerHTML = '<option value="">-- Select Machine --</option>';
            
            resetFormFields();

            if (!selectedLine) return;

            let lineData = allRegisteredMachines.filter(m => getSafeVal(m, ["LineName", "Line", "Department"]) === selectedLine);
            
            let allMaint = [], allProd = [], allQual = [];
            lineData.forEach(m => {
                let mR = getSafeVal(m, ["MaintReasons", "MaintenanceReasons", "MaintReason"]);
                if(mR) allMaint.push(...mR.split(',').map(s=>s.trim()));
                let pR = getSafeVal(m, ["ProdReasons", "ProductionReasons"]);
                if(pR) allProd.push(...pR.split(',').map(s=>s.trim()));
                let qR = getSafeVal(m, ["QualReasons", "QualityReasons", "RejectReasons"]);
                if(qR) allQual.push(...qR.split(',').map(s=>s.trim()));
            });

            let uniqueMaint = [...new Set(allMaint)].filter(Boolean).join(',');
            let uniqueProd = [...new Set(allProd)].filter(Boolean).join(',');
            let uniqueQual = [...new Set(allQual)].filter(Boolean).join(',');

            let validMachines = lineData.filter(m => getSafeVal(m, ["AssetNumber", "Asset#", "Barcode"]) !== "");

            validMachines.forEach((m) => {
                let name = getSafeVal(m, ["MachineName", "Machine"]);
                let op = getSafeVal(m, ["Operation", "Op", "OperationName"]);
                let asset = getSafeVal(m, ["AssetNumber", "Asset#", "Barcode"]);
                let opt = document.createElement("option");
                opt.value = asset; 
                opt.innerText = `${name} | Op: ${op} (${asset})`;
                
                opt.dataset.ct = getSafeVal(m, ["IdealCT", "IdealCT(Min)", "Target"]);
                opt.dataset.std = getSafeVal(m, ["StdProduction", "StandardProduction", "TargetQty"]);
                opt.dataset.maintReasons = uniqueMaint;
                opt.dataset.prodReasons = uniqueProd;
                opt.dataset.qualReasons = uniqueQual;
                
                machSelect.appendChild(opt);
            });
        }

        function populateDropdownList(selectId, commaSeparatedString, defaultText) {
            const selectElem = document.getElementById(selectId);
            selectElem.innerHTML = `<option value="">-- ${defaultText} --</option>`;
            
            if (selectId === 'maintReasonSelect') {
                selectElem.innerHTML = `<option value="No Issue">No Issue</option>`; 
            }

            if (commaSeparatedString && commaSeparatedString.trim() !== "") {
                let reasons = commaSeparatedString.split(',');
                reasons.forEach(r => {
                    if (r.trim()) {
                        let opt = document.createElement("option");
                        opt.value = r.trim(); opt.innerText = r.trim();
                        selectElem.appendChild(opt);
                    }
                });
            }
            let otherOpt = document.createElement("option");
            otherOpt.value = "Other"; otherOpt.innerText = "Other (Type manually)";
            selectElem.appendChild(otherOpt);
        }

        function handleOther(reasonType) {
            let selectVal = document.getElementById(reasonType + "Select").value;
            let otherInput = document.getElementById(reasonType + "Other");
            if (selectVal === "Other") {
                otherInput.classList.remove("hidden");
            } else {
                otherInput.classList.add("hidden");
                otherInput.value = "";
            }
        }

        // --- CORE LOGIC: CHECK EXISTING DATA & AUTO-FILL ---
        function checkExistingData() {
            const machSelect = document.getElementById("machineSelect");
            const shift = document.getElementById("shift").value;
            const dateInput = document.getElementById("entryDateTime").value;

            resetFormFields();

            if (!machSelect.value) return;

            const selectedOpt = machSelect.options[machSelect.selectedIndex];
            document.getElementById("barcode").value = selectedOpt.value; 
            document.getElementById("target").value = selectedOpt.dataset.ct || 0; 
            document.getElementById("stdProd").value = selectedOpt.dataset.std || 0; 
            
            populateDropdownList('maintReasonSelect', selectedOpt.dataset.maintReasons, "Select Reason");
            populateDropdownList('lossReasonSelect', selectedOpt.dataset.prodReasons, "Select Reason");
            populateDropdownList('rejectReasonSelect', selectedOpt.dataset.qualReasons, "Select Reason");

            if (!shift || !dateInput) return; // Wait until shift and date are filled

            let selectedDateStr = new Date(dateInput).toDateString();
            
            // Filter logs for this specific Machine, Shift and Date
            let dayLogs = allLogs.filter(log => {
                let logDate = new Date(getSafeVal(log, ["Timestamp", "Date"])).toDateString();
                return logDate === selectedDateStr &&
                       String(getSafeVal(log, ["Barcode#", "Barcode", "AssetNumber"])) === selectedOpt.value &&
                       String(getSafeVal(log, ["Shift"])) === shift;
            });

            // 1. Check Maintenance
            let maintLog = dayLogs.find(l => String(getSafeVal(l, ["EntryType", "Type"])) === "Maintenance");
            if (maintLog) {
                state.maintSaved = true;
                let dt = getSafeVal(maintLog, ["Downtime(Min)", "Downtime"]) || 0;
                document.getElementById("downtime").value = dt;
                document.getElementById("maintReasonSelect").value = getSafeVal(maintLog, ["MaintReason", "Maint.Reason"]);
                document.getElementById("techName").value = getSafeVal(maintLog, ["TechName"]);
                
                // Styling
                document.getElementById("maintenanceSection").classList.add("completed-box");
                document.getElementById("maintStatus").innerText = "Completed";
                document.getElementById("downtime").disabled = true;
                document.getElementById("maintReasonSelect").disabled = true;
                document.getElementById("techName").disabled = true;
            }

            // 2. Check Production
            let prodLog = dayLogs.find(l => String(getSafeVal(l, ["EntryType", "Type"])) === "Production");
            if (prodLog) {
                state.prodSaved = true;
                document.getElementById("actual").value = getSafeVal(prodLog, ["TotalCount", "Actual", "TotalProduced"]);
                document.getElementById("lossReasonSelect").value = getSafeVal(prodLog, ["LossReason"]);
                
                // Styling
                document.getElementById("productionSection").classList.add("completed-box");
                document.getElementById("prodStatus").innerText = "Completed";
                document.getElementById("actual").disabled = true;
                document.getElementById("lossReasonSelect").disabled = true;
            }

            // 3. Check Quality
            let qualLog = dayLogs.find(l => String(getSafeVal(l, ["EntryType", "Type"])) === "Quality");
            if (qualLog) {
                state.qualSaved = true;
                document.getElementById("goodParts").value = getSafeVal(qualLog, ["GoodCount", "GoodParts"]);
                document.getElementById("rejectParts").value = getSafeVal(qualLog, ["ScrapCount", "RejectParts"]);
                document.getElementById("rejectReasonSelect").value = getSafeVal(qualLog, ["RejectReason"]);
                
                // Styling
                document.getElementById("qualitySection").classList.add("completed-box");
                document.getElementById("qualStatus").innerText = "Completed";
                document.getElementById("goodParts").disabled = true;
                document.getElementById("rejectReasonSelect").disabled = true;
            }

            updateInterlocks();
        }

        // --- UPDATE INTERLOCKS ON THE FLY ---
        function updateInterlocks() {
            // Maintenance logic
            let downtimeVal = document.getElementById("downtime").value;
            let downtime = downtimeVal === "" ? 0 : parseFloat(downtimeVal);
            document.getElementById("maintRunTime").value = 480 - downtime;
            
            // Production unlock condition: Downtime must be filled (even if 0) OR previously saved
            if (downtimeVal !== "" || state.maintSaved) {
                document.getElementById("shiftTime").value = 480 - downtime;
                if(downtime > 0) document.getElementById("lblShiftTime").innerHTML = `Available Time (Mins) <span style="color:#e74c3c; font-size:12px;">(-${downtime}m Maint)</span>`;
                else document.getElementById("lblShiftTime").innerHTML = `Available Time (Mins)`;

                let idealCT = parseFloat(document.getElementById("target").value) || 0;
                if (idealCT > 0) document.getElementById("stdProd").value = Math.floor((480 - downtime) / idealCT);
                
                if (!state.prodSaved) {
                    document.getElementById("actual").disabled = false;
                    document.getElementById("lossReasonSelect").disabled = false;
                }
            } else {
                // Lock Production
                document.getElementById("actual").disabled = true;
                document.getElementById("lossReasonSelect").disabled = true;
            }

            // Target check for Loss Reason
            let actual = parseFloat(document.getElementById("actual").value) || 0;
            let stdProd = parseFloat(document.getElementById("stdProd").value) || 0;
            if(actual > 0 && actual < stdProd) document.getElementById("lossReasonDiv").classList.remove("hidden");
            else document.getElementById("lossReasonDiv").classList.add("hidden");

            // Quality unlock condition: Actual must be filled OR previously saved
            if (document.getElementById("actual").value !== "" || state.prodSaved) {
                document.getElementById("qualProdTarget").innerText = `Total Parts Produced: ${actual}`;
                document.getElementById("goodParts").placeholder = `Max: ${actual}`;
                
                if (!state.qualSaved) {
                    document.getElementById("goodParts").disabled = false;
                    document.getElementById("rejectReasonSelect").disabled = false;
                }
            } else {
                // Lock Quality
                document.getElementById("goodParts").disabled = true;
                document.getElementById("rejectReasonSelect").disabled = true;
            }
        }

        function calculateScrap() {
            let actual = parseInt(document.getElementById("actual").value) || 0;
            let good = parseInt(document.getElementById("goodParts").value) || 0;
            if (good > actual) {
                alert(`⚠️ Good parts cannot be greater than Total Produced (${actual})!`);
                document.getElementById("goodParts").value = actual;
                good = actual;
            }
            document.getElementById("rejectParts").value = actual - good;
        }

        function resetFormFields() {
            state = { maintSaved: false, prodSaved: false, qualSaved: false };
            
            let idsToReset = ["downtime", "maintReasonOther", "techName", "actual", "lossReasonOther", "goodParts", "rejectParts", "rejectReasonOther"];
            idsToReset.forEach(id => { document.getElementById(id).value = ""; document.getElementById(id).disabled = false; });
            
            document.getElementById("maintenanceSection").classList.remove("completed-box");
            document.getElementById("productionSection").classList.remove("completed-box");
            document.getElementById("qualitySection").classList.remove("completed-box");
            
            document.getElementById("maintStatus").innerText = "Pending";
            document.getElementById("prodStatus").innerText = "Pending";
            document.getElementById("qualStatus").innerText = "Pending";

            document.getElementById("downtime").disabled = false;
            document.getElementById("maintReasonSelect").disabled = false;
            document.getElementById("techName").disabled = false;
            document.getElementById("actual").disabled = true;
            document.getElementById("lossReasonSelect").disabled = true;
            document.getElementById("goodParts").disabled = true;
            document.getElementById("rejectReasonSelect").disabled = true;

            document.getElementById('maintReasonOther').classList.add("hidden");
            document.getElementById('lossReasonOther').classList.add("hidden");
            document.getElementById('rejectReasonOther').classList.add("hidden");
            document.getElementById("lossReasonDiv").classList.add("hidden");

            document.getElementById("qualProdTarget").innerText = "";
            document.getElementById("lblShiftTime").innerHTML = `Available Time (Mins)`;
        }

        function getFinalReason(reasonType) {
            let selectVal = document.getElementById(reasonType + "Select").value;
            return selectVal === "Other" ? document.getElementById(reasonType + "Other").value : selectVal;
        }

        // --- SUBMIT SEQUENTIALLY ---
        document.getElementById("oeeForm").addEventListener("submit", async function(e) {
            e.preventDefault(); 
            
            if (!document.getElementById("barcode").value) { alert("⚠️ Select Machine First!"); return; }

            let downtimeVal = document.getElementById("downtime").value;
            let actualVal = document.getElementById("actual").value;
            let goodVal = document.getElementById("goodParts").value;

            // Base Validation
            if (!state.maintSaved && downtimeVal === "") { alert("⚠️ Please enter Total Downtime (0 if none)."); return; }
            if (!state.prodSaved && actualVal !== "") {
                let stdProd = parseFloat(document.getElementById("stdProd").value) || 0;
                if (parseFloat(actualVal) < stdProd && getFinalReason("lossReason").trim() === "") {
                    alert("⚠️ Target missed! Please enter a Performance Loss Reason."); return;
                }
            }
            if (!state.qualSaved && goodVal !== "") {
                let rejectParts = document.getElementById("rejectParts").value;
                if (parseFloat(rejectParts) > 0 && getFinalReason("rejectReason").trim() === "") {
                    alert("⚠️ Scrap parts detected! Please enter a Reject Reason."); return;
                }
            }

            const btn = document.getElementById("submitBtn");
            btn.innerText = "Saving Data..."; btn.disabled = true;

            // Generate Payloads for UN-SAVED sections that have data
            let payloads = [];
            let commonData = {
                manualDateTime: document.getElementById("entryDateTime").value,
                barcode: document.getElementById("barcode").value,
                operatorName: document.getElementById("operatorName").value,
                shift: document.getElementById("shift").value,
                shiftTime: document.getElementById("shiftTime").value, 
                target: document.getElementById("target").value,
                lineName: document.getElementById("lineSelect").value
            };

            if (!state.maintSaved && downtimeVal !== "") {
                payloads.push({ formType: "dataEntry", entryType: "Maintenance", downtime: downtimeVal, maintReason: getFinalReason("maintReason"), techName: document.getElementById("techName").value, ...commonData });
            }
            if (!state.prodSaved && actualVal !== "") {
                payloads.push({ formType: "dataEntry", entryType: "Production", actual: actualVal, lossReason: getFinalReason("lossReason"), ...commonData });
            }
            if (!state.qualSaved && goodVal !== "") {
                payloads.push({ formType: "dataEntry", entryType: "Quality", goodParts: goodVal, rejectParts: document.getElementById("rejectParts").value, rejectReason: getFinalReason("rejectReason"), ...commonData });
            }

            if (payloads.length === 0) {
                alert("No new data to save.");
                btn.innerText = "Submit Data"; btn.disabled = false;
                return;
            }

            // Send sequentially to avoid backend conflicts
            try {
                for (let payload of payloads) {
                    await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                }
                alert("Data Saved Successfully!");
                fetchData(true); // refresh logs silently
                btn.innerText = "Submit Data"; btn.disabled = false;
            } catch (err) {
                alert("Error saving data. Please check internet.");
                btn.innerText = "Submit Data"; btn.disabled = false;
            }
        });
    </script>
</body>
</html>
