<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise OEE Dashboard</title>
    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            background: #2c3e50;
            color: #f1c40f;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-bottom: 5px solid #e74c3c;
        }
        .header h1 { margin: 0; font-size: 28px; color: white;}
        .header p { margin: 5px 0 0 0; font-size: 14px; color: #bdc3c7;}
        .controls {
            text-align: center;
            margin-bottom: 20px;
        }
        select {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            width: 300px;
            border: 1px solid #ccc;
        }
        .cards {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 22%;
            text-align: center;
            min-width: 150px;
            margin: 10px 0;
            border-top: 4px solid #3498db;
        }
        .card h3 {
            margin: 0 0 10px 0;
            color: #34495e;
            font-size: 16px;
            text-transform: uppercase;
        }
        .card .value {
            font-size: 32px;
            font-weight: bold;
            color: #27ae60;
        }
        .charts-wrapper {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .chart-container {
            width: 48%;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .loading {
            text-align: center;
            font-size: 18px;
            color: #2980b9;
            font-weight: bold;
            margin-top: 50px;
        }
        @media (max-width: 900px) {
            .chart-container { width: 100%; }
            .card { width: 45%; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Manufacturing Excellence - OEE Program</h1>
        <p>Live Dashboard - Aggregated & Machine Level</p>
    </div>

    <div class="controls">
        <label for="machineSelect"><strong>Select View: </strong></label>
        <select id="machineSelect" onchange="calculateOEE()">
            <option value="All">Factory Aggregate (All Machines)</option>
            <!-- Machine options will load here -->
        </select>
    </div>

    <div id="loadingMsg" class="loading">Fetching Live Data from ERP/Google Sheets... Please wait.</div>

    <div class="cards" id="dashboardCards" style="display:none;">
        <div class="card" style="border-color: #2c3e50;">
            <h3>Overall OEE</h3>
            <div class="value" id="valOEE">0%</div>
        </div>
        <div class="card" style="border-color: #3498db;">
            <h3>Availability</h3>
            <div class="value" id="valA">0%</div>
        </div>
        <div class="card" style="border-color: #f1c40f;">
            <h3>Performance</h3>
            <div class="value" id="valP">0%</div>
        </div>
        <div class="card" style="border-color: #e74c3c;">
            <h3>Quality</h3>
            <div class="value" id="valQ">0%</div>
        </div>
    </div>

    <div class="charts-wrapper" id="chartDiv" style="display:none;">
        <!-- OEE Factors Chart -->
        <div class="chart-container">
            <h3 style="text-align:center; color:#333;">OEE Factors (%)</h3>
            <canvas id="oeeChart"></canvas>
        </div>
        <!-- Top Downtime Reasons Pareto Chart -->
        <div class="chart-container">
            <h3 style="text-align:center; color:#333;">Top Downtime Reasons (Minutes)</h3>
            <canvas id="downtimeChart"></canvas>
        </div>
    </div>

    <script>
        // AAPKA GOOGLE SCRIPT URL
        const API_URL = "https://script.google.com/macros/s/AKfycbyRkmh4_ofJjAftObCfnX9gmhqCa4xcsvSp143BXCUdQujfy4gaFkBMlEhsVrwa61HugQ/exec";
        let allLogs = [];
        let oeeChartInstance = null;
        let downtimeChartInstance = null;

        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                allLogs = data;
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('dashboardCards').style.display = 'flex';
                document.getElementById('chartDiv').style.display = 'flex';
                populateDropdown();
                calculateOEE();
            })
            .catch(error => {
                console.error("Error fetching data: ", error);
                document.getElementById('loadingMsg').innerText = "Error loading data. Check internet or API link.";
                document.getElementById('loadingMsg').style.color = "red";
            });

        function populateDropdown() {
            const select = document.getElementById("machineSelect");
            const machines = [...new Set(allLogs.map(item => item["Barcode #"]))].filter(b => b); 
            
            machines.forEach(machine => {
                let opt = document.createElement("option");
                opt.value = machine;
                opt.innerText = "Machine Barcode: " + machine;
                select.appendChild(opt);
            });
        }

        function calculateOEE() {
            const selectedMachine = document.getElementById("machineSelect").value;
            let filteredData = allLogs;

            if (selectedMachine !== "All") {
                filteredData = allLogs.filter(item => String(item["Barcode #"]) === String(selectedMachine));
            }

            let totalShiftTime = 0, totalDowntime = 0;
            let totalTarget = 0, totalActual = 0;
            let totalGood = 0, totalReject = 0;
            
            // Downtime Tracking Object
            let downtimeReasons = {};

            filteredData.forEach(row => {
                if (row["Entry Type"] === "Production") {
                    totalShiftTime += Number(row["Shift Time (Min)"]) || 0;
                    totalTarget += Number(row["Target Qty"]) || 0;
                    totalActual += Number(row["Actual Qty"]) || 0;
                } else if (row["Entry Type"] === "Maintenance") {
                    let dt = Number(row["Downtime (Min)"]) || 0;
                    totalDowntime += dt;
                    
                    // Populate Downtime Reasons for Pareto Chart
                    let reason = row["Maint. Reason"] || "Unspecified";
                    if(downtimeReasons[reason]) {
                        downtimeReasons[reason] += dt;
                    } else {
                        downtimeReasons[reason] = dt;
                    }

                } else if (row["Entry Type"] === "Quality") {
                    totalGood += Number(row["Good Parts"]) || 0;
                    totalReject += Number(row["Reject Parts"]) || 0;
                }
            });

            // Actual Run Time
            let actualRunTime = totalShiftTime - totalDowntime;
            if (actualRunTime < 0) actualRunTime = 0;

            // OEE Calculation (Weighted Aggregation as per Presentation)
            let availability = totalShiftTime > 0 ? (actualRunTime / totalShiftTime) : 0;
            let performance = totalTarget > 0 ? (totalActual / totalTarget) : 0;
            
            let totalProduced = totalGood + totalReject;
            let quality = totalProduced > 0 ? (totalGood / totalProduced) : 0;

            if(performance > 1) performance = 1; 
            let oee = availability * performance * quality;

            let aPct = (availability * 100).toFixed(1);
            let pPct = (performance * 100).toFixed(1);
            let qPct = (quality * 100).toFixed(1);
            let oeePct = (oee * 100).toFixed(1);

            document.getElementById("valOEE").innerText = oeePct + "%";
            document.getElementById("valA").innerText = aPct + "%";
            document.getElementById("valP").innerText = pPct + "%";
            document.getElementById("valQ").innerText = qPct + "%";

            // Prepare Downtime Data for Chart (Sorting High to Low)
            let sortedDowntime = Object.keys(downtimeReasons)
                .map(key => ({ reason: key, time: downtimeReasons[key] }))
                .sort((a, b) => b.time - a.time); // Highest first

            let dtLabels = sortedDowntime.map(item => item.reason);
            let dtData = sortedDowntime.map(item => item.time);

            updateCharts(aPct, pPct, qPct, oeePct, dtLabels, dtData);
        }

        function updateCharts(a, p, q, oee, dtLabels, dtData) {
            // 1. OEE Bar Chart
            const ctx1 = document.getElementById('oeeChart').getContext('2d');
            if (oeeChartInstance) oeeChartInstance.destroy();

            oeeChartInstance = new Chart(ctx1, {
                type: 'bar',
                data: {
                    labels: ['Availability', 'Performance', 'Quality', 'Overall OEE'],
                    datasets: [{
                        label: 'Percentage (%)',
                        data: [a, p, q, oee],
                        backgroundColor: ['#3498db', '#f1c40f', '#e74c3c', '#2c3e50']
                    }]
                },
                options: { scales: { y: { beginAtZero: true, max: 100 } }, plugins: { legend: { display: false } } }
            });

            // 2. Downtime Pareto Chart (Horizontal Bar)
            const ctx2 = document.getElementById('downtimeChart').getContext('2d');
            if (downtimeChartInstance) downtimeChartInstance.destroy();

            downtimeChartInstance = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: dtLabels,
                    datasets: [{
                        label: 'Downtime Minutes',
                        data: dtData,
                        backgroundColor: '#95a5a6'
                    }]
                },
                options: { 
                    indexAxis: 'y', // Makes it horizontal
                    scales: { x: { beginAtZero: true } },
                    plugins: { legend: { display: false } } 
                }
            });
        }
    </script>
</body>
</html>
