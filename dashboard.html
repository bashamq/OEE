<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Dashboard & Admin</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; overflow-x: hidden; }
        
        .header { position: relative; text-align: center; background: #2c3e50; color: #f1c40f; padding: 20px; border-radius: 8px; margin-bottom: 20px; border-bottom: 5px solid #e74c3c; }
        .header h1 { margin: 0; font-size: 28px; color: white;}
        .admin-btn { position: absolute; top: 25px; left: 20px; background: #8e44ad; color: white; border: none; padding: 10px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; }
        .admin-btn:hover { background: #732d91; }
        
        .sync-indicator { position: absolute; top: 25px; right: 20px; color: #2ecc71; font-size: 14px; font-weight: bold; display: none; align-items: center; gap: 5px; }
        .sync-dot { width: 10px; height: 10px; background-color: #2ecc71; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 999; display: none; }
        .admin-sidebar { position: fixed; top: 0; left: -400px; width: 320px; height: 100%; background: #fff; box-shadow: 2px 0 15px rgba(0,0,0,0.3); z-index: 1000; transition: left 0.4s ease; padding: 20px; overflow-y: auto; }
        .admin-sidebar.open { left: 0; }
        .close-btn { float: right; background: none; border: none; font-size: 22px; color: #e74c3c; cursor: pointer; }
        .admin-sidebar h2 { color: #2c3e50; margin-top: 0; font-size: 22px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px;}
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; font-size: 14px;}
        .form-group input, .form-group select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .save-btn { width: 100%; padding: 12px; background: #8e44ad; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;}

        .controls { text-align: center; margin-bottom: 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        select.filter-select { padding: 12px; font-size: 16px; border-radius: 5px; width: 320px; border: 2px solid #bdc3c7; font-weight: bold; color: #2c3e50; background-color: #fff; outline: none; cursor: pointer; }
        
        .info-banner { background: #e8f8f5; border: 2px solid #1abc9c; padding: 15px 25px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; color: #2c3e50; box-shadow: 0 4px 8px rgba(0,0,0,0.05); }
        .info-item { text-align: center; }
        .info-item span { display: block; font-size: 14px; color: #7f8c8d; text-transform: uppercase; font-weight: bold; margin-bottom: 4px; }
        .info-item strong { font-size: 20px; color: #16a085; }

        .progress-wrapper { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 30px; border-left: 5px solid #27ae60; display: none; }
        .progress-header { display: flex; justify-content: space-between; }
        .progress-text { font-size: 18px; font-weight: bold; }
        .progress-bar-bg { background: #ecf0f1; border-radius: 10px; height: 30px; width: 100%; margin-top: 15px; position: relative; }
        .progress-fill { background: #27ae60; height: 100%; width: 0%; transition: 0.8s; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; color: white; font-weight: bold; border-radius: 10px; }
        
        .cards { display: flex; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 15%; text-align: center; min-width: 140px; border-top: 4px solid #3498db; }
        .card h3 { margin: 0 0 10px 0; color: #34495e; font-size: 14px; }
        .card .value { font-size: 24px; font-weight: bold; color: #27ae60; }
        
        .charts-wrapper { display: flex; justify-content: space-between; flex-wrap: wrap; }
        .chart-container { width: 48%; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; box-sizing: border-box; }
        .loading { text-align: center; font-size: 18px; color: #2980b9; font-weight: bold; margin-top: 50px; }
        @media (max-width: 900px) { .chart-container { width: 100%; } .card { width: 30%; } .info-banner { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleAdmin()"></div>
    <div class="admin-sidebar" id="adminSidebar">
        <button class="close-btn" onclick="toggleAdmin()">✖</button>
        <h2>Set Targets</h2>
        <form id="adminForm">
            <div class="form-group"><label>Select Month</label><input type="month" id="targetMonth" required></div>
            <div class="form-group">
                <label>Production Line</label>
                <select id="targetLineName" required>
                    <option value="">-- Select Line --</option>
                    <option value="Axle 385">1. Axle 385</option>
                    <option value="Sump 385">2. Sump 385</option>
                    <option value="Hyd. Lift Cover">3. Hyd. Lift Cover</option>
                    <option value="Cylinder 240/385">4. Cylinder 240/385</option>
                    <option value="FAS 350">5. FAS 350</option>
                    <option value="Spacer Block/Adaptor Plate/PTO">6. Spacer Block/Adaptor Plate/PTO</option>
                    <option value="Rear Wheel 1st and 2nd">7. Rear Wheel 1st and 2nd</option>
                    <option value="Diff Case 385 (set)">8. Diff Case 385 (set)</option>
                    <option value="Piston 240/385">9. Piston 240/385</option>
                    <option value="Front Support 350/385">10. Front Support 350/385</option>
                    <option value="Front Support 850/85-56">11. Front Support 850/85-56</option>
                    <option value="Diff Plate">12. Diff Plate</option>
                    <option value="FAS 480">13. FAS 480</option>
                    <option value="Diff Case 480">14. Diff Case 480</option>
                    <option value="Tube Final Drive 480/640/850">15. Tube Final Drive 480/640/850</option>
                    <option value="Hub 240/385/480">16. Hub 240/385/480</option>
                    <option value="Support Splitter">17. Support Splitter</option>
                    <option value="Small Parts">18. Small Parts</option>
                    <option value="Axle Casing 480/850/85-56">19. Axle Casing 480/850/85-56</option>
                    <option value="Casing Gear Box 480/850">20. Casing Gear Box 480/850</option>
                </select>
            </div>
            <div class="form-group"><label>Target Quantity</label><input type="number" id="targetQty" required></div>
            <button type="submit" class="save-btn" id="submitTargetBtn">Save Target</button>
        </form>
    </div>

    <div class="header">
        <button class="admin-btn" onclick="toggleAdmin()">⚙️ Set Targets</button>
        <h1>Manufacturing Excellence Dashboard</h1>
        <p style="color: #bdc3c7; margin-top:5px;">Target vs Actual, OEE, MTTR & MTBF</p>
        <div class="sync-indicator" id="syncIndicator"><div class="sync-dot"></div> Live Syncing</div>
    </div>

    <div class="controls">
        <select id="lineSelect" class="filter-select" onchange="onLineChange()">
            <option value="All">🏭 Factory Aggregate (All Lines)</option>
        </select>
        <select id="machineSelect" class="filter-select" onchange="calculateDashboard()" style="display:none;">
            <option value="All">All Machines in this Line</option>
        </select>
    </div>

    <div id="loadingMsg" class="loading">Fetching Data... Please wait.</div>

    <div id="machineInfoBanner" class="info-banner" style="display: none;">
        <div class="info-item"><span>Machine Name</span><strong id="lblMachName">-</strong></div>
        <div class="info-item"><span>Asset (Barcode) #</span><strong id="lblMachAsset">-</strong></div>
        <div class="info-item"><span>Operation</span><strong id="lblMachOp">-</strong></div>
    </div>

    <div class="progress-wrapper" id="progressDiv">
        <div class="progress-header">
            <h3>Monthly Target Progress</h3>
            <div class="progress-text" id="targetText">0 / 0 (0%)</div>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-fill" id="targetFill" style="width: 0%;">0%</div>
        </div>
    </div>

    <div class="cards" id="dashboardCards" style="display:none;">
        <div class="card"><h3>OEE</h3><div class="value" id="valOEE">0%</div></div>
        <div class="card"><h3>Availability</h3><div class="value" id="valA">0%</div></div>
        <div class="card"><h3>Performance</h3><div class="value" id="valP">0%</div></div>
        <div class="card"><h3>Quality</h3><div class="value" id="valQ">0%</div></div>
        <div class="card"><h3>MTTR (Min)</h3><div class="value" style="color:#8e44ad;" id="valMTTR">0</div></div>
        <div class="card"><h3>MTBF (Min)</h3><div class="value" style="color:#16a085;" id="valMTBF">0</div></div>
    </div>

    <div class="charts-wrapper" id="chartDiv" style="display:none;">
        <div class="chart-container"><canvas id="oeeChart"></canvas></div>
        <div class="chart-container"><canvas id="downtimeChart"></canvas></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyRkmh4_ofJjAftObCfnX9gmhqCa4xcsvSp143BXCUdQujfy4gaFkBMlEhsVrwa61HugQ/exec";
        let allLogs = [], allTargets = [], allMachines = [];
        let oeeChartInstance = null, downtimeChartInstance = null;

        function getSafeVal(obj, possibleKeys) {
            let lowerKeys = possibleKeys.map(k => k.toLowerCase().replace(/\s/g, ''));
            for(let key in obj) {
                if(lowerKeys.includes(key.toLowerCase().replace(/\s/g, ''))) return obj[key];
            }
            return null;
        }

        function fetchAllData(isSilent = false) {
            if(isSilent) document.getElementById('syncIndicator').style.display = 'flex';
            
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    allLogs = data.logs || []; allTargets = data.targets || []; allMachines = data.machines || [];
                    
                    if(!isSilent) {
                        document.getElementById('loadingMsg').style.display = 'none';
                        document.getElementById('dashboardCards').style.display = 'flex';
                        document.getElementById('chartDiv').style.display = 'flex';
                    }
                    
                    if(document.getElementById("lineSelect").options.length === 1) {
                        populateLineDropdown();
                    }
                    
                    calculateDashboard();
                    
                    if(isSilent) setTimeout(() => { document.getElementById('syncIndicator').style.display = 'none'; }, 2000);
                }).catch(e => { 
                    if(!isSilent) document.getElementById('loadingMsg').innerText = "Error loading data."; 
                    if(isSilent) document.getElementById('syncIndicator').style.display = 'none';
                });
        }
        
        fetchAllData();
        setInterval(() => { fetchAllData(true); }, 30000);

        function toggleAdmin() {
            const sidebar = document.getElementById('adminSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if(sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                overlay.style.display = 'none';
            } else {
                sidebar.classList.add('open');
                overlay.style.display = 'block';
            }
        }

        document.getElementById("adminForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const btn = document.getElementById("submitTargetBtn");
            btn.innerText = "Saving..."; btn.disabled = true;

            const data = {
                formType: "adminTarget", 
                month: document.getElementById("targetMonth").value,
                lineName: document.getElementById("targetLineName").value,
                targetQty: document.getElementById("targetQty").value
            };

            fetch(API_URL, { method: "POST", body: JSON.stringify(data) })
            .then(res => res.json())
            .then(result => {
                alert("Target Saved Successfully!");
                document.getElementById("adminForm").reset();
                btn.innerText = "Save Target"; btn.disabled = false;
                toggleAdmin(); 
                fetchAllData(true); 
            });
        });

        function populateLineDropdown() {
            const select = document.getElementById("lineSelect");
            let uniqueLines = [...new Set(allMachines.map(m => getSafeVal(m, ["LineName", "Line", "Department"])))].filter(Boolean);
            uniqueLines.forEach(l => { 
                let o = document.createElement("option"); o.value = l; o.innerText = "🛠️ Line: " + l; select.appendChild(o); 
            });
        }

        function onLineChange() {
            const lineSel = document.getElementById("lineSelect").value;
            const machSel = document.getElementById("machineSelect");
            
            if (lineSel === "All") {
                machSel.style.display = "none";
                machSel.value = "All";
            } else {
                machSel.style.display = "inline-block";
                machSel.innerHTML = '<option value="All">⚙️ All Machines in this Line</option>';
                let lineMachines = allMachines.filter(m => getSafeVal(m, ["LineName", "Line", "Department"]) === lineSel);
                let uniqueAssets = new Set();
                lineMachines.forEach(m => {
                    let asset = getSafeVal(m, ["AssetNumber", "Asset#", "Barcode"]);
                    let name = getSafeVal(m, ["MachineName", "Machine"]);
                    if(!uniqueAssets.has(asset)) {
                        uniqueAssets.add(asset);
                        let o = document.createElement("option"); o.value = asset; o.innerText = `⚙️ ${name} (${asset})`; machSel.appendChild(o);
                    }
                });
            }
            calculateDashboard();
        }

        function getLatestTarget(lineName) {
            let trgs = allTargets.filter(t => getSafeVal(t, ["LineName", "Line"]) === lineName);
            return trgs.length ? Number(getSafeVal(trgs[trgs.length - 1], ["TargetQty", "Target"])) : 0;
        }

        function calculateDashboard() {
            let lineVal = document.getElementById("lineSelect").value;
            let machVal = document.getElementById("machineSelect").value;
            let fLogs = [], trg = 0;
            let banner = document.getElementById("machineInfoBanner");
            let progressDiv = document.getElementById("progressDiv");
            
            if (machVal !== "All" && lineVal !== "All") {
                progressDiv.style.display = "none";
                let m = allMachines.find(x => String(getSafeVal(x, ["AssetNumber", "Asset#", "Barcode"])) === machVal && getSafeVal(x, ["LineName", "Line", "Department"]) === lineVal);
                if(m) {
                    document.getElementById("lblMachName").innerText = getSafeVal(m, ["MachineName", "Machine"]) || "N/A";
                    document.getElementById("lblMachAsset").innerText = machVal;
                    document.getElementById("lblMachOp").innerText = getSafeVal(m, ["Operation", "Op", "OperationName"]) || "N/A";
                    banner.style.display = "flex";
                }
            } else {
                progressDiv.style.display = "block";
                banner.style.display = "none";
            }

            if (lineVal === "All") {
                fLogs = allLogs;
                let uLines = [...new Set(allMachines.map(m => getSafeVal(m, ["LineName", "Line"])))].filter(Boolean);
                uLines.forEach(l => trg += getLatestTarget(l));
            } else if (lineVal !== "All" && machVal === "All") {
                trg = getLatestTarget(lineVal);
                let lineAssets = allMachines.filter(m => getSafeVal(m, ["LineName", "Line"]) === lineVal).map(m => String(getSafeVal(m, ["AssetNumber", "Asset#", "Barcode"])));
                fLogs = allLogs.filter(log => lineAssets.includes(String(getSafeVal(log, ["Barcode#", "Barcode", "AssetNumber"]))));
            } else if (machVal !== "All") {
                trg = 0; 
                fLogs = allLogs.filter(log => String(getSafeVal(log, ["Barcode#", "Barcode"])) === machVal);
            }

            let pt = 0, dt = 0, it = 0, g = 0, r = 0, dtC = 0, dtR = {};
            fLogs.forEach(row => {
                let entryType = getSafeVal(row, ["EntryType"]);
                if (entryType === "Production") { 
                    pt += Number(getSafeVal(row, ["PlannedTime(Min)", "ShiftTime"])) || 0; 
                    it += (Number(getSafeVal(row, ["IdealCT(Min)", "IdealCT", "Target"])) || 0) * (Number(getSafeVal(row, ["TotalCount", "Actual"])) || 0); 
                }
                else if (entryType === "Maintenance") { 
                    let d = Number(getSafeVal(row, ["Downtime(Min)", "Downtime"])) || 0; 
                    if(d > 0) { dt += d; dtC++; let rn = getSafeVal(row, ["Maint.Reason", "MaintReason"]) || "N/A"; dtR[rn] = (dtR[rn] || 0) + d; } 
                }
                else if (entryType === "Quality") { 
                    g += Number(getSafeVal(row, ["GoodCount", "GoodParts"])) || 0; r += Number(getSafeVal(row, ["ScrapCount", "RejectParts"])) || 0; 
                }
            });

            if (progressDiv.style.display === "block") {
                let pct = trg > 0 ? (g/trg)*100 : 0; if(pct>100) pct=100;
                document.getElementById("targetText").innerText = `${g} / ${trg} (${pct.toFixed(1)}%)`;
                document.getElementById("targetFill").style.width = `${pct}%`;
                document.getElementById("targetFill").innerText = `${pct.toFixed(1)}%`;
                document.getElementById("targetFill").style.backgroundColor = pct<50?"#e74c3c":pct<85?"#f1c40f":"#27ae60";
            }

            let rt = pt - dt; if(rt<0) rt=0;
            let a = pt>0 ? rt/pt : 0, p = rt>0 ? it/rt : 0, q = (g+r)>0 ? g/(g+r) : 0;
            if(p>1) p=1; let oee = a*p*q;

            document.getElementById("valOEE").innerText = (oee*100).toFixed(1)+"%";
            document.getElementById("valA").innerText = (a*100).toFixed(1)+"%";
            document.getElementById("valP").innerText = (p*100).toFixed(1)+"%";
            document.getElementById("valQ").innerText = (q*100).toFixed(1)+"%";
            document.getElementById("valMTTR").innerText = dtC>0 ? (dt/dtC).toFixed(1) : 0;
            document.getElementById("valMTBF").innerText = dtC>0 ? (rt/dtC).toFixed(1) : rt.toFixed(1);

            let sDt = Object.keys(dtR).map(k => ({r:k, t:dtR[k]})).sort((x,y)=>y.t-x.t);
            updateCharts(a*100, p*100, q*100, oee*100, sDt.map(i=>i.r), sDt.map(i=>i.t));
        }

        // UPDATED: Chart order changed to OEE, A, P, Q
        function updateCharts(a, p, q, o, l, d) {
            if (oeeChartInstance) oeeChartInstance.destroy();
            oeeChartInstance = new Chart(document.getElementById('oeeChart'), { 
                type: 'bar', 
                data: { 
                    labels: ['OEE', 'A', 'P', 'Q'], 
                    datasets: [{ 
                        data: [o, a, p, q], 
                        backgroundColor: ['#2c3e50', '#3498db', '#f1c40f', '#e74c3c'] 
                    }] 
                }, 
                options: { 
                    scales: { y: { max: 100 } }, 
                    plugins: { legend: { display: false } } 
                } 
            });
            
            if (downtimeChartInstance) downtimeChartInstance.destroy();
            downtimeChartInstance = new Chart(document.getElementById('downtimeChart'), { 
                type: 'bar', 
                data: { labels: l, datasets: [{ data: d, backgroundColor: '#95a5a6' }] }, 
                options: { indexAxis: 'y', plugins: { legend: { display: false } } } 
            });
        }
    </script>
</body>
</html>
