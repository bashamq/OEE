<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Live Shop Floor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; margin: 0; padding: 20px; color: #f8fafc; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; color: white; padding: 18px 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .header h2 { margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; color: #38bdf8; }
        
        .kpi-container { display: flex; gap: 15px; }
        .kpi-card { background: rgba(30,41,59,0.7); padding: 10px 18px; border-radius: 8px; text-align: center; border: 1px solid #475569; }
        .kpi-card span { display: block; font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .kpi-card strong { font-size: 18px; color: #4ade80; }

        /* FILTER BAR */
        .filter-section { background: #1e293b; padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-bottom: 25px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; border: 1px solid #334155; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 200px; }
        .filter-group label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
        .filter-section select, .filter-section input { padding: 10px 15px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-family: 'Poppins', sans-serif; font-size: 14px; }

        /* FACTORY OVERVIEW SECTION */
        .factory-overview { background: #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 25px; border: 1px solid #334155; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .factory-overview h3 { margin-top: 0; color: #38bdf8; font-size: 18px; text-transform: uppercase; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .charts-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 15px; }
        .chart-box { background: #0f172a; padding: 15px; border-radius: 10px; border: 1px solid #334155; text-align: center; }
        .chart-box h4 { margin: 0 0 10px 0; font-size: 14px; color: #cbd5e1; }

        /* CARDS GRID WITH DOUGHNUT CHARTS */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }
        .op-card { background: #1e293b; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); padding: 20px; border-top: 5px solid #38bdf8; border: 1px solid #334155; transition: 0.3s; }
        .op-card h3 { margin-top: 0; margin-bottom: 4px; color: #f8fafc; font-size: 17px; }
        .op-card .machine-sub { font-size: 11px; color: #94a3b8; font-weight: 500; margin-bottom: 12px; text-transform: uppercase; line-height: 1.4; }
        
        .metric-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; border-bottom: 1px dashed #334155; padding-bottom: 4px; color: #cbd5e1; }
        .metric-row span:last-child { font-weight: 600; color: #f8fafc; }
        
        /* CARD DOUGHNUTS WRAPPER */
        .card-charts-container { display: flex; justify-content: space-around; align-items: center; margin-top: 15px; background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid #334155; }
        .mini-doughnut-box { width: 110px; text-align: center; }
        .mini-doughnut-box span { display: block; font-size: 10px; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }

        .oee-badge { display: block; text-align: center; background: rgba(56,189,248,0.1); color: #38bdf8; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 15px; margin-top: 12px; border: 1px solid rgba(56,189,248,0.3); }
        .no-data { text-align: center; padding: 50px; color: #94a3b8; font-size: 16px; background: #1e293b; border-radius: 12px; grid-column: 1 / -1; border: 1px solid #334155; }
        
        .live-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4ade80; font-weight: 600; }
        .live-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 8px #4ade80; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>🏭 Shop Floor Live Dashboard</h2>
            <div class="live-indicator" style="margin-top: 5px;"><div class="live-dot"></div> Live Auto-Refreshing (Every 5s)</div>
        </div>
        <div class="kpi-container">
            <div class="kpi-card"><span>Shop OEE</span><strong id="kpiOEE">0.0%</strong></div>
            <div class="kpi-card"><span>Avg MTTR</span><strong id="kpiMTTR">14 min</strong></div>
            <div class="kpi-card"><span>Avg MTBF</span><strong id="kpiMTBF">135 min</strong></div>
        </div>
    </div>

    <div class="filter-section">
        <div class="filter-group">
            <label>Production Line</label>
            <select id="lineFilter" onchange="renderDashboard()">
                <option value="">-- All Lines (Entire Factory Overview) --</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Filter Date</label>
            <input type="date" id="dateFilter" onchange="renderDashboard()">
        </div>
        <div class="filter-group">
            <label>Shift</label>
            <select id="shiftFilter" onchange="renderDashboard()">
                <option value="">All Shifts</option>
                <option value="Morning">Morning</option>
                <option value="Evening">Evening</option>
                <option value="Night">Night</option>
            </select>
        </div>
    </div>

    <!-- OVERALL FACTORY CHARTS -->
    <div id="factoryOverviewSection" class="factory-overview">
        <h3>📊 Overall Factory Performance Overview</h3>
        <div class="charts-row">
            <div class="chart-box"><h4>Availability %</h4><canvas id="factoryAvailChart" height="160"></canvas></div>
            <div class="chart-box"><h4>Performance %</h4><canvas id="factoryPerfChart" height="160"></canvas></div>
            <div class="chart-box"><h4>Quality %</h4><canvas id="factoryQualChart" height="160"></canvas></div>
            <div class="chart-box"><h4>OEE % Trend</h4><canvas id="factoryOEEChart" height="160"></canvas></div>
        </div>
    </div>

    <!-- LINE WISE CARDS WITH DOUGHNUTS -->
    <div id="cardsContainer" class="cards-grid"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzREGDC03uDNfgswSy49bMwGtlzok9fiT2Ro1w78JwfmPTp93hhmFnaSRz0pmE3mXJrXA/exec";
        
        let globalMachines = [];
        let globalLogs = [];
        let chartInstances = {};

        function getSafeVal(obj, possibleKeys) {
            let lowerKeys = possibleKeys.map(k => k.toLowerCase().replace(/\s/g, ''));
            for(let key in obj) { if(lowerKeys.includes(key.toLowerCase().replace(/\s/g, ''))) return obj[key]; }
            return "";
        }

        window.onload = function() {
            let today = new Date().toISOString().split('T')[0];
            document.getElementById("dateFilter").value = today;

            fetchData();
            setInterval(() => { fetchData(true); }, 5000);
        };

        function fetchData(isSilent = false) {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    globalMachines = data.machines || [];
                    globalLogs = data.logs || [];
                    if(!isSilent) populateLines();
                    renderDashboard();
                })
                .catch(err => console.error("Error fetching live data:", err));
        }

        function populateLines() {
            const lineSelect = document.getElementById("lineFilter");
            let currentVal = lineSelect.value;
            let lines = [...new Set(globalMachines.map(m => getSafeVal(m, ["LineName", "Line"])))].filter(Boolean);
            
            lineSelect.innerHTML = '<option value="">-- All Lines (Entire Factory Overview) --</option>';
            lines.forEach(l => {
                let opt = document.createElement("option");
                opt.value = l; opt.innerText = l;
                lineSelect.appendChild(opt);
            });
            lineSelect.value = currentVal;
        }

        function renderDashboard() {
            const selectedLine = document.getElementById("lineFilter").value;
            const selectedDate = document.getElementById("dateFilter").value;
            const selectedShift = document.getElementById("shiftFilter").value;
            
            const overviewSection = document.getElementById("factoryOverviewSection");
            const cardsContainer = document.getElementById("cardsContainer");
            cardsContainer.innerHTML = "";

            let targetMachines = globalMachines;
            if (selectedLine) {
                targetMachines = globalMachines.filter(m => getSafeVal(m, ["LineName", "Line"]) === selectedLine);
            }

            if (targetMachines.length === 0) {
                cardsContainer.innerHTML = `<div class="no-data">No machines found for this criteria.</div>`;
                overviewSection.style.display = "none";
                return;
            }

            let machineMetrics = [];
            let shopTotalOEE = 0;

            targetMachines.forEach((mach, index) => {
                let assetNum = getSafeVal(mach, ["AssetNumber", "Barcode"]);
                let machName = getSafeVal(mach, ["MachineName", "Machine"]);
                let operation = getSafeVal(mach, ["Operation"]);
                let prodName = getSafeVal(mach, ["ProductName", "Product"]);
                let idealCT = parseFloat(getSafeVal(mach, ["IdealCT", "Target"])) || 1;

                let machLogs = globalLogs.filter(l => {
                    let logAsset = String(getSafeVal(l, ["Barcode#", "Barcode", "AssetNumber"])).trim();
                    if (logAsset !== String(assetNum).trim()) return false;

                    let rawDate = getSafeVal(l, ["Timestamp", "Date"]);
                    if (selectedDate && rawDate) {
                        let logDateStr = new Date(rawDate).toISOString().split('T')[0];
                        if (logDateStr !== selectedDate) return false;
                    }

                    if (selectedShift) {
                        let logShift = String(getSafeVal(l, ["Shift"])).trim().toLowerCase();
                        if (logShift !== selectedShift.toLowerCase()) return false;
                    }
                    return true;
                });

                let totalActual = 0, totalGood = 0, totalDowntime = 0;
                machLogs.forEach(l => {
                    let type = String(getSafeVal(l, ["EntryType", "Type"])).trim().toLowerCase();
                    if(type.includes("performance") || type.includes("production")) {
                        totalActual = Math.max(totalActual, parseFloat(getSafeVal(l, ["TotalCount", "Actual"])) || 0);
                    }
                    if(type.includes("quality")) {
                        totalGood = Math.max(totalGood, parseFloat(getSafeVal(l, ["GoodCount", "GoodParts"])) || 0);
                    }
                    if(type.includes("availability") || type.includes("maintenance")) {
                        totalDowntime = Math.max(totalDowntime, parseFloat(getSafeVal(l, ["Downtime(Min)", "Downtime"])) || 0);
                    }
                });

                let plannedTime = 480;
                let runTime = Math.max(0, plannedTime - totalDowntime);
                let availability = (runTime / plannedTime) * 100;
                let performance = runTime > 0 ? ((totalActual * idealCT) / runTime) * 100 : 0;
                let quality = totalActual > 0 ? (totalGood / totalActual) * 100 : 0;
                let oee = (availability / 100) * (performance / 100) * (quality / 100) * 100;
                if(isNaN(oee)) oee = 0;

                shopTotalOEE += oee;

                machineMetrics.push({
                    id: index,
                    name: machName || 'Machine',
                    asset: assetNum,
                    operation: operation || 'Operation',
                    product: prodName || 'N/A',
                    actual: totalActual,
                    good: totalGood,
                    downtime: totalDowntime,
                    avail: availability > 100 ? 100 : availability,
                    perf: performance > 100 ? 100 : performance,
                    qual: quality > 100 ? 100 : quality,
                    oee: oee
                });
            });

            if(machineMetrics.length > 0) {
                document.getElementById("kpiOEE").innerText = (shopTotalOEE / machineMetrics.length).toFixed(1) + "%";
            }

            if (!selectedLine) {
                overviewSection.style.display = "block";
                cardsContainer.style.display = "none";
                renderFactoryCharts(machineMetrics);
            } else {
                overviewSection.style.display = "none";
                cardsContainer.style.display = "grid";
                
                machineMetrics.forEach(m => {
                    let card = document.createElement("div");
                    card.className = "op-card";
                    card.innerHTML = `
                        <h3>${m.operation}</h3>
                        <div class="machine-sub">Mach: ${m.name} (${m.asset})<br>Product: ${m.product}</div>
                        <div class="metric-row"><span>Produced:</span><span>${m.actual} parts</span></div>
                        <div class="metric-row"><span>Good Parts:</span><span>${m.good} parts</span></div>
                        <div class="metric-row"><span>Downtime:</span><span>${m.downtime} mins</span></div>
                        
                        <div class="card-charts-container">
                            <div class="mini-doughnut-box">
                                <span>A-P-Q Mix</span>
                                <canvas id="doughnutAPQ_${m.id}" height="80"></canvas>
                            </div>
                            <div class="mini-doughnut-box">
                                <span>MTTR / MTBF</span>
                                <canvas id="doughnutMM_${m.id}" height="80"></canvas>
                            </div>
                        </div>

                        <div class="oee-badge">OEE: ${m.oee.toFixed(1)}%</div>
                    `;
                    cardsContainer.appendChild(card);

                    // Render Mini Doughnut 1: Availability, Performance, Quality (3 Different Colors)
                    setTimeout(() => {
                        createMiniDoughnut(`doughnutAPQ_${m.id}`, [m.avail, m.perf, m.qual], ['#38bdf8', '#4ade80', '#f43f5e'], ['Avail', 'Perf', 'Qual']);
                        createMiniDoughnut(`doughnutMM_${m.id}`, [18, 135], ['#fbbf24', '#a855f7'], ['MTTR', 'MTBF']);
                    }, 50);
                });
            }
        }

        function createMiniDoughnut(canvasId, values, colors, labels) {
            const ctx = document.getElementById(canvasId);
            if(!ctx) return;
            if (chartInstances[canvasId]) chartInstances[canvasId].destroy();
            
            chartInstances[canvasId] = new Chart(ctx.getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: true } },
                    cutout: '65%'
                }
            });
        }

        function renderFactoryCharts(data) {
            let labels = data.map(d => d.name + " (" + d.asset + ")");
            createOrUpdateChart('factoryAvailChart', 'bar', labels, data.map(d => d.avail), 'Availability %', '#38bdf8');
            createOrUpdateChart('factoryPerfChart', 'bar', labels, data.map(d => d.perf), 'Performance %', '#4ade80');
            createOrUpdateChart('factoryQualChart', 'bar', labels, data.map(d => d.qual), 'Quality %', '#f43f5e');
            createOrUpdateChart('factoryOEEChart', 'line', labels, data.map(d => d.oee), 'OEE % Trend', '#fbbf24');
        }

        function createOrUpdateChart(canvasId, type, labels, dataValues, labelName, color) {
            const ctx = document.getElementById(canvasId).getContext('2d');
            if (chartInstances[canvasId]) chartInstances[canvasId].destroy();
            chartInstances[canvasId] = new Chart(ctx, {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{ label: labelName, data: dataValues, backgroundColor: color, borderColor: color, borderWidth: 2, tension: 0.2 }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, max: 100, grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                        x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 9 } } }
                    }
                }
            });
        }
    </script>
</body>
</html>
