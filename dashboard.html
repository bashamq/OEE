<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .header { text-align: center; background: #2c3e50; color: #f1c40f; padding: 20px; border-radius: 8px; margin-bottom: 20px; border-bottom: 5px solid #e74c3c; }
        .header h1 { margin: 0; font-size: 28px; color: white;}
        .controls { text-align: center; margin-bottom: 20px; }
        select { padding: 10px; font-size: 16px; border-radius: 5px; width: 350px; border: 1px solid #ccc; font-weight: bold; }
        
        .progress-wrapper { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 30px; border-left: 5px solid #27ae60; display: none; }
        .progress-header { display: flex; justify-content: space-between; }
        .progress-text { font-size: 18px; font-weight: bold; }
        .progress-bar-bg { background: #ecf0f1; border-radius: 10px; height: 30px; width: 100%; margin-top: 15px; position: relative; }
        .progress-fill { background: #27ae60; height: 100%; width: 0%; transition: 0.8s; display: flex; align-items: center; justify-content: flex-end; padding-right: 10px; color: white; font-weight: bold; border-radius: 10px; }
        
        .cards { display: flex; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 15%; text-align: center; min-width: 140px; border-top: 4px solid #3498db; }
        .card h3 { margin: 0 0 10px 0; color: #34495e; font-size: 14px; }
        .card .value { font-size: 24px; font-weight: bold; color: #27ae60; }
        
        .charts-wrapper { display: flex; justify-content: space-between; flex-wrap: wrap; }
        .chart-container { width: 48%; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; box-sizing: border-box; }
        .loading { text-align: center; font-size: 18px; color: #2980b9; font-weight: bold; margin-top: 50px; }
        @media (max-width: 900px) { .chart-container { width: 100%; } .card { width: 30%; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>Manufacturing Excellence Dashboard</h1>
        <p style="color: #bdc3c7; margin-top:5px;">Target vs Actual, OEE, MTTR & MTBF</p>
    </div>

    <div class="controls">
        <label><strong>Select View: </strong></label>
        <select id="viewSelect" onchange="calculateDashboard()">
            <option value="All">🏭 Factory Aggregate (All Lines)</option>
        </select>
    </div>

    <div id="loadingMsg" class="loading">Fetching Data... Please wait.</div>

    <div class="progress-wrapper" id="progressDiv">
        <div class="progress-header">
            <h3>Monthly Target Progress</h3>
            <div class="progress-text" id="targetText">0 / 0 (0%)</div>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-fill" id="targetFill" style="width: 0%;">0%</div>
        </div>
    </div>

    <div class="cards" id="dashboardCards" style="display:none;">
        <div class="card"><h3>OEE</h3><div class="value" id="valOEE">0%</div></div>
        <div class="card"><h3>Availability</h3><div class="value" id="valA">0%</div></div>
        <div class="card"><h3>Performance</h3><div class="value" id="valP">0%</div></div>
        <div class="card"><h3>Quality</h3><div class="value" id="valQ">0%</div></div>
        <div class="card"><h3>MTTR (Min)</h3><div class="value" style="color:#8e44ad;" id="valMTTR">0</div></div>
        <div class="card"><h3>MTBF (Min)</h3><div class="value" style="color:#16a085;" id="valMTBF">0</div></div>
    </div>

    <div class="charts-wrapper" id="chartDiv" style="display:none;">
        <div class="chart-container"><canvas id="oeeChart"></canvas></div>
        <div class="chart-container"><canvas id="downtimeChart"></canvas></div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyRkmh4_ofJjAftObCfnX9gmhqCa4xcsvSp143BXCUdQujfy4gaFkBMlEhsVrwa61HugQ/exec";
        let allLogs = [], allTargets = [], allMachines = [], machineMap = {};
        let oeeChartInstance = null, downtimeChartInstance = null;

        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                allLogs = data.logs || []; allTargets = data.targets || []; allMachines = data.machines || [];
                allMachines.forEach(m => machineMap[String(m["Asset Number"])] = m);
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('progressDiv').style.display = 'block';
                document.getElementById('dashboardCards').style.display = 'flex';
                document.getElementById('chartDiv').style.display = 'flex';
                populateDropdown(); calculateDashboard();
            }).catch(e => { document.getElementById('loadingMsg').innerText = "Error loading data."; });

        function populateDropdown() {
            const select = document.getElementById("viewSelect");
            let uniqueLines = [...new Set(allMachines.map(m => m["Line Name"]))].filter(Boolean);
            let optGroupLine = document.createElement("optgroup"); optGroupLine.label = "Lines";
            uniqueLines.forEach(l => { let o = document.createElement("option"); o.value = "Line:"+l; o.innerText = "🛠️ Line: "+l; optGroupLine.appendChild(o); });
            select.appendChild(optGroupLine);
            let optGroupMachine = document.createElement("optgroup"); optGroupMachine.label = "Machines";
            allMachines.forEach(m => { let o = document.createElement("option"); o.value = "Machine:"+m["Asset Number"]; o.innerText = "⚙️ "+m["Machine Name"]; optGroupMachine.appendChild(o); });
            select.appendChild(optGroupMachine);
        }

        function getLatestTarget(lineName) {
            let trgs = allTargets.filter(t => t["Line Name"] === lineName);
            return trgs.length ? Number(trgs[trgs.length - 1]["Target Qty"]) : 0;
        }

        function calculateDashboard() {
            let sel = document.getElementById("viewSelect").value;
            let fLogs = [], trg = 0;

            if (sel === "All") {
                fLogs = allLogs;
                [...new Set(allMachines.map(m => m["Line Name"]))].forEach(l => trg += getLatestTarget(l));
            } else if (sel.startsWith("Line:")) {
                let l = sel.split(":")[1]; trg = getLatestTarget(l);
                fLogs = allLogs.filter(log => machineMap[String(log["Barcode #"])]?.["Line Name"] === l);
            } else if (sel.startsWith("Machine:")) {
                let a = sel.split(":")[1]; fLogs = allLogs.filter(log => String(log["Barcode #"]) === a);
                trg = machineMap[a] ? getLatestTarget(machineMap[a]["Line Name"]) : 0;
            }

            let pt = 0, dt = 0, it = 0, g = 0, r = 0, dtC = 0, dtR = {};
            fLogs.forEach(row => {
                if (row["Entry Type"] === "Production") { pt += Number(row["Planned Time (Min)"])||0; it += (Number(row["Ideal CT (Min)"])||0)*(Number(row["Total Count"])||0); }
                else if (row["Entry Type"] === "Maintenance") { let d = Number(row["Downtime (Min)"])||0; if(d>0){ dt+=d; dtC++; let rn = row["Maint. Reason"]||"N/A"; dtR[rn]=(dtR[rn]||0)+d; } }
                else if (row["Entry Type"] === "Quality") { g += Number(row["Good Count"])||0; r += Number(row["Scrap Count"])||0; }
            });

            let pct = trg > 0 ? (g/trg)*100 : 0; if(pct>100) pct=100;
            document.getElementById("targetText").innerText = `${g} / ${trg} (${pct.toFixed(1)}%)`;
            document.getElementById("targetFill").style.width = `${pct}%`;
            document.getElementById("targetFill").innerText = `${pct.toFixed(1)}%`;
            document.getElementById("targetFill").style.backgroundColor = pct<50?"#e74c3c":pct<85?"#f1c40f":"#27ae60";

            let rt = pt - dt; if(rt<0) rt=0;
            let a = pt>0?rt/pt:0, p = rt>0?it/rt:0, q = (g+r)>0?g/(g+r):0;
            if(p>1) p=1; let oee = a*p*q;

            document.getElementById("valOEE").innerText = (oee*100).toFixed(1)+"%";
            document.getElementById("valA").innerText = (a*100).toFixed(1)+"%";
            document.getElementById("valP").innerText = (p*100).toFixed(1)+"%";
            document.getElementById("valQ").innerText = (q*100).toFixed(1)+"%";
            document.getElementById("valMTTR").innerText = dtC>0?(dt/dtC).toFixed(1):0;
            document.getElementById("valMTBF").innerText = dtC>0?(rt/dtC).toFixed(1):rt.toFixed(1);

            let sDt = Object.keys(dtR).map(k => ({r:k, t:dtR[k]})).sort((x,y)=>y.t-x.t);
            updateCharts(a*100, p*100, q*100, oee*100, sDt.map(i=>i.r), sDt.map(i=>i.t));
        }

        function updateCharts(a, p, q, o, l, d) {
            if (oeeChartInstance) oeeChartInstance.destroy();
            oeeChartInstance = new Chart(document.getElementById('oeeChart'), { type: 'bar', data: { labels: ['A', 'P', 'Q', 'OEE'], datasets: [{ data: [a, p, q, o], backgroundColor: ['#3498db', '#f1c40f', '#e74c3c', '#2c3e50'] }] }, options: { scales: { y: { max: 100 } }, plugins: { legend: { display: false } } } });
            if (downtimeChartInstance) downtimeChartInstance.destroy();
            downtimeChartInstance = new Chart(document.getElementById('downtimeChart'), { type: 'bar', data: { labels: l, datasets: [{ data: d, backgroundColor: '#95a5a6' }] }, options: { indexAxis: 'y', plugins: { legend: { display: false } } } });
        }
    </script>
</body>
</html>
