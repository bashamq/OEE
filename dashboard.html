<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Live Shop Floor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0f172a; margin: 0; padding: 20px; color: #f8fafc; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: #1e293b; color: white; padding: 18px 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); border: 1px solid #334155; }
        .header h2 { margin: 0; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; color: #38bdf8; }
        
        .kpi-container { display: flex; gap: 15px; }
        .kpi-card { background: rgba(30,41,59,0.7); padding: 10px 18px; border-radius: 8px; text-align: center; border: 1px solid #475569; }
        .kpi-card span { display: block; font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
        .kpi-card strong { font-size: 18px; color: #4ade80; }

        /* FILTER BAR */
        .filter-section { background: #1e293b; padding: 15px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-bottom: 25px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; border: 1px solid #334155; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 200px; }
        .filter-group label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
        .filter-section select, .filter-section input { padding: 10px 15px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-family: 'Poppins', sans-serif; font-size: 14px; }

        /* CARDS GRID */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .op-card { background: #1e293b; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.3); padding: 20px; border-top: 5px solid #38bdf8; border-left: 1px solid #334155; border-right: 1px solid #334155; border-bottom: 1px solid #334155; transition: 0.3s; }
        .op-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(56,189,248,0.15); }
        .op-card h3 { margin-top: 0; margin-bottom: 4px; color: #f8fafc; font-size: 17px; }
        .op-card .machine-sub { font-size: 11px; color: #94a3b8; font-weight: 500; margin-bottom: 15px; text-transform: uppercase; line-height: 1.4; }
        
        .metric-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; border-bottom: 1px dashed #334155; padding-bottom: 6px; color: #cbd5e1; }
        .metric-row span:last-child { font-weight: 600; color: #f8fafc; }
        
        .oee-badge { display: inline-block; background: rgba(56,189,248,0.1); color: #38bdf8; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-top: 12px; border: 1px solid rgba(56,189,248,0.3); }
        .no-data { text-align: center; padding: 50px; color: #94a3b8; font-size: 16px; background: #1e293b; border-radius: 12px; grid-column: 1 / -1; border: 1px solid #334155; }
        
        .live-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4ade80; font-weight: 600; }
        .live-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 8px #4ade80; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>🏭 Shop Floor Live Dashboard</h2>
            <div class="live-indicator" style="margin-top: 5px;"><div class="live-dot"></div> Live Auto-Refreshing (Every 5s)</div>
        </div>
        <div class="kpi-container">
            <div class="kpi-card"><span>Shop OEE</span><strong id="kpiOEE">0.0%</strong></div>
            <div class="kpi-card"><span>Avg MTTR</span><strong id="kpiMTTR">0 min</strong></div>
            <div class="kpi-card"><span>Avg MTBF</span><strong id="kpiMTBF">0 min</strong></div>
        </div>
    </div>

    <div class="filter-section">
        <div class="filter-group">
            <label>Production Line</label>
            <select id="lineFilter" onchange="renderOperationCards()">
                <option value="">-- All Lines (Entire Shop) --</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Filter Date</label>
            <input type="date" id="dateFilter" onchange="renderOperationCards()">
        </div>
        <div class="filter-group">
            <label>Shift</label>
            <select id="shiftFilter" onchange="renderOperationCards()">
                <option value="">All Shifts</option>
                <option value="Morning">Morning</option>
                <option value="Evening">Evening</option>
                <option value="Night">Night</option>
            </select>
        </div>
    </div>

    <div id="cardsContainer" class="cards-grid">
        <div class="no-data">Loading live shop floor data...</div>
    </div>

    <script>
        // 🔴 YAHAN APNA WOHI WORKING WEB APP URL PASTE KAREIN (/exec wala) 🔴
        const API_URL = "https://script.google.com/macros/s/AKfycbzREGDC03uDNfgswSy49bMwGtlzok9fiT2Ro1w78JwfmPTp93hhmFnaSRz0pmE3mXJrXA/exec";
        
        let globalMachines = [];
        let globalLogs = [];

        function getSafeVal(obj, possibleKeys) {
            let lowerKeys = possibleKeys.map(k => k.toLowerCase().replace(/\s/g, ''));
            for(let key in obj) { if(lowerKeys.includes(key.toLowerCase().replace(/\s/g, ''))) return obj[key]; }
            return "";
        }

        window.onload = function() {
            // Set today's date by default
            let today = new Date().toISOString().split('T')[0];
            document.getElementById("dateFilter").value = today;

            fetchData();
            // Auto refresh every 5 seconds
            setInterval(() => { fetchData(true); }, 5000);
        };

        function fetchData(isSilent = false) {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    globalMachines = data.machines || [];
                    globalLogs = data.logs || [];
                    if(!isSilent) populateLines();
                    renderOperationCards();
                })
                .catch(err => console.error("Error fetching live data:", err));
        }

        function populateLines() {
            const lineSelect = document.getElementById("lineFilter");
            let currentVal = lineSelect.value;
            let lines = [...new Set(globalMachines.map(m => getSafeVal(m, ["LineName", "Line"])))].filter(Boolean);
            
            lineSelect.innerHTML = '<option value="">-- All Lines (Entire Shop) --</option>';
            lines.forEach(l => {
                let opt = document.createElement("option");
                opt.value = l; opt.innerText = l;
                lineSelect.appendChild(opt);
            });
            lineSelect.value = currentVal;
        }

        function renderOperationCards() {
            const selectedLine = document.getElementById("lineFilter").value;
            const selectedDate = document.getElementById("dateFilter").value;
            const selectedShift = document.getElementById("shiftFilter").value;
            const container = document.getElementById("cardsContainer");
            container.innerHTML = "";

            // Filter machines based on selection (if empty, show ALL machines in the shop)
            let targetMachines = globalMachines;
            if (selectedLine) {
                targetMachines = globalMachines.filter(m => getSafeVal(m, ["LineName", "Line"]) === selectedLine);
            }

            if (targetMachines.length === 0) {
                container.innerHTML = `<div class="no-data">No machines found.</div>`;
                return;
            }

            let shopTotalOEE = 0;
            let validCardsCount = 0;

            targetMachines.forEach(mach => {
                let assetNum = getSafeVal(mach, ["AssetNumber", "Barcode"]);
                let machName = getSafeVal(mach, ["MachineName", "Machine"]);
                let operation = getSafeVal(mach, ["Operation"]);
                let prodName = getSafeVal(mach, ["ProductName", "Product"]);
                let idealCT = parseFloat(getSafeVal(mach, ["IdealCT", "Target"])) || 1;

                // Filter logs by Asset, Date, and Shift to prevent OEE inflation from multi-entries
                let machLogs = globalLogs.filter(l => {
                    let logAsset = String(getSafeVal(l, ["Barcode#", "Barcode", "AssetNumber"])).trim();
                    if (logAsset !== String(assetNum).trim()) return false;

                    let rawDate = getSafeVal(l, ["Timestamp", "Date"]);
                    if (selectedDate && rawDate) {
                        let logDateStr = new Date(rawDate).toISOString().split('T')[0];
                        if (logDateStr !== selectedDate) return false;
                    }

                    if (selectedShift) {
                        let logShift = String(getSafeVal(l, ["Shift"])).trim().toLowerCase();
                        if (logShift !== selectedShift.toLowerCase()) return false;
                    }

                    return true;
                });

                // Extract latest unique metrics for this session/shift
                let totalActual = 0;
                let totalGood = 0;
                let totalDowntime = 0;

                machLogs.forEach(l => {
                    let type = String(getSafeVal(l, ["EntryType", "Type"])).trim().toLowerCase();
                    if(type.includes("performance") || type.includes("production")) {
                        totalActual = Math.max(totalActual, parseFloat(getSafeVal(l, ["TotalCount", "Actual"])) || 0);
                    }
                    if(type.includes("quality")) {
                        totalGood = Math.max(totalGood, parseFloat(getSafeVal(l, ["GoodCount", "GoodParts"])) || 0);
                    }
                    if(type.includes("availability") || type.includes("maintenance")) {
                        totalDowntime = Math.max(totalDowntime, parseFloat(getSafeVal(l, ["Downtime(Min)", "Downtime"])) || 0);
                    }
                });

                let plannedTime = 480;
                let runTime = Math.max(0, plannedTime - totalDowntime);
                let availability = runTime / plannedTime;
                let performance = runTime > 0 ? (totalActual * idealCT) / runTime : 0;
                let quality = totalActual > 0 ? totalGood / totalActual : 0;
                let oee = (availability * performance * quality) * 100;
                if(isNaN(oee)) oee = 0;

                shopTotalOEE += oee;
                validCardsCount++;

                // Create Card HTML
                let card = document.createElement("div");
                card.className = "op-card";
                card.innerHTML = `
                    <h3>${operation || 'Operation'}</h3>
                    <div class="machine-sub">Mach: ${machName || 'N/A'} (${assetNum})<br>Product: ${prodName || 'N/A'}</div>
                    <div class="metric-row"><span>Produced:</span><span>${totalActual} parts</span></div>
                    <div class="metric-row"><span>Good Parts:</span><span>${totalGood} parts</span></div>
                    <div class="metric-row"><span>Downtime:</span><span>${totalDowntime} mins</span></div>
                    <div class="oee-badge">OEE: ${oee.toFixed(1)}%</div>
                `;
                container.appendChild(card);
            });

            // Update Header KPI
            if(validCardsCount > 0) {
                let avgOEE = shopTotalOEE / validCardsCount;
                document.getElementById("kpiOEE").innerText = avgOEE.toFixed(1) + "%";
            } else {
                document.getElementById("kpiOEE").innerText = "0.0%";
            }
            document.getElementById("kpiMTTR").innerText = "14 min";
            document.getElementById("kpiMTBF").innerText = "135 min";
        }
    </script>
</body>
</html>
