<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Live Shop Floor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #0b131d; margin: 0; padding: 20px; color: #f8fafc; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: #131f2e; color: white; padding: 18px 25px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #1e293b; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .header h2 { margin: 0; font-size: 22px; text-transform: uppercase; color: #38bdf8; }
        
        .kpi-container { display: flex; gap: 15px; }
        .kpi-card { background: rgba(19,31,46,0.8); padding: 10px 18px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
        .kpi-card span { display: block; font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .kpi-card strong { font-size: 18px; color: #4ade80; }

        /* FILTER BAR */
        .filter-section { background: #131f2e; padding: 15px 20px; border-radius: 12px; margin-bottom: 25px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; border: 1px solid #1e293b; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 200px; }
        .filter-group label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
        .filter-section select, .filter-section input { padding: 10px 15px; border-radius: 8px; border: 1px solid #334155; background: #0b131d; color: white; font-family: 'Poppins', sans-serif; font-size: 14px; }

        /* SCADA STYLE CARDS GRID (AS IN YOUR REFERENCE PICTURE) */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .scada-card { background: #131f2e; border-radius: 14px; padding: 22px; border: 1px solid #1e293b; box-shadow: 0 8px 25px rgba(0,0,0,0.5); text-align: center; transition: 0.3s; }
        .scada-card:hover { transform: translateY(-4px); border-color: #38bdf8; }
        
        .scada-title { font-size: 20px; font-weight: 700; color: #f8fafc; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .order-box { background: #0b131d; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #1e293b; }
        .order-box span { display: block; font-size: 11px; color: #38bdf8; text-transform: uppercase; font-weight: 600; }
        .order-box strong { font-size: 14px; color: #e2e8f0; font-weight: 500; }
        
        .oee-display { margin: 15px 0; }
        .oee-display span { display: block; font-size: 11px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .oee-display h1 { margin: 5px 0; font-size: 38px; font-weight: 700; color: #38bdf8; }

        /* METRICS CIRCLES ROW */
        .metrics-row { display: flex; justify-content: space-around; margin: 20px 0; background: #0b131d; padding: 12px; border-radius: 10px; border: 1px solid #1e293b; }
        .metric-item { text-align: center; width: 70px; }
        .metric-item span { display: block; font-size: 10px; color: #94a3b8; text-transform: uppercase; margin-top: 5px; font-weight: 600; }
        .metric-item strong { font-size: 13px; color: #4ade80; }

        /* PROCESS STEPS ROW */
        .steps-box { margin-top: 15px; background: #0b131d; padding: 12px; border-radius: 10px; border: 1px solid #1e293b; }
        .steps-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 600; margin-bottom: 8px; display: block; }
        .steps-row { display: flex; justify-content: center; gap: 10px; }
        .step-bubble { width: 32px; height: 32px; border-radius: 50%; background: #1e293b; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; border: 1px solid #334155; }
        .step-bubble.active { background: rgba(74,222,128,0.2); color: #4ade80; border-color: #4ade80; box-shadow: 0 0 10px rgba(74,222,128,0.3); }

        .no-data { text-align: center; padding: 50px; color: #94a3b8; font-size: 16px; background: #131f2e; border-radius: 12px; grid-column: 1 / -1; }
        .live-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4ade80; font-weight: 600; }
        .live-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>🏭 Shop Floor SCADA Dashboard</h2>
            <div class="live-indicator" style="margin-top: 5px;"><div class="live-dot"></div> Live Auto-Refreshing (Every 5s)</div>
        </div>
        <div class="kpi-container">
            <div class="kpi-card"><span>Shop OEE</span><strong id="kpiOEE">0.0%</strong></div>
            <div class="kpi-card"><span>Avg MTTR</span><strong id="kpiMTTR">14 min</strong></div>
            <div class="kpi-card"><span>Avg MTBF</span><strong id="kpiMTBF">135 min</strong></div>
        </div>
    </div>

    <div class="filter-section">
        <div class="filter-group">
            <label>Production Line View</label>
            <select id="lineFilter" onchange="renderDashboard()">
                <option value="">-- All Lines (Factory Overview) --</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Filter Date</label>
            <input type="date" id="dateFilter" onchange="renderDashboard()">
        </div>
        <div class="filter-group">
            <label>Shift</label>
            <select id="shiftFilter" onchange="renderDashboard()">
                <option value="">All Shifts</option>
                <option value="Morning">Morning</option>
                <option value="Evening">Evening</option>
                <option value="Night">Night</option>
            </select>
        </div>
    </div>

    <div id="cardsContainer" class="cards-grid"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzREGDC03uDNfgswSy49bMwGtlzok9fiT2Ro1w78JwfmPTp93hhmFnaSRz0pmE3mXJrXA/exec";
        
        let globalMachines = [];
        let globalLogs = [];

        function getSafeVal(obj, possibleKeys) {
            let lowerKeys = possibleKeys.map(k => k.toLowerCase().replace(/\s/g, ''));
            for(let key in obj) { if(lowerKeys.includes(key.toLowerCase().replace(/\s/g, ''))) return obj[key]; }
            return "";
        }

        window.onload = function() {
            let today = new Date().toISOString().split('T')[0];
            document.getElementById("dateFilter").value = today;
            fetchData();
            setInterval(() => { fetchData(true); }, 5000);
        };

        function fetchData(isSilent = false) {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    globalMachines = data.machines || [];
                    globalLogs = data.logs || [];
                    if(!isSilent) populateLines();
                    renderDashboard();
                })
                .catch(err => console.error("Error fetching live data:", err));
        }

        function populateLines() {
            const lineSelect = document.getElementById("lineFilter");
            let currentVal = lineSelect.value;
            let lines = [...new Set(globalMachines.map(m => getSafeVal(m, ["LineName", "Line"])))].filter(Boolean);
            
            lineSelect.innerHTML = '<option value="">-- All Lines (Factory Overview) --</option>';
            lines.forEach(l => {
                let opt = document.createElement("option");
                opt.value = l; opt.innerText = l;
                lineSelect.appendChild(opt);
            });
            lineSelect.value = currentVal;
        }

        function renderDashboard() {
            const selectedLine = document.getElementById("lineFilter").value;
            const selectedDate = document.getElementById("dateFilter").value;
            const selectedShift = document.getElementById("shiftFilter").value;
            const container = document.getElementById("cardsContainer");
            container.innerHTML = "";

            let linesToProcess = [];
            let isLineSpecific = selectedLine !== "";

            if (!isLineSpecific) {
                // ALL LINES VIEW: Get unique lines
                linesToProcess = [...new Set(globalMachines.map(m => getSafeVal(m, ["LineName", "Line"])))].filter(Boolean);
            } else {
                // SPECIFIC LINE VIEW: Get operations/machines inside this line
                linesToProcess = globalMachines.filter(m => getSafeVal(m, ["LineName", "Line"]) === selectedLine);
            }

            if (linesToProcess.length === 0) {
                container.innerHTML = `<div class="no-data">No production data found for this selection.</div>`;
                return;
            }

            let totalShopOEE = 0;
            let cardCount = 0;

            if (!isLineSpecific) {
                // RENDER LINE CARDS FOR ALL LINES
                linesToProcess.forEach(lineName => {
                    let lineMachs = globalMachines.filter(m => getSafeVal(m, ["LineName", "Line"]) === lineName);
                    let lineStats = calculateStatsForGroup(lineMachs, selectedDate, selectedShift);
                    
                    totalShopOEE += lineStats.oee;
                    cardCount++;

                    let card = document.createElement("div");
                    card.className = "scada-card";
                    card.innerHTML = `
                        <div class="scada-title">${lineName}</div>
                        <div class="order-box">
                            <span>Current Product / Order</span>
                            <strong>${lineStats.productName}</strong>
                        </div>
                        <div class="oee-display">
                            <span>OEE Performance</span>
                            <h1>${lineStats.oee.toFixed(1)}%</h1>
                        </div>
                        <div class="metrics-row">
                            <div class="metric-item"><strong>${lineStats.qual.toFixed(0)}%</strong><span>Quality</span></div>
                            <div class="metric-item"><strong>${lineStats.perf.toFixed(0)}%</strong><span>Perf</span></div>
                            <div class="metric-item"><strong>${lineStats.avail.toFixed(0)}%</strong><span>Avail</span></div>
                        </div>
                        <div class="steps-box">
                            <span class="steps-title">Process Step Status</span>
                            <div class="steps-row">
                                <div class="step-bubble active">1</div>
                                <div class="step-bubble">2</div>
                                <div class="step-bubble">3</div>
                                <div class="step-bubble">4</div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                // RENDER OPERATION / MACHINE CARDS FOR SELECTED LINE
                linesToProcess.forEach((mach, index) => {
                    let machStats = calculateStatsForGroup([mach], selectedDate, selectedShift);
                    totalShopOEE += machStats.oee;
                    cardCount++;

                    let activeStep = (index % 4) + 1; // Simulated active process step 1 to 4

                    let card = document.createElement("div");
                    card.className = "scada-card";
                    card.innerHTML = `
                        <div class="scada-title">${machStats.operation}</div>
                        <div class="order-box">
                            <span>Machine: ${machStats.machName} (${machStats.asset})</span>
                            <strong>Product: ${machStats.productName}</strong>
                        </div>
                        <div class="oee-display">
                            <span>Operation OEE</span>
                            <h1>${machStats.oee.toFixed(1)}%</h1>
                        </div>
                        <div class="metrics-row">
                            <div class="metric-item"><strong>${machStats.qual.toFixed(0)}%</strong><span>Quality</span></div>
                            <div class="metric-item"><strong>${machStats.perf.toFixed(0)}%</strong><span>Perf</span></div>
                            <div class="metric-item"><strong>${machStats.avail.toFixed(0)}%</strong><span>Avail</span></div>
                        </div>
                        <div class="steps-box">
                            <span class="steps-title">Process Step Sequence</span>
                            <div class="steps-row">
                                <div class="step-bubble ${activeStep === 1 ? 'active' : ''}">1</div>
                                <div class="step-bubble ${activeStep === 2 ? 'active' : ''}">2</div>
                                <div class="step-bubble ${activeStep === 3 ? 'active' : ''}">3</div>
                                <div class="step-bubble ${activeStep === 4 ? 'active' : ''}">4</div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            if(cardCount > 0) {
                document.getElementById("kpiOEE").innerText = (totalShopOEE / cardCount).toFixed(1) + "%";
            }
        }

        function calculateStatsForGroup(machinesArray, selectedDate, selectedShift) {
            let totalActual = 0, totalGood = 0, totalDowntime = 0;
            let assetList = machinesArray.map(m => String(getSafeVal(m, ["AssetNumber", "Barcode"])).trim());
            let sampleMach = machinesArray[0] || {};

            let groupLogs = globalLogs.filter(l => {
                let logAsset = String(getSafeVal(l, ["Barcode#", "Barcode", "AssetNumber"])).trim();
                if (!assetList.includes(logAsset)) return false;

                let rawDate = getSafeVal(l, ["Timestamp", "Date"]);
                if (selectedDate && rawDate) {
                    let logDateStr = new Date(rawDate).toISOString().split('T')[0];
                    if (logDateStr !== selectedDate) return false;
                }
                if (selectedShift) {
                    let logShift = String(getSafeVal(l, ["Shift"])).trim().toLowerCase();
                    if (logShift !== selectedShift.toLowerCase()) return false;
                }
                return true;
            });

            groupLogs.forEach(l => {
                let type = String(getSafeVal(l, ["EntryType", "Type"])).trim().toLowerCase();
                if(type.includes("performance") || type.includes("production")) {
                    totalActual += parseFloat(getSafeVal(l, ["TotalCount", "Actual"])) || 0;
                }
                if(type.includes("quality")) {
                    totalGood += parseFloat(getSafeVal(l, ["GoodCount", "GoodParts"])) || 0;
                }
                if(type.includes("availability") || type.includes("maintenance")) {
                    totalDowntime += parseFloat(getSafeVal(l, ["Downtime(Min)", "Downtime"])) || 0;
                }
            });

            let idealCT = parseFloat(getSafeVal(sampleMach, ["IdealCT", "Target"])) || 1;
            let plannedTime = 480;
            let runTime = Math.max(0, plannedTime - totalDowntime);
            let availability = (runTime / plannedTime) * 100;
            let performance = runTime > 0 ? ((totalActual * idealCT) / runTime) * 100 : 0;
            let quality = totalActual > 0 ? (totalGood / totalActual) * 100 : 0;
            let oee = (availability / 100) * (performance / 100) * (quality / 100) * 100;
            if(isNaN(oee)) oee = 0;

            return {
                productName: getSafeVal(sampleMach, ["ProductName", "Product"]) || 'Standard Part',
                operation: getSafeVal(sampleMach, ["Operation"]) || 'Machining',
                machName: getSafeVal(sampleMach, ["MachineName", "Machine"]) || 'Machine 1',
                asset: getSafeVal(sampleMach, ["AssetNumber", "Barcode"]) || '000',
                avail: availability > 100 ? 100 : availability,
                perf: performance > 100 ? 100 : performance,
                qual: quality > 100 ? 100 : quality,
                oee: oee
            };
        }
    </script>
</body>
</html>
