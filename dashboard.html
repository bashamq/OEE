<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Live Shop Floor Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #080d14; margin: 0; padding: 20px; color: #f8fafc; }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: #0f1722; color: white; padding: 18px 25px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #1e293b; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .header h2 { margin: 0; font-size: 22px; text-transform: uppercase; color: #4ade80; }
        
        .kpi-container { display: flex; gap: 15px; }
        .kpi-card { background: rgba(15,23,34,0.9); padding: 10px 18px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
        .kpi-card span { display: block; font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        .kpi-card strong { font-size: 18px; color: #4ade80; }

        /* FILTER BAR */
        .filter-section { background: #0f1722; padding: 15px 20px; border-radius: 12px; margin-bottom: 25px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; border: 1px solid #1e293b; }
        .filter-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 200px; }
        .filter-group label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; }
        .filter-section select, .filter-section input { padding: 10px 15px; border-radius: 8px; border: 1px solid #334155; background: #080d14; color: white; font-family: 'Poppins', sans-serif; font-size: 14px; }

        /* SCADA CARD LAYOUT (EXACTLY LIKE REFERENCE PICTURE) */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .scada-card { background: #0f1722; border-radius: 16px; padding: 25px 20px; border: 1px solid #1e293b; box-shadow: 0 10px 30px rgba(0,0,0,0.6); text-align: center; transition: 0.3s; }
        .scada-card:hover { transform: translateY(-4px); border-color: #4ade80; }
        
        .scada-title { font-size: 21px; font-weight: 700; color: #f8fafc; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .order-box { background: #080d14; padding: 12px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #1e293b; }
        .order-box span { display: block; font-size: 11px; color: #4ade80; text-transform: uppercase; font-weight: 600; margin-bottom: 3px; }
        .order-box strong { font-size: 15px; color: #e2e8f0; font-weight: 500; }
        
        .oee-display { margin: 15px 0; }
        .oee-display span { display: block; font-size: 12px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        .oee-display h1 { margin: 5px 0; font-size: 42px; font-weight: 700; color: #ffffff; letter-spacing: -1px; }

        /* CIRCULAR GAUGES ROW */
        .gauges-row { display: flex; justify-content: space-around; margin: 20px 0; background: #080d14; padding: 15px 10px; border-radius: 12px; border: 1px solid #1e293b; }
        .gauge-box { text-align: center; width: 85px; position: relative; }
        .gauge-box canvas { display: block; margin: 0 auto; }
        .gauge-box span { display: block; font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-top: 8px; font-weight: 600; }

        /* PROCESS STEPS ROW */
        .steps-box { margin-top: 20px; background: #080d14; padding: 15px; border-radius: 12px; border: 1px solid #1e293b; }
        .steps-title { font-size: 12px; color: #4ade80; text-transform: uppercase; font-weight: 600; margin-bottom: 10px; display: block; }
        .steps-row { display: flex; justify-content: center; gap: 12px; }
        .step-bubble { width: 36px; height: 36px; border-radius: 50%; background: #1e293b; color: #94a3b8; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; border: 1px solid #334155; }
        .step-bubble.active { background: rgba(74,222,128,0.2); color: #4ade80; border-color: #4ade80; box-shadow: 0 0 12px rgba(74,222,128,0.4); }

        .no-data { text-align: center; padding: 50px; color: #94a3b8; font-size: 16px; background: #0f1722; border-radius: 12px; grid-column: 1 / -1; }
        .live-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #4ade80; font-weight: 600; }
        .live-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; animation: blink 1.5s infinite; }
        @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <h2>🏭 Shop Floor SCADA Dashboard</h2>
            <div class="live-indicator" style="margin-top: 5px;"><div class="live-dot"></div> Live Auto-Refreshing (Every 5s)</div>
        </div>
        <div class="kpi-container">
            <div class="kpi-card"><span>Shop OEE</span><strong id="kpiOEE">0.0%</strong></div>
            <div class="kpi-card"><span>Avg MTTR</span><strong id="kpiMTTR">14 min</strong></div>
            <div class="kpi-card"><span>Avg MTBF</span><strong id="kpiMTBF">135 min</strong></div>
        </div>
    </div>

    <div class="filter-section">
        <div class="filter-group">
            <label>Production Line View</label>
            <select id="lineFilter" onchange="renderDashboard()">
                <option value="">-- All Lines (Factory Overview) --</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Filter Date</label>
            <input type="date" id="dateFilter" onchange="renderDashboard()">
        </div>
        <div class="filter-group">
            <label>Shift</label>
            <select id="shiftFilter" onchange="renderDashboard()">
                <option value="">All Shifts</option>
                <option value="Morning">Morning</option>
                <option value="Evening">Evening</option>
                <option value="Night">Night</option>
            </select>
        </div>
    </div>

    <div id="cardsContainer" class="cards-grid"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzREGDC03uDNfgswSy49bMwGtlzok9fiT2Ro1w78JwfmPTp93hhmFnaSRz0pmE3mXJrXA/exec";
        
        let globalMachines = [];
        let globalLogs = [];
        let chartInstances = {};

        function getSafeVal(obj, possibleKeys) {
            let lowerKeys = possibleKeys.map(k => k.toLowerCase().replace(/\s/g, ''));
            for(let key in obj) { if(lowerKeys.includes(key.toLowerCase().replace(/\s/g, ''))) return obj[key]; }
            return "";
        }

        window.onload = function() {
            let today = new Date().toISOString().split('T')[0];
            document.getElementById("dateFilter").value = today;
            fetchData();
            setInterval(() => { fetchData(true); }, 5000);
        };

        function fetchData(isSilent = false) {
            fetch(API_URL)
                .then(res => res.json())
                .then(data => {
                    globalMachines = data.machines || [];
                    globalLogs = data.logs || [];
                    if(!isSilent) populateLines();
                    renderDashboard();
                })
                .catch(err => console.error("Error fetching live data:", err));
        }

        function populateLines() {
            const lineSelect = document.getElementById("lineFilter");
            let currentVal = lineSelect.value;
            let lines = [...new Set(globalMachines.map(m => getSafeVal(m, ["LineName", "Line"])))].filter(Boolean);
            
            lineSelect.innerHTML = '<option value="">-- All Lines (Factory Overview) --</option>';
            lines.forEach(l => {
                let opt = document.createElement("option");
                opt.value = l; opt.innerText = l;
                lineSelect.appendChild(opt);
            });
            lineSelect.value = currentVal;
        }

        function renderDashboard() {
            const selectedLine = document.getElementById("lineFilter").value;
            const selectedDate = document.getElementById("dateFilter").value;
            const selectedShift = document.getElementById("shiftFilter").value;
            const container = document.getElementById("cardsContainer");
            container.innerHTML = "";

            let isLineSpecific = selectedLine !== "";
            let cardsToRender = [];

            if (!isLineSpecific) {
                // ALL LINES VIEW: Get unique lines
                let lines = [...new Set(globalMachines.map(m => getSafeVal(m, ["LineName", "Line"])))].filter(Boolean);
                lines.forEach(lineName => {
                    let lineMachs = globalMachines.filter(m => getSafeVal(m, ["LineName", "Line"]) === lineName);
                    let stats = calculateStatsForGroup(lineMachs, selectedDate, selectedShift);
                    cardsToRender.push({ title: lineName, subtitle: stats.productName, ...stats, isLine: true });
                });
            } else {
                // SPECIFIC LINE VIEW: Get individual machines/operations inside this line
                let lineMachs = globalMachines.filter(m => getSafeVal(m, ["LineName", "Line"]) === selectedLine);
                lineMachs.forEach((mach, idx) => {
                    let stats = calculateStatsForGroup([mach], selectedDate, selectedShift);
                    cardsToRender.push({ 
                        title: stats.operation, 
                        subtitle: `Mach: ${stats.machName} (${stats.asset}) | ${stats.productName}`, 
                        ...stats, 
                        isLine: false 
                    });
                });
            }

            if (cardsToRender.length === 0) {
                container.innerHTML = `<div class="no-data">No production data found for this selection.</div>`;
                return;
            }

            let totalShopOEE = 0;
            cardsToRender.forEach((cardData, idx) => {
                totalShopOEE += cardData.oee;

                let card = document.createElement("div");
                card.className = "scada-card";
                card.innerHTML = `
                    <div class="scada-title">${cardData.title}</div>
                    <div class="order-box">
                        <span>Current Order / Product</span>
                        <strong>${cardData.subtitle}</strong>
                    </div>
                    <div class="oee-display">
                        <span>OEE Performance</span>
                        <h1>${cardData.oee.toFixed(1)}%</h1>
                    </div>
                    <div class="gauges-row">
                        <div class="gauge-box">
                            <canvas id="gaugeQual_${idx}" width="70" height="70"></canvas>
                            <span>Quality</span>
                        </div>
                        <div class="gauge-box">
                            <canvas id="gaugePerf_${idx}" width="70" height="70"></canvas>
                            <span>Performance</span>
                        </div>
                        <div class="gauge-box">
                            <canvas id="gaugeAvail_${idx}" width="70" height="70"></canvas>
                            <span>Availability</span>
                        </div>
                    </div>
                    <div class="steps-box">
                        <span class="steps-title">Process Step Sequence</span>
                        <div class="steps-row">
                            <div class="step-bubble ${cardData.opSeq === 1 ? 'active' : ''}">1</div>
                            <div class="step-bubble ${cardData.opSeq === 2 ? 'active' : ''}">2</div>
                            <div class="step-bubble ${cardData.opSeq === 3 ? 'active' : ''}">3</div>
                            <div class="step-bubble ${cardData.opSeq === 4 ? 'active' : ''}">4</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);

                // Render circular arc gauges using Chart.js doughnut
                setTimeout(() => {
                    createArcGauge(`gaugeQual_${idx}`, cardData.qual);
                    createArcGauge(`gaugePerf_${idx}`, cardData.perf);
                    createArcGauge(`gaugeAvail_${idx}`, cardData.avail);
                }, 50);
            });

            document.getElementById("kpiOEE").innerText = (totalShopOEE / cardsToRender.length).toFixed(1) + "%";
        }

        function createArcGauge(canvasId, percentage) {
            const ctx = document.getElementById(canvasId);
            if(!ctx) return;
            if (chartInstances[canvasId]) chartInstances[canvasId].destroy();

            let val = Math.min(Math.max(percentage, 0), 100);
            chartInstances[canvasId] = new Chart(ctx.getContext('2d'), {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [val, 100 - val],
                        backgroundColor: ['#4ade80', '#1e293b'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: false,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false }, tooltip: { enabled: false } },
                    cutout: '75%',
                    rotation: -90,
                    circumference: 180
                },
                plugins: [{
                    id: 'textCenter',
                    beforeDraw: function(chart) {
                        let width = chart.width, height = chart.height, ctx = chart.ctx;
                        ctx.restore();
                        let fontSize = (height / 32).toFixed(2);
                        ctx.font = "bold " + fontSize + "rem Poppins, sans-serif";
                        ctx.textBaseline = "middle";
                        ctx.fillStyle = "#ffffff";
                        let text = Math.round(val), textX = Math.round((width - ctx.measureText(text).width) / 2), textY = height / 1.5;
                        ctx.fillText(text, textX, textY);
                        ctx.save();
                    }
                }]
            });
        }

        function calculateStatsForGroup(machinesArray, selectedDate, selectedShift) {
            let totalActual = 0, totalGood = 0, totalDowntime = 0;
            let assetList = machinesArray.map(m => String(getSafeVal(m, ["AssetNumber", "Barcode"])).trim());
            let sampleMach = machinesArray[0] || {};

            let groupLogs = globalLogs.filter(l => {
                let logAsset = String(getSafeVal(l, ["Barcode#", "Barcode", "AssetNumber"])).trim();
                if (!assetList.includes(logAsset)) return false;

                let rawDate = getSafeVal(l, ["Timestamp", "Date"]);
                if (selectedDate && rawDate) {
                    let logDateStr = new Date(rawDate).toISOString().split('T')[0];
                    if (logDateStr !== selectedDate) return false;
                }
                if (selectedShift) {
                    let logShift = String(getSafeVal(l, ["Shift"])).trim().toLowerCase();
                    if (logShift !== selectedShift.toLowerCase()) return false;
                }
                return true;
            });

            groupLogs.forEach(l => {
                let type = String(getSafeVal(l, ["EntryType", "Type"])).trim().toLowerCase();
                if(type.includes("performance") || type.includes("production")) {
                    totalActual += parseFloat(getSafeVal(l, ["TotalCount", "Actual"])) || 0;
                }
                if(type.includes("quality")) {
                    totalGood += parseFloat(getSafeVal(l, ["GoodCount", "GoodParts"])) || 0;
                }
                if(type.includes("availability") || type.includes("maintenance")) {
                    totalDowntime += parseFloat(getSafeVal(l, ["Downtime(Min)", "Downtime"])) || 0;
                }
            });

            let idealCT = parseFloat(getSafeVal(sampleMach, ["IdealCT", "Target"])) || 1;
            let plannedTime = 480;
            let runTime = Math.max(0, plannedTime - totalDowntime);
            let availability = (runTime / plannedTime) * 100;
            let performance = runTime > 0 ? ((totalActual * idealCT) / runTime) * 100 : 0;
            let quality = totalActual > 0 ? (totalGood / totalActual) * 100 : 0;
            let oee = (availability / 100) * (performance / 100) * (quality / 100) * 100;
            if(isNaN(oee)) oee = 0;

            let parsedSeq = parseInt(getSafeVal(sampleMach, ["OpSequence", "Sequence"])) || 1;

            return {
                productName: getSafeVal(sampleMach, ["ProductName", "Product"]) || 'Gas Valve',
                operation: getSafeVal(sampleMach, ["Operation"]) || 'Machining',
                machName: getSafeVal(sampleMach, ["MachineName", "Machine"]) || 'Machine 1',
                asset: getSafeVal(sampleMach, ["AssetNumber", "Barcode"]) || '000',
                avail: availability > 100 ? 100 : availability,
                perf: performance > 100 ? 100 : performance,
                qual: quality > 100 ? 100 : quality,
                oee: oee,
                opSeq: parsedSeq > 4 ? 4 : (parsedSeq < 1 ? 1 : parsedSeq)
            };
        }
    </script>
</body>
</html>
