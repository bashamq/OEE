<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Machine Registration</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #e9ecef; padding: 15px; margin:0; }
        .container { max-width: 460px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 15px; font-size: 20px; }
        .loading-text { font-size: 13px; font-weight: bold; margin-bottom: 15px; text-align: center; color: #f39c12; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; color: #34495e; font-size: 13px; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
        .final-op-box { background:#e8f8f5; padding:10px; border-radius:8px; border:2px solid #1abc9c; margin-bottom: 12px;}
        .final-op-label { display:flex; align-items:center; gap:10px; margin:0; cursor:pointer; font-size:14px; color:#16a085; font-weight:bold;}
        .final-op-label input { width:18px; height:18px; cursor:pointer; }
        button.submit-btn { width: 100%; padding: 10px; background: #27ae60; color: white; border: none; border-radius: 5px; font-size: 15px; font-weight: bold; cursor: pointer; margin-top: 10px;}
    </style>
</head>
<body>
    <div class="container">
        <h2>System Registration</h2>
        <div id="loadingStatus" class="loading-text">Loading Master Data...</div>

        <form id="registerForm" style="display:none;">
            <div class="form-group">
                <label>Select Department</label>
                <select id="department" required><option value="">-- Select Department --</option></select>
            </div>
            <div class="form-group">
                <label>Select Production Line</label>
                <select id="lineName" required><option value="">-- Select Line --</option></select>
            </div>
            <div class="form-group">
                <label>Product / Part Name</label>
                <select id="productName" required><option value="">-- Select Product --</option></select>
            </div>
            <div class="form-group">
                <label>Op Sequence #</label>
                <input type="number" id="opSequence" placeholder="1, 2, 3..." required>
            </div>
            <div class="final-op-box">
                <label class="final-op-label"><input type="checkbox" id="isFinalOp">This is the FINAL Operation</label>
            </div>
            <div class="form-group"><label>Machine Name</label><input type="text" id="machineName" placeholder="e.g. Lathe 1" required></div>
            <div class="form-group"><label>Brand / Make</label><input type="text" id="brand" placeholder="e.g. Fanuc" required></div>
            <div class="form-group"><label>Asset Number (Barcode)</label><input type="text" id="assetNumber" placeholder="e.g. 14185" required></div>
            <div class="form-group"><label>Operation</label><input type="text" id="operation" placeholder="e.g. Turning" required></div>
            <div class="form-group"><label>Ideal Cycle Time (Min)</label><input type="number" step="0.01" id="idealCT" required></div>
            <div class="form-group"><label>Standard Production Target</label><input type="number" id="stdProduction" required></div>
            
            <hr style="margin: 15px 0;">
            <div class="form-group"><label>Maintenance Reasons</label><input type="text" id="maintReasons" placeholder="e.g. Motor Heat, Oil Leak"></div>
            <div class="form-group"><label>Performance Loss Reasons</label><input type="text" id="prodReasons" placeholder="e.g. Tool Change, Setup"></div>
            <div class="form-group"><label>Quality Reject Reasons</label><input type="text" id="qualReasons" placeholder="e.g. Porosity, Undersize"></div>

            <button type="submit" id="submitBtn" class="submit-btn">Register Machine</button>
        </form>
    </div>

    <script>
        function getSafeVal(obj, possibleKeys) {
            let lowerKeys = possibleKeys.map(k => k.toLowerCase().replace(/\s/g, ''));
            for(let key in obj) { if(lowerKeys.includes(key.toLowerCase().replace(/\s/g, ''))) return obj[key]; }
            return "";
        }

        window.onload = function() {
            google.script.run.withSuccessHandler(function(data) {
                document.getElementById('loadingStatus').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
                
                let masterData = data.masterData || [];
                let depts = [...new Set(masterData.map(m => getSafeVal(m, ["Department"])))].filter(Boolean);
                let lines = [...new Set(masterData.map(m => getSafeVal(m, ["Line"])))].filter(Boolean);
                let prods = [...new Set(masterData.map(m => getSafeVal(m, ["Product"])))].filter(Boolean);

                populateSelect('department', depts, '-- Select Department --');
                populateSelect('lineName', lines, '-- Select Line --');
                populateSelect('productName', prods, '-- Select Product --');
            }).getAppData();
        };

        function populateSelect(id, items, defaultText) {
            let sel = document.getElementById(id);
            sel.innerHTML = `<option value="">${defaultText}</option>`;
            items.forEach(item => {
                let opt = document.createElement("option");
                opt.value = item; opt.innerText = item;
                sel.appendChild(opt);
            });
        }

        document.getElementById("registerForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.innerText = "Saving..."; btn.disabled = true;

            const payload = {
                formType: "registerMachine", 
                department: document.getElementById("department").value,
                lineName: document.getElementById("lineName").value,
                productName: document.getElementById("productName").value,
                machineName: document.getElementById("machineName").value,
                brand: document.getElementById("brand").value,
                assetNumber: document.getElementById("assetNumber").value,
                operation: document.getElementById("operation").value,
                idealCT: document.getElementById("idealCT").value,
                stdProduction: document.getElementById("stdProduction").value,
                maintReasons: document.getElementById("maintReasons").value, 
                prodReasons: document.getElementById("prodReasons").value,   
                qualReasons: document.getElementById("qualReasons").value,
                opSequence: document.getElementById("opSequence").value, 
                isFinalOp: document.getElementById("isFinalOp").checked ? "TRUE" : "FALSE" 
            };

            google.script.run.withSuccessHandler(function(res) {
                alert("Registered Successfully!");
                document.getElementById("registerForm").reset();
                btn.innerText = "Register Machine"; btn.disabled = false;
            }).processData(payload);
        });
    </script>
</body>
</html>
