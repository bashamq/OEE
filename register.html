<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Machine Registration & QR Label</title>
    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- HTML to Image Library (Save As Image ke liye) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #e9ecef; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #2980b9; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px;}
        button:hover { background: #2471a3; }
        
        /* ---------------- QR Label Professional Design ---------------- */
        #qrSection { text-align: center; display: none; margin-top: 20px; }
        .label-card {
            width: 320px;
            margin: 0 auto;
            padding: 25px 20px;
            background: #ffffff;
            border: 3px solid #2c3e50; /* Industrial thick border */
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .label-card h2 { margin: 0; font-size: 26px; color: #000; text-transform: uppercase; letter-spacing: 1px; }
        .asset-text { font-size: 18px; font-weight: bold; color: #333; margin: 5px 0 20px 0; }
        .qr-wrapper { display: flex; justify-content: center; margin: 15px 0; padding: 10px; background: #fff; }
        .op-text { font-size: 18px; font-weight: bold; color: #2980b9; margin: 20px 0 0 0; border-top: 2px dashed #bdc3c7; padding-top: 15px; text-transform: uppercase; }
        
        .action-buttons { display: flex; gap: 10px; margin-top: 25px; }
        .btn-print { background: #27ae60; flex: 1; }
        .btn-print:hover { background: #219150; }
        .btn-save { background: #f39c12; flex: 1; }
        .btn-save:hover { background: #d68910; }
        .btn-back { background: #7f8c8d; margin-top: 15px; }

        /* ---------------- Print Mode Layout ---------------- */
        @media print {
            body { background: white; margin: 0; padding: 0; }
            body * { visibility: hidden; } /* Hide everything */
            #printLabel, #printLabel * { visibility: visible; } /* Show only the label */
            
            /* Center the label on the printed page */
            #printLabel {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
                box-shadow: none; /* Remove shadow for printing */
                border: 2px solid #000;
            }
            @page { margin: 0; } /* Remove default browser headers/footers */
        }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        <h2>Register New Machine</h2>
        <form id="registerForm">
            <div class="form-group">
                <label>Select Production Line</label>
                <select id="lineName" required>
                    <option value="">-- Select Line --</option>
                    <option value="Axle 385">1. Axle 385</option>
                    <option value="Sump 385">2. Sump 385</option>
                    <option value="Hyd. Lift Cover">3. Hyd. Lift Cover</option>
                    <option value="Cylinder 240/385">4. Cylinder 240/385</option>
                    <option value="FAS 350">5. FAS 350</option>
                    <option value="Spacer Block/Adaptor Plate/PTO">6. Spacer Block/Adaptor Plate/PTO</option>
                    <option value="Rear Wheel 1st and 2nd">7. Rear Wheel 1st and 2nd</option>
                    <option value="Diff Case 385 (set)">8. Diff Case 385 (set)</option>
                    <option value="Piston 240/385">9. Piston 240/385</option>
                    <option value="Front Support 350/385">10. Front Support 350/385</option>
                    <option value="Front Support 850/85-56">11. Front Support 850/85-56</option>
                    <option value="Diff Plate">12. Diff Plate</option>
                    <option value="FAS 480">13. FAS 480</option>
                    <option value="Diff Case 480">14. Diff Case 480</option>
                    <option value="Tube Final Drive 480/640/850">15. Tube Final Drive 480/640/850</option>
                    <option value="Hub 240/385/480">16. Hub 240/385/480</option>
                    <option value="Support Splitter">17. Support Splitter</option>
                    <option value="Small Parts">18. Small Parts</option>
                    <option value="Axle Casing 480/850/85-56">19. Axle Casing 480/850/85-56</option>
                    <option value="Casing Gear Box 480/850">20. Casing Gear Box 480/850</option>
                </select>
            </div>
            <div class="form-group"><label>Machine Name</label><input type="text" id="machineName" required></div>
            <div class="form-group"><label>Machine Brand / Make</label><input type="text" id="brand" required></div>
            <div class="form-group"><label>Asset Number (Barcode)</label><input type="text" id="assetNumber" required></div>
            <div class="form-group"><label>Operation</label><input type="text" id="operation" placeholder="e.g. Turning, Milling" required></div>
            <div class="form-group"><label>Ideal Cycle Time (Min)</label><input type="number" step="0.01" id="idealCT" required></div>
            <div class="form-group"><label>Standard Production (Shift)</label><input type="number" id="stdProduction" required></div>
            
            <button type="submit" id="submitBtn">Register Machine & Generate QR</button>
        </form>

        <div id="qrSection">
            <!-- Yeh hissa Print aur Save Image ke liye design kiya gaya hai -->
            <div id="printLabel" class="label-card">
                <h2 id="lblMachineName">Machine Name</h2>
                <p id="lblAssetNum" class="asset-text">Asset #: 00000</p>
                <div id="qrcode" class="qr-wrapper"></div>
                <p id="lblOperation" class="op-text">Operation Name</p>
            </div>
            
            <div class="action-buttons">
                <button class="btn-print" onclick="printQR()">🖨️ Print</button>
                <button class="btn-save" onclick="saveQR()">💾 Save Image</button>
            </div>
            <button class="btn-back" onclick="location.reload()">⬅️ Register Another Machine</button>
        </div>
    </div>

    <script>
        const ENTRY_FORM_URL = "https://bashamq.github.io/OEE/index.html"; 

        document.getElementById("registerForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const btn = document.getElementById("submitBtn");
            btn.innerText = "Registering..."; btn.disabled = true;

            const data = {
                formType: "registerMachine", 
                lineName: document.getElementById("lineName").value,
                machineName: document.getElementById("machineName").value,
                brand: document.getElementById("brand").value,
                assetNumber: document.getElementById("assetNumber").value,
                operation: document.getElementById("operation").value,
                idealCT: document.getElementById("idealCT").value,
                stdProduction: document.getElementById("stdProduction").value
            };

            fetch("https://script.google.com/macros/s/AKfycbyRkmh4_ofJjAftObCfnX9gmhqCa4xcsvSp143BXCUdQujfy4gaFkBMlEhsVrwa61HugQ/exec", {
                method: "POST",
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                alert("Machine Registered Successfully!");
                generateQR(data.assetNumber, data.machineName, data.operation);
            })
            .catch(error => {
                alert("Error saving data!");
                btn.innerText = "Register Machine & Generate QR"; btn.disabled = false;
            });
        });

        function generateQR(asset, name, operation) {
            // Form hide karein, Label show karein
            document.getElementById("registerForm").style.display = "none";
            document.querySelector("h2").style.display = "none"; // Hide main heading
            document.getElementById("qrSection").style.display = "block";
            
            // Label ka data set karein
            document.getElementById("lblMachineName").innerText = name;
            document.getElementById("lblAssetNum").innerText = "Asset #: " + asset;
            document.getElementById("lblOperation").innerText = "Op: " + operation;
            
            // QR Code generate karein
            const qrText = ENTRY_FORM_URL + "?asset=" + asset;
            document.getElementById("qrcode").innerHTML = ""; 
            new QRCode(document.getElementById("qrcode"), { 
                text: qrText, 
                width: 180, 
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff"
            });
        }

        function printQR() {
            window.print();
        }

        function saveQR() {
            const label = document.getElementById("printLabel");
            const assetName = document.getElementById("lblAssetNum").innerText.split(": ")[1];
            
            // html2canvas library label ko image mein convert karti hai
            html2canvas(label).then(canvas => {
                const link = document.createElement('a');
                link.download = `Machine_${assetName}_QR.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
